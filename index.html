<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="light only"/>
<meta name="theme-color" content="#0C0C0E"/>
<!-- manifest link removed: the PWA manifest isn't used in the packaged
     desktop build and the missing ./manifest.json triggered a "Not allowed
     to load local resource" error that blanked the renderer. -->
<title>ISS Weighbridge</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#EEF3FA;color:#1A2A3A;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;overflow:hidden;color-scheme:light}
:root{
  /* Commodities Variation: black body, gold trim.
     --navy / --navy2 drive every dark surface (header, side bar, weight card,
     navy buttons); --blue / --light are the accent used for borders, focus
     rings, links and highlights. Remapping just these six keeps the whole app
     on-brand without touching a single component rule. */
  --navy:#141414; --navy2:#000000; --blue:#B08A3E; --light:#D9B45B;
  --grey:#6B7480; --grey-d:#2A2A2A;
  --bg:#F4F1EA; --card:#ffffff; --border:#E2DCCD; --border2:#CFC5AC;
  --text:#1A1A1A; --text2:#4A443A; --text3:#8A8172;
  --green:#1F9D57; --greenl:#E4F6EC; --red:#D24A36; --redl:#FBE9E5;
  --amber:#C8881A; --amberl:#FCF1DC; --r:10px;
}
input,select,textarea{color:#1A2A3A!important;background:#fff!important;border:1.5px solid var(--border2);border-radius:8px;padding:9px 12px;outline:none;width:100%;font-family:inherit;font-size:13px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(176,138,62,.18)}
button{cursor:pointer;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.06)} button:active{transform:scale(.98)}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:7px}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:7px;opacity:.6;border:3px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{opacity:1;background:var(--navy);background-clip:padding-box;border:3px solid transparent}
datalist option{background:#fff;color:#1A2A3A}

/* FULLSCREEN OVERLAYS */
.fov{position:fixed;inset:0;background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 52%,var(--blue) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px}
.fov-card{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.fov-logo{display:flex;justify-content:center;margin-bottom:24px}
.fov-logo svg{height:64px;width:auto}
.fov-title{font-size:17px;font-weight:800;color:var(--navy);text-align:center;margin-bottom:6px}
.fov-sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:20px}

/* PIN PAD */
.pin-display{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue);background:#EEF3FA;transition:background .15s}
.pin-dot.filled{background:var(--blue)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pin-btn{padding:16px;border-radius:10px;background:#EEF3FA;color:var(--navy);font-size:20px;font-weight:700;border:1.5px solid var(--border);text-align:center}
.pin-btn:active{background:var(--blue);color:#fff;border-color:var(--blue)}
.user-cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.user-card{padding:12px 18px;border-radius:10px;background:#EEF3FA;border:2px solid var(--border);cursor:pointer;text-align:center;min-width:90px;transition:all .15s}
.user-card:hover,.user-card.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.user-card .uc-n{font-weight:800;font-size:13px}
.user-card .uc-r{font-size:10px;opacity:.7;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;max-height:100dvh}
#deckbar{display:flex;gap:1px;background:#0d1828;border-bottom:1px solid #27405c;flex-shrink:0;overflow-x:auto}
.dk{flex:1;min-width:78px;padding:5px 8px;background:#101f33;border-top:3px solid var(--text3)}
.dk-l{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text3)}
.dk-v{font-family:'Courier New',monospace;font-size:16px;font-weight:800;line-height:1.15}
.dk-x{font-size:9.5px;font-family:'Courier New',monospace;color:var(--text3)}
#hdr{background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 48%,var(--blue) 100%);height:78px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:3px solid var(--light);box-shadow:0 2px 16px rgba(0,0,0,.45)}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-logo{height:62px;width:auto;flex-shrink:0}
.hdr-names{line-height:1.2}
.hdr-co{font-size:16px;font-weight:900;color:#fff;letter-spacing:.3px}
.hdr-tag{font-size:10px;color:var(--light);letter-spacing:2.5px;font-weight:700;text-transform:uppercase;margin-top:1px}
.hdr-r{display:flex;align-items:center;gap:10px}
.bridge-pill{padding:4px 10px;border-radius:6px;border:1.5px solid rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);cursor:pointer}
.bridge-pill.active{background:var(--blue);border-color:var(--blue)}
.conn-pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.2)}
.w-hdr{display:flex;align-items:baseline;gap:3px}
#hdr-wt{font-size:26px;font-weight:900;font-family:'Courier New',monospace;color:#fff;letter-spacing:2px;min-width:80px;text-align:right;transition:color .3s}
#hdr-wt.over{color:#FF5D5D!important;animation:flash .5s infinite alternate}
@keyframes flash{from{opacity:1}to{opacity:.3}}
#hdr-unit{font-size:12px;color:var(--light);font-weight:700}
.hdr-user{padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
.hdr-user:hover{background:rgba(255,255,255,.22)}

/* TABS */
#tab-bar{display:flex;background:#fff;border-bottom:2px solid var(--border);flex-shrink:0;overflow-x:auto}
#tab-bar::-webkit-scrollbar{height:10px}
.tab{padding:12px 16px;border:none;background:transparent;color:var(--text3);font-size:12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;margin-bottom:-2px}
.tab.on{color:var(--navy);border-bottom-color:var(--blue);background:#f0f6fb}
.tab:hover:not(.on){color:var(--blue);background:#f7fafd}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}

/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(26,58,107,.07)}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:10px;font-weight:800;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-hd h2{font-size:16px;font-weight:800;color:var(--navy)}
.sec-hd .sub{font-size:11px;color:var(--text3);margin-top:2px}

/* BUTTONS */
.btn{padding:10px 18px;font-weight:700;border-radius:8px;font-size:13px}
.btn-navy{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.btn-blue{background:linear-gradient(135deg,var(--blue),#1A6FA8);color:#fff}
.btn-light{background:linear-gradient(135deg,var(--light),var(--blue));color:#fff}
.btn-green{background:linear-gradient(135deg,#1B7A43,#15613A);color:#fff}
.btn-red{background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff}
.btn-ghost{background:#EEF3FA;color:var(--text2);border:1.5px solid var(--border2)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-amber{background:linear-gradient(135deg,#D97706,#B45309);color:#fff}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-full{width:100%;display:block;text-align:center;padding:13px}

/* FORM */
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:800;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Three-up rows for the optional vehicle fields — turns five stacked rows
   into three and claws back ~124px on the weigh screen. Falls back to two
   columns on narrow screens so nothing is ever cramped. */
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:1180px){.row3{grid-template-columns:1fr 1fr}}
/* Capture buttons never leave the viewport, however many custom fields a
   site adds — this is what stops the clerk scrolling to finish a job. */
.wsticky{position:sticky;bottom:0;background:var(--card);padding:10px 0 2px;
  margin-top:6px;border-top:1px solid var(--border);z-index:5}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* WEIGHT BOXES */
.wbox-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.wbox{background:#f8fafc;border:1.5px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.wbox.net{background:#EEF3FA;border-color:var(--blue);border-width:2px}
.wbox-lbl{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.wbox-val{font-size:22px;font-weight:900;font-family:'Courier New',monospace;color:var(--text)}
.wbox.net .wbox-val{color:var(--navy);font-size:26px}
.wbox-t{font-size:10px;color:var(--text3);margin-top:2px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:8px;border:1px solid var(--border);padding:14px;text-align:center;border-top:3px solid var(--blue)}
.stat-v{font-size:26px;font-weight:900;font-family:'Courier New',monospace;color:var(--navy)}
.stat-l{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.stat.green{border-top-color:var(--green)} .stat.green .stat-v{color:var(--green)}
.stat.amber{border-top-color:var(--amber)} .stat.amber .stat-v{color:var(--amber)}
.stat.red{border-top-color:var(--red)} .stat.red .stat-v{color:var(--red)}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-blue{background:#F5EBD4;color:#6B5320}
.b-green{background:var(--greenl);color:var(--green)}
.b-red{background:var(--redl);color:var(--red)}
.b-amber{background:var(--amberl);color:var(--amber)}
.b-gray{background:#F1F5F9;color:var(--text2)}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;border-bottom:2px solid var(--border);color:var(--text3);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#f8fafc;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:#f7fafd}

/* MODAL */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8888;display:none;align-items:center;justify-content:center;padding:20px}
#modal-bg.open{display:flex!important}
#modal-box{background:#fff;border-radius:14px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.modal-hdr h3{font-size:15px;font-weight:800;color:var(--navy)}
.modal-close{background:none;border:none;font-size:22px;color:var(--text3);cursor:pointer;padding:0 4px;line-height:1}
.modal-body{padding:20px}

/* WEIGHBOARD DRAWER */
#wb{position:fixed;bottom:0;left:0;right:0;z-index:7777;background:linear-gradient(135deg,var(--navy),var(--navy2));border-top:2px solid var(--light);transition:transform .28s cubic-bezier(.4,0,.2,1)}
#wb.closed{transform:translateY(calc(100% - 48px))}
#wb-bar{height:48px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
#wb-tag{font-size:11px;font-weight:800;color:var(--light);letter-spacing:2px;display:flex;align-items:center;gap:8px}
#wb-live{font-size:24px;font-weight:900;font-family:'Courier New',monospace;color:var(--blue);letter-spacing:2px}
#wb-body{padding:12px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* SETTINGS ROWS */
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.sr:last-child{border-bottom:none}
.sr-l{flex:1}
.sr-lbl{font-size:13px;font-weight:600;color:var(--text)}
.sr-sub{font-size:11px;color:var(--text3);margin-top:2px}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--border2);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--blue)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:9px;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{left:23px}
.sg{margin-bottom:20px}
.sg-title{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:4px;padding-bottom:6px;border-bottom:2px solid var(--border)}

/* TRUCKS ON SITE */
.truck-card{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
.truck-card:hover{border-color:var(--blue);background:#f0f6fb}
.tc-reg{font-size:18px;font-weight:900;font-family:'Courier New',monospace;letter-spacing:2px;color:var(--navy)}
.tc-info{font-size:11px;color:var(--text3);margin-top:3px}
.tc-timer{font-size:10px;color:var(--amber);margin-top:2px;font-weight:700}
.tc-w{font-size:15px;font-weight:900;font-family:'Courier New',monospace;color:var(--navy);text-align:right}
.tc-wl{font-size:10px;color:var(--text3);text-align:right;margin-top:2px}

/* DB LIST */
.db-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
.db-item:last-child{border-bottom:none}
.db-item .di-name{font-weight:600;flex:1}
.db-item .di-rate{font-size:11px;color:var(--blue);font-weight:700;margin-right:10px}

/* PERMISSION CHIPS */
.perm-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid;user-select:none;transition:all .15s}
.perm-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.perm-chip.off{background:#EEF3FA;color:var(--text3);border-color:var(--border)}

/* TOAST */
#toast{position:fixed;bottom:70px;right:18px;z-index:9999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.15);display:none;max-width:340px;border-left:4px solid;animation:slidein .2s}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
#toast.success{background:#fff;color:var(--green);border-color:var(--green)}
#toast.error{background:#fff;color:var(--red);border-color:var(--red)}
#toast.info{background:#fff;color:var(--navy);border-color:var(--blue)}

/* MISC */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty .ico{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6}
.dash-wrap{display:grid;grid-template-columns:1fr 340px;gap:12px}
@media(max-width:860px){.dash-wrap{grid-template-columns:1fr}}
.bar-chart{display:flex;align-items:flex-end;gap:3px;height:70px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--light),var(--blue));border-radius:2px 2px 0 0;min-height:2px}
.bar-lbl{font-size:8px;color:var(--text3)}
.order-prog{height:6px;background:var(--border);border-radius:3px;margin-top:6px;overflow:hidden}
.order-prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--light));border-radius:3px;transition:width .3s}

/* ISS light theme — base styles apply (dark overrides removed) */

/* orange monochrome icons */
.ti{color:transparent;text-shadow:0 0 0 var(--blue);margin-right:3px}
.empty .ico{color:transparent;text-shadow:0 0 0 var(--blue)}

/* stable / in-motion indicator */
.ns-motion{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;padding:4px 11px;border-radius:999px;border:1px solid var(--border);color:var(--text3);
  font-family:'Segoe UI',system-ui,sans-serif;white-space:nowrap;transition:color .2s,border-color .2s}
.ns-motion .ns-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:.2s}
.ns-motion.stable{color:var(--green);border-color:rgba(55,178,107,.45)}
.ns-motion.stable .ns-dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.ns-motion.motion{color:var(--amber);border-color:rgba(224,169,46,.45)}
.ns-motion.motion .ns-dot{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:nsPulse .55s infinite alternate}
@keyframes nsPulse{from{opacity:1}to{opacity:.3}}
#hdr-motion{padding:3px 9px;font-size:10px}
</style>
</head>
<body>

<!-- ACTIVATION OVERLAY -->
<div id="ovr-act" class="fov">
  <div class="fov-card">
    <div class="fov-logo" id="act-logo"></div>
    <div class="fov-title">ISS Weighbridge</div>
    <div class="fov-sub">Enter your installation code to unlock this software</div>
    <div class="field"><label>Installation Code</label>
      <input id="act-input" type="password" inputmode="text" placeholder="••••••••"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             onkeydown="if(event.key==='Enter')doActivate()"/>
    </div>
    <div id="act-fail" style="text-align:center;margin-top:8px;font-size:11px;color:#C0392B;min-height:14px"></div>
    <button class="btn btn-navy btn-full" style="margin-top:6px" onclick="doActivate()">🔓 Activate</button>
    <div style="text-align:center;margin-top:12px;font-size:11px;color:var(--text3)">Contact Industrial Scale Solutions for your activation code</div>
  </div>
</div>

<!-- LOGIN OVERLAY -->
<div id="ovr-login" class="fov" style="display:none">
  <div class="fov-card">
    <div class="fov-logo" id="login-logo"></div>
    <div class="fov-title" id="login-title">Welcome</div>
    <div class="fov-sub">Select your name, then enter your PIN</div>
    <div class="user-cards" id="user-cards"></div>
    <div id="pin-area" style="display:none">
      <div style="font-size:11px;font-weight:800;color:var(--text3);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px" id="pin-user-name"></div>
      <div class="pin-display" id="pin-dots"></div>
      <div class="pin-pad" id="pin-pad"></div>
      <button class="btn btn-ghost btn-full" style="margin-top:12px;font-size:12px" onclick="selectUser(null)">← Back</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <div id="hdr">
    <div class="hdr-l">
      <div id="hdr-logo-wrap"></div>
      <div class="hdr-names">
        <div class="hdr-co" id="hdr-co">Industrial Scale Solutions</div>
        <div class="hdr-tag" id="hdr-tag">Weighbridge</div>
      </div>
    </div>
    <div class="hdr-r">
      <div id="bridge-btns" style="display:none;gap:6px"></div>
      <div id="conn-pill" class="conn-pill">◎ Sim</div>
      <div class="w-hdr">
        <span id="hdr-wt">0</span>
        <span id="hdr-unit">kg</span>
      </div>
      <div id="hdr-motion" class="ns-motion stable"><span class="ns-dot"></span><span class="ns-motion-lbl">STABLE</span></div>
      <span id="saved-badge" style="font-size:10px;color:#FCD34D;font-weight:700;font-family:'Courier New',monospace;white-space:nowrap" title="Last backup">🖫 —</span>
      <div class="hdr-user" id="hdr-user" onclick="logout()">👤 ···</div>
    </div>
  </div>
  <div id="deckbar" style="display:none"></div>
  <div id="tab-bar"></div>
  <div id="content"></div>
</div>

<!-- WEIGHBOARD DRAWER -->
<div id="wb" class="closed" style="display:none">
  <div id="wb-bar" onclick="toggleWB()">

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,

      out.writeByte(0xff);

<script>
'use strict';
// ══════════════════════════════════════════════════════════
// BUILD STAMP — must match "version" in package.json.
// CI fails the build if these two drift apart, so the number shown in the
// app is always the number that was actually built. Bump BOTH together.
// Format is deliberate: no spaces around '=', single quotes, one line —
// the workflow greps for it.
// ══════════════════════════════════════════════════════════
const RENDERER_BUILD='9.7.3';
window.RENDERER_BUILD=RENDERER_BUILD;
// ══════════════════════════════════════════════════════════
// DEBUG CONSOLE — permanent, toggleable diagnostic panel.
// Defined FIRST so every later function can safely call Debug.log().
// Off by default. Enable in Settings → Diagnostics, or Ctrl+Alt+D.
// Captures JS errors + sync activity on screen (DevTools is disabled
// in packaged builds). window.Debug so inline onclick handlers reach it.
// ══════════════════════════════════════════════════════════
window.Debug=(function(){
  var box=null, on=false, buffer=[];
  function paint(msg,color){
    if(!box) return;
    var line=document.createElement('div');
    if(color) line.style.color=color;
    line.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
    box.appendChild(line);
    box.scrollTop=box.scrollHeight;
    while(box.childNodes.length>250) box.removeChild(box.childNodes[1]);
  }
  function ensureBox(){
    if(box) return box;
    if(!document.body) return null;
    box=document.createElement('div');
    box.id='iss-dbg';
    box.style.cssText='position:fixed;right:6px;bottom:6px;width:360px;max-height:40vh;overflow:auto;'+
      'background:rgba(10,20,35,.92);color:#9fe;font:11px/1.35 monospace;padding:8px 10px;'+
      'border:1px solid #B08A3E;border-radius:6px;z-index:99999;white-space:pre-wrap;display:none';
    var hd=document.createElement('div');
    hd.style.cssText='color:#7fd;font-weight:bold;margin-bottom:4px;display:flex;justify-content:space-between';
    hd.innerHTML='<span>● ISS Debug Console</span><span style="cursor:pointer;color:#f99" onclick="Debug.clear()">clear</span>';
    box.appendChild(hd);
    document.body.appendChild(box);
    buffer.forEach(function(b){ paint(b.msg,b.color); }); buffer=[];
    return box;
  }
  function log(msg,color){
    if(!on){ buffer.push({msg:msg,color:color}); if(buffer.length>250) buffer.shift(); return; }
    if(ensureBox()) paint(msg,color);
  }
  function show(v){
    on=(v===undefined?!on:!!v);
    if(ensureBox()) box.style.display=on?'block':'none';
    if(on&&box){ buffer.forEach(function(b){ paint(b.msg,b.color); }); buffer=[]; }
    try{ if(typeof cfg==='object'&&cfg){ cfg.debugPanel=on; if(typeof saveCfg==='function') saveCfg(); } }catch(e){}
    return on;
  }
  function clear(){ if(box){ var kids=[].slice.call(box.childNodes); kids.slice(1).forEach(function(k){ box.removeChild(k); }); } buffer=[]; }
  window.addEventListener('error',function(e){ log('JS ERROR: '+(e.message||e.error)+' @ '+String(e.filename||'').split('/').pop()+':'+e.lineno,'#ff7b7b'); });
  window.addEventListener('unhandledrejection',function(e){ log('PROMISE REJECT: '+((e.reason&&e.reason.message)||e.reason),'#ff7b7b'); });
  window.addEventListener('keydown',function(e){ if(e.ctrlKey&&e.altKey&&(e.key==='d'||e.key==='D')) show(); });
  return {log:log, show:show, clear:clear, isOn:function(){return on;}};
})();
window._dbg=function(msg,color){ window.Debug.log(msg,color); };

// ── Enter-to-advance ───────────────────────────────────────────────
// Pressing Enter in a text/number/select field jumps to the next field in
// the same screen, so operators can key through the weigh form (and the
// complete-transaction modal) without reaching for the mouse. Enter on the
// LAST field does nothing destructive — the operator presses the weight
// button themselves. Textareas keep normal Enter (newline).
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  const el=e.target;
  if(!el || !el.tagName) return;
  const tag=el.tagName.toUpperCase();
  if(tag==='TEXTAREA' || tag==='BUTTON') return;      // don't hijack these
  if(tag!=='INPUT' && tag!=='SELECT') return;
  // collect the focusable fields within the same container (modal or content)
  const scope=el.closest('.modal-body, #content, .dash-wrap, body') || document;
  const fields=[].slice.call(scope.querySelectorAll('input:not([type=hidden]):not([disabled]), select:not([disabled])'))
                 .filter(function(f){ return f.offsetParent!==null; });   // visible only
  const i=fields.indexOf(el);
  if(i>=0 && i<fields.length-1){
    e.preventDefault();
    const nxt=fields[i+1];
    nxt.focus();
    if(nxt.select) try{ nxt.select(); }catch(_){}    // highlight so typing replaces
  } else if(i===fields.length-1){
    e.preventDefault();   // last field: swallow Enter so the form doesn't submit/reload
    el.blur();
  }
});

// ── Restore durable state BEFORE anything reads it (fixes activation/settings
//    resetting on some PCs where packaged file:// localStorage isn't persisted) ──
(function(){
  try{
    var disk = (window.issDesktop && window.issDesktop.diskState) || null;
    if(!disk) return;
    var keys=['iss8_act','iss8_cfg','iss8_usr','iss8_db','iss8_txs','iss8_pend','iss8_ord','iss8_audit','iss8_brand'];
    for(var i=0;i<keys.length;i++){
      var k=keys[i], cur=null;
      try{ cur=localStorage.getItem(k); }catch(e){}
      var empty = (cur===null||cur===''||cur==='null'||cur==='undefined');
      if(disk[k]!==undefined && empty){
        try{ localStorage.setItem(k, JSON.stringify(disk[k])); }catch(e){}
      } else if(disk[k]===undefined && !empty){
        // existing install: seed the durable store from current localStorage
        try{ if(window.issDesktop&&window.issDesktop.stateWrite) window.issDesktop.stateWrite(k, JSON.parse(cur)); }catch(e){}
      }
    }

// ══════════════════════════════════════════════════════════
// SECURITY — salted SHA-256 hashing (PINs, activation code)
// Plaintext is never stored. Uses Web Crypto (built into browser).
// ══════════════════════════════════════════════════════════
const ISS_SALT='ISS-WeighForward-2025-Mpumalanga';   // app-wide salt
async function hashStr(str){
  try{
    const data=new TextEncoder().encode(ISS_SALT+'|'+str);
    const buf=await crypto.subtle.digest('SHA-256',data);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch{ // fallback for non-secure contexts (rare)
    let h=0;const x=ISS_SALT+'|'+str;
    for(let i=0;i<x.length;i++){h=((h<<5)-h+x.charCodeAt(i))|0;}
    return 'fb'+(h>>>0).toString(16);
  }
}
async function verifyHash(str,hash){ return (await hashStr(str))===hash; }

// PIN lockout state (rate limiting)
let _pinFails={};   // userId -> {count, until}
function pinLocked(userId){
  const f=_pinFails[userId];
  if(f&&f.until&&Date.now()<f.until){
    return Math.ceil((f.until-Date.now())/1000);
  }
  return 0;
}
function recordPinFail(userId){
  const f=_pinFails[userId]||{count:0,until:0};
  f.count++;
  // exponential backoff: 3 tries free, then 30s, 2min, 10min, 30min
  if(f.count>=3){
    const steps=[30,120,600,1800];
    const idx=Math.min(f.count-3,steps.length-1);
    f.until=Date.now()+steps[idx]*1000;
  }
  _pinFails[userId]=f;
}
function clearPinFail(userId){ delete _pinFails[userId]; }

// AUDIT TRAIL — append-only log of every significant action
// Who did what, when, with before/after values. Never editable
// from the UI. This is your legal protection for disputes.
// ══════════════════════════════════════════════════════════
let auditTrail=G('iss8_audit',[]);
function auditLog(action,entity,entityId,detail,before,after){
  const entry={
    id:Date.now()+'-'+Math.random().toString(36).slice(2,6),
    ts:new Date().toISOString(),
    user:session?session.name:'(system)',
    userId:session?session.userId:'',
    action,        // login, weigh1, weigh2, complete, void, edit, delete, reprint, access, config
    entity,        // tx, order, user, settings, db
    entityId:entityId||'',
    detail:detail||'',
  };
  if(before!==undefined) entry.before=before;
  if(after!==undefined)  entry.after=after;
  auditTrail.unshift(entry);
  if(auditTrail.length>5000) auditTrail=auditTrail.slice(0,5000);  // cap
  try{P('iss8_audit',auditTrail);}catch{}
  // Mirror to IndexedDB so it survives a localStorage wipe
  if(typeof idbPut==='function') idbPut('meta',auditTrail.slice(0,500),'auditRecent');
}

// ══════════════════════════════════════════════════════════
// TRIPLE STORAGE — protect against load-shedding data loss
// Layer 1: localStorage (instant, size-limited)
// Layer 2: IndexedDB   (robust, unlimited, survives cache clear)
// Layer 3: Disk file   (File System Access API or Electron fs)
// On startup: compare all three, use the most complete set.
// ══════════════════════════════════════════════════════════
let _idb = null;
let _backupDir = null;  // FileSystemDirectoryHandle (browser)
let _lastSaved = null;  // timestamp of last successful write

function openIDB(){
  return new Promise(res=>{
    if(!window.indexedDB){return res(null);}
    const r = indexedDB.open('iss_wb_v8', 2);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('txs'))
        d.createObjectStore('txs', {keyPath:'id'});
      if(!d.objectStoreNames.contains('meta'))
        d.createObjectStore('meta');
    };
    r.onsuccess = e=>{ _idb = e.target.result; res(_idb); };
    r.onerror   = ()=>res(null);
  });
}
function idbPut(store, val, key){
  if(!_idb) return;
  try{ _idb.transaction(store,'readwrite').objectStore(store).put(val, key||undefined); }catch{}
}
// Clear an entire IndexedDB store. Needed when wiping data — without this the
// startup power-cut recovery finds the old records still in IndexedDB and
// restores them, silently undoing the wipe.
function idbClear(store){
  return new Promise(res=>{
    if(!_idb) return res(false);
    try{
      const r=_idb.transaction(store,'readwrite').objectStore(store).clear();
      r.onsuccess = ()=>res(true);
      r.onerror   = ()=>res(false);
    }catch{ res(false); }
  });
}
function idbGetAll(store){
  return new Promise(res=>{
    if(!_idb) return res([]);
    try{
      const r = _idb.transaction(store).objectStore(store).getAll();
      r.onsuccess = ()=>res(r.result||[]);
      r.onerror   = ()=>res([]);
    }catch{res([]);}
  });
}
function idbGet(store, key){
  return new Promise(res=>{
    if(!_idb) return res(null);
    try{
      const r = _idb.transaction(store).objectStore(store).get(key);
      r.onsuccess = ()=>res(r.result||null);
      r.onerror   = ()=>res(null);
    }catch{res(null);}
  });
}

// Write a single tx to IndexedDB immediately
function idbPutTx(tx){ idbPut('txs', tx); }

// File System Access API — user picks a folder ONCE, handle persisted
async function pickBackupFolder(){
  if(!window.showDirectoryPicker){
    toast('Disk backup needs Chrome/Edge desktop browser or the EXE app','error');
    return false;
  }
  try{
    const dir = await window.showDirectoryPicker({mode:'readwrite',id:'iss-backup'});
    _backupDir = dir;
    // Persist handle in IndexedDB so it survives page refresh
    idbPut('meta', dir, 'backupDir');
    toast('Backup folder set ✓ — auto-saving after every transaction','success',4000);
    return true;
  }catch(e){
    if(e.name !== 'AbortError') toast('Could not access folder: '+e.message,'error');

async function restoreBackupHandle(){
  const dir = await idbGet('meta','backupDir');
  if(!dir) return;
  try{
    // Check we still have permission
    const perm = await dir.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){ _backupDir = dir; return; }
    const req  = await dir.requestPermission({mode:'readwrite'});
    if(req === 'granted') _backupDir = dir;
  }catch{}
}
async function writeBackupFile(jsonStr){
  if(!_backupDir) return false;
  try{
    const d   = new Date();
    const pad = x=>String(x).padStart(2,'0');
    const dateStr = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    // Always overwrite Latest (fast read after power cut)
    const latest = await _backupDir.getFileHandle('ISS-Backup-Latest.json',{create:true});
    const wl = await latest.createWritable();
    await wl.write(jsonStr); await wl.close();
    // One dated file per day (keeps 30 days history)
    const dated = await _backupDir.getFileHandle('ISS-Backup-'+dateStr+'.json',{create:true});
    const wd = await dated.createWritable();
    await wd.write(jsonStr); await wd.close();
    return true;
  }catch(e){
    console.warn('Backup write failed:',e.message);
    return false;
  }
}

// ── THE MAIN BACKUP FUNCTION — called after every transaction ──
async function autoBackup(why){
  // Build snapshot
  const snap = {
    version:'8.0', savedAt:new Date().toISOString(),
    txCount:txs.length, pendingCount:pending.length,
    txs, pending, orders, db,
  };
  const json = JSON.stringify(snap);

  // L1 — localStorage (already saved by saveTxs/savePend)
  // L2 — IndexedDB: save every tx individually (survives localStorage wipe)
  if(_idb){
    try{
      const store = _idb.transaction('txs','readwrite').objectStore('txs');
      txs.forEach(t=>store.put(t));
    }catch{}
    idbPut('meta', snap.savedAt, 'lastSaved');
    idbPut('meta', snap.txCount, 'txCount');
  }

  // L3a — Disk file via File System Access API (browser)
  let diskOk = false;
  if(_backupDir) diskOk = await writeBackupFile(json);

  // L3b — Electron desktop: synchronous fs write (most reliable)
  if(window.issDesktop){
    try{
      await window.issDesktop.autoBackup(json);
      diskOk = true;
    }catch{}
  }

  // L3c — Electron sync folder (shared network, write tx individually)
  if(window.issDesktop && txs.length){
    window.issDesktop.syncWrite(txs[0]).catch(()=>{});
  }

  // Update the status badge
  _lastSaved = new Date();
  updateSavedBadge(diskOk);
}

function updateSavedBadge(diskOk){
  const el = document.getElementById('saved-badge');
  if(!el) return;
  const t = _lastSaved ? _lastSaved.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}) : '—';
  el.textContent = (diskOk ? '💾 ' : '🖫 ') + t;
  el.title = diskOk ? 'Saved to localStorage + IndexedDB + disk' : 'Saved to localStorage + IndexedDB (no disk folder set)';
  el.style.color = diskOk ? '#4ADE80' : '#FCD34D';
}

// ── STARTUP RECOVERY — after a power cut, find the best data ──
async function recoverData(){
  // Get counts from all layers
  const lsCount  = txs.length;
  const idbTxs   = await idbGetAll('txs');
  const idbCount = idbTxs.length;

  if(idbCount > lsCount){
    // IndexedDB has MORE data — localStorage was wiped or incomplete
    txs = idbTxs.sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));
    P(K.txs, txs);  // repopulate localStorage
    const diff = idbCount - lsCount;
    if(diff > 0){ toast('⚡ Recovered '+diff+' transaction'+(diff>1?'s':'')+' after power cut','info',6000); if(typeof auditLog==='function') auditLog('recover','tx','','Power-cut recovery: restored '+diff+' transactions from IndexedDB'); }
  } else if(idbCount < lsCount && _idb){
    // localStorage has more — sync missing ones into IndexedDB
    txs.forEach(t=>idbPutTx(t));
  }
}

/* A transaction's identity in the cloud. The ticket number is NOT unique
   across sites — Hillside and Primecoal both count from 001 — so the row id is
   what the backend keys on. Generated on this PC when the transaction starts,
   it also makes re-sending after a dropped connection idempotent: the retry
   updates the same row instead of creating a second one. */
function newRowId(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  try{
    const b=new Uint8Array(16); crypto.getRandomValues(b);
    b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
    const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }catch(e){}
  return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
/* Short code identifying this site, e.g. hillside / primecoal. Falls back to a
   slug of the site name so an install that was never configured still sends
   something usable rather than an empty string. */
function siteCode(){
  const c=(cfg.siteCode||'').trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'');
  if(c) return c;
  const n=(cfg.siteName||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return n||'unset';
}

/* ════ White-label branding ════
   A signed iss-brand.json (created in the Brand Builder) sets the logo,
   colours and company details with no code edits. The signature deters copying
   and hand-editing — only the Brand Builder (which holds the key) can sign one. */
const BRAND_SECRET='ISS-BRAND-7731';
// Brand packs signed before the rebrand used the old key. Keep validating them
// so existing client installs don't lose their branding on upgrade.
const LEGACY_BRAND_SECRETS=['NS-BRAND-7731'];
function brandHash(str,secret){
  const s=(secret||BRAND_SECRET)+'\u241f'+(str||'');
  let h1=0x811c9dc5,h2=0x1000193;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);
    h1=(h1^c)>>>0; h1=Math.imul(h1,0x01000193)>>>0;
    h2=(h2+c)>>>0; h2=Math.imul(h2,0x85ebca6b)>>>0;}
  return ((h1^((h2<<13)|(h2>>>19)))>>>0).toString(16).toUpperCase().padStart(8,'0');
}
function brandCanon(b){
  const c=b.colors||{};
  return [b.v||1,b.company,b.tagline,b.address,b.phone,b.email,b.reg,b.ticketFooter,
          c.primary,c.accent,c.dark,b.licensedTo,b.logo].map(x=>x==null?'':String(x)).join('\u241f');
}
function brandValid(b){
  if(!b||!b.sig) return false;
  const canon=brandCanon(b);
  if(b.sig===brandHash(canon)) return true;
  return LEGACY_BRAND_SECRETS.some(k=>b.sig===brandHash(canon,k));
}

  const o=orders.find(x=>x.id===orderId);
  if(!o||!o.targetKg||o.active===false) return;
  const loaded=orderLoadedKg(orderId);
  if(loaded>=o.targetKg){
    o.active=false; o.completedAt=nowISO(); o.completedKg=loaded;
    saveOrders();
    auditLog('order-complete','order',o.no,'Target '+(o.targetKg/1000).toFixed(2)+'t reached ('+(loaded/1000).toFixed(2)+'t) - order deactivated');
    toast('📦 Order '+o.no+' target reached ('+(loaded/1000).toFixed(2)+' t) — order deactivated','success',6000);
    if(currentTab==='orders') renderOrdersTab();
  }
}

// PHASE-2 AUTHORISATION
//
// A day after installation the software asks for a second code. Weighing
// is deliberately NOT blocked: a weighbridge that stops mid-shift because
// of a licence is a weighbridge that gets ripped out. Trucks keep moving
// and keep getting tickets; it is the office side — records, reports,
// settings, exports, users, cloud — that waits for the code.
//
// Honest about what this is: the check runs on this PC, so someone who
// can edit the program files can defeat it. It stops a copied folder
// being useful, not a determined engineer. Binding it to the Supabase
// backend is what makes it real, and that is a separate job.
// ══════════════════════════════════════════════════════════════════
function licInstalledAt(){
  const v=cfg.licInstalledAt;
  const t=v?new Date(v).getTime():0;
  return isFinite(t)&&t>0?t:0;
}
/* Phase 2 is due once a day of use has passed and it has not been given. */
function licPhase2Due(){
  if(cfg.licPhase2Ok===true) return false;
  const t0=licInstalledAt();
  if(!t0) return false;                       // never activated — phase 1 gate has it
  return (Date.now()-t0) >= PHASE2_AFTER_MS;
}
function licHoursLeft(){
  const t0=licInstalledAt(); if(!t0) return null;
  const ms=PHASE2_AFTER_MS-(Date.now()-t0);
  return ms>0 ? ms : 0;
}
/* Everything except weighing. Kept as one list so there is a single place
   to look when someone asks "what exactly does the lock stop?" */
const LIC_OPEN_TABS=['weigh','manual','dashboard'];
function licBlocks(tab){ return licPhase2Due() && LIC_OPEN_TABS.indexOf(tab)<0; }

async function doActivate(){

  if(!v){ if(msg) msg.textContent='Enter the installation code'; return; }
  // A site that set its own code keeps it; otherwise phase 1, and the

  const h=await hashStr(v.toUpperCase());
  const ok = h===(cfg.activationCodeHash||DEFAULT_ACT_HASH)
          || h===DEFAULT_ACT_HASH || h===LEGACY_ACT_HASH;
  if(ok){
    P(K.act,true);
    // The phase-2 clock starts here, and is written to the disk mirror as
    // well — clearing localStorage must not hand out another free day.
    if(!cfg.licInstalledAt){ cfg.licInstalledAt=nowISO(); saveCfg(); try{pushAllToDisk();}catch(e){} }
    if(msg) msg.textContent='';
    el.value='';
    document.getElementById('ovr-act').style.display='none';
    showLogin();
    toast('Installed ✓ Welcome to ISS Weighbridge','success');
  }else{
    _licFails=(_licFails||0)+1;
    if(msg) msg.textContent='Incorrect installation code';
    el.value=''; el.focus();
    // slow a guesser down without ever locking JP out of his own install
    if(_licFails>=3){
      el.disabled=true;
      if(msg) msg.textContent='Too many attempts — wait 10 seconds';
      setTimeout(()=>{ el.disabled=false; el.focus(); if(msg) msg.textContent=''; }, 10000);
      _licFails=0;
    }
  }
}

function pinKey(k){

  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);renderPinDots();return;}
  if(pinBuf.length>=4)return;
  pinBuf+=String(k);
  renderPinDots();
  if(pinBuf.length===4) checkPin();

async function checkPin(){
  const u=users.find(x=>x.id===pinUser);
  if(!u){toast('User not found','error');pinBuf='';renderPinDots();return;}
  // Rate-limit lockout
  const lock=pinLocked(u.id);
  if(lock){
    toast('Locked — wait '+lock+'s before trying again','error',4000);
    pinBuf='';renderPinDots();return;
  }
  // Support both hashed (pinHash) and legacy plaintext (pin) during migration
  let ok=false;
  if(u.pinHash) ok=await verifyHash(pinBuf,u.pinHash);
  else if(u.pin) { ok=(pinBuf===u.pin); if(ok){u.pinHash=await hashStr(pinBuf);delete u.pin;saveUsers();} }
  if(ok){
    clearPinFail(u.id);
    session={userId:u.id,name:u.name,role:u.role,perms:u.perms||{}};
    auditLog('login','user',u.id,'Logged in');
    document.getElementById('ovr-login').style.display='none';
    startApp();
  }else{
    recordPinFail(u.id);
    const nl=pinLocked(u.id);
    toast(nl?'Wrong PIN — locked '+nl+'s':'Wrong PIN','error');
    setTimeout(()=>{pinBuf='';renderPinDots();},600);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   ROLE TIERS
     clerk      — day-to-day capture; individual permissions still apply
     supervisor — everything EXCEPT Settings and Cloud
     manager    — everything EXCEPT Cloud
     master     — full access, and the only role that can manage users
   Ranked, so a check is "at least this tier" rather than a list of ids.
   Tab-level minimums live in TAB_MIN_ROLE below.
   ══════════════════════════════════════════════════════════════════════ */
const ROLES=[
  {id:'clerk',      l:'Clerk',      rank:1, desc:'Weighing and daily capture (per-permission)'},
  {id:'supervisor', l:'Supervisor', rank:2, desc:'Everything except Settings and Cloud'},
  {id:'manager',    l:'Manager',    rank:3, desc:'Everything except Cloud'},
  {id:'master',     l:'Master',     rank:4, desc:'Full access, including Users and Cloud'}
];
const TAB_MIN_ROLE={ users:'master', audit:'supervisor', cloud:'master', settings:'manager' };
function roleDef(id){ return ROLES.find(r=>r.id===id)||ROLES[0]; }
function roleRank(id){ return roleDef(id).rank; }
function roleLabel(id){ return roleDef(id).l; }
/* True when the signed-in user is at or above the given tier. */
function roleAtLeast(minId){ return roleRank(session&&session.role) >= roleRank(minId); }

function canAccess(perm){
  if(!session)return false;
  if(roleAtLeast('supervisor'))return true;   // supervisor and up: all feature tabs
  return session.perms&&session.perms[perm];
}
function requireMaster(){ return requireRole('master'); }
/* Master password still unlocks anything — it is the on-site override when
   the responsible person is not logged in. */
function requireRole(minId){
  if(roleAtLeast(minId))return true;
  const need=roleLabel(minId);
  openModal('Access Denied',`<div style="text-align:center;padding:20px">
    <div style="font-size:40px">🔒</div>
    <p style="margin-top:12px;color:var(--text2)">This section needs <b>${need}</b> access or higher.<br><span style="font-size:12px">Signed in as ${roleLabel(session&&session.role)}.</span></p>
    <div class="field" style="margin-top:16px"><label>Master Password</label>
      <input id="mp-in" type="password" placeholder="Enter master password" onkeydown="if(event.key==='Enter')checkMasterPw()"/>
    </div>
    <button class="btn btn-navy btn-full" onclick="checkMasterPw()">Unlock</button>
  </div>`);
  return false;
}
async function checkMasterPw(){
  const v=document.getElementById('mp-in')?.value;

  if(cfg.masterPassHash) ok=await verifyHash(v,cfg.masterPassHash);
  else if(cfg.masterPass){ ok=(v===cfg.masterPass); if(ok){cfg.masterPassHash=await hashStr(v);delete cfg.masterPass;saveCfg();} }
  if(ok){

// ── Reusable password gate ────────────────────────────────────────────────
// Verifies the master PIN OR master password, then runs onOk(). Used to unlock
// editing of a transaction after the first weight, and the manual-weigh tab.
// Falls back to the master user's PIN when no separate master password is set.
async function verifyMasterSecret(v){
  if(!v) return false;
  // Dedicated override PIN (for supervisors) — separate from master login.
  if(cfg.overridePassHash && await verifyHash(v,cfg.overridePassHash)) return true;
  // Master password / master user's PIN always work too.
  if(cfg.masterPassHash && await verifyHash(v,cfg.masterPassHash)) return true;
  if(cfg.masterPass && v===cfg.masterPass) return true;
  const m=(users||[]).find(u=>u.role==='master'&&u.active!==false);
  if(m && m.pinHash && await verifyHash(v,m.pinHash)) return true;
  return false;
}
