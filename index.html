// ── SERIAL ──────────────────────────────────────
// ══════════════════════════════════════════════════════════
// SERIAL PORT — pair ONCE (master), then auto-open forever.
//
// Web Serial remembers granted ports via navigator.serial.getPorts().
// We tag each bridge with the device's USB vendor/product ID so on
// startup we silently re-open the SAME physical indicator without any
// popup. The popup (requestPort) only happens when the master pairs.
// ══════════════════════════════════════════════════════════

// Open an already-granted SerialPort object (no popup)
// ══════════════════════════════════════════════════════════
// NATIVE SERIAL (Electron EXE) — the bulletproof path.
//
// When running in the desktop app, the COM port is held OPEN by
// the main process at the OS level. It is set ONCE by the master,
// remembered forever, reopened on every launch, and survives
// renderer reloads and cable drops — NEVER needs unplugging.
//
// The browser/PWA build automatically falls back to Web Serial.
// ══════════════════════════════════════════════════════════
let _nativeSerial=false;
let _serialErr=null;
let _nativeBound=false;
let _nativeRawBuf=['',''];
let _lastSerialData=[0,0];
let _silentWarned=[false,false];

async function initNativeSerial(){
  if(!window.issDesktop || !window.issDesktop.serialAvailable) return false;
  try{ _nativeSerial = await window.issDesktop.serialAvailable(); }catch{ _nativeSerial=false; }
  if(!_nativeSerial){ try{ _serialErr=await window.issDesktop.serialError(); }catch{} return false; }
  if(_nativeBound) return true;
  _nativeBound=true;

  // Live weight lines pushed from main process
  window.issDesktop.onSerialData(({bi,line})=>{ _lastSerialData[bi]=Date.now(); feedSerial(bi, line+'\n'); });
  // Raw chunks from native port → single feed path (parse + monitor + weight)
  window.issDesktop.onSerialRaw(({bi,data})=>{
    _lastSerialData[bi]=Date.now();
    feedSerial(bi, data);
  });
  // Status changes
  window.issDesktop.onSerialStatus(({bi,status,path,detail})=>{
    if(status==='open'){
      bState[bi].state='connected';
      _lastSerialData[bi]=0; _silentWarned[bi]=false;
      stopSim(bi);
      setPill('● Live'+(path?' '+path:''),'rgba(27,122,67,.15)','#4ADE80',bi);
      // Warn if the port opens but the indicator sends nothing within 4s
      setTimeout(()=>{
        if(_nativeSerial && !_lastSerialData[bi] && !_silentWarned[bi]){
          _silentWarned[bi]=true;
          toast('Port open on '+(path||'COM')+' but no data from indicator. Check baud rate, cable TX/GND wiring, and that the indicator is in continuous-print mode.','error',9000);
          setPill('⚠ Open · no data','rgba(217,119,6,.15)','#FBBF24',bi);
        }
      },4000);
    }else if(status==='closed'||status==='error'){
      if(bState[bi].state==='connected'){ bState[bi].state='disconnected'; startSim(bi); }
      setPill('◌ Reconnecting…','rgba(220,38,38,.12)','#FCA5A5',bi);
    }
  });
  // Ongoing silent-port monitor: if data stops for 6s while 'open', flag it
  setInterval(()=>{
    if(!_nativeSerial) return;
    for(let bi=0;bi<2;bi++){
      if(bState[bi].state==='connected' && _lastSerialData[bi] && (Date.now()-_lastSerialData[bi]>6000)){
        if(bi===activeBridge) setPill('⚠ No data 6s','rgba(217,119,6,.15)','#FBBF24',bi);
      }
    }
  },3000);
  return true;
}

// Master picks the COM port from a dropdown of real ports (native)
async function connectSerialNative(bi){
  if(!roleAtLeast('manager')){
    toast('Only Master can set the serial port. It opens automatically in live mode.','error',5000);
    return;
  }
  const ports=await window.issDesktop.serialList();
  if(!ports.length){ toast('No COM ports found — check the USB cable / driver','error',5000); return; }
  const bc=cfg.bridges[bi];
  const opts=ports.map(p=>`<option value="${esc(p.path)}">${esc(p.path)} — ${esc(p.friendlyName)}</option>`).join('');
  openModal('🔌 Set Serial Port — '+(bc.name||'Bridge '+(bi+1)),`
    <div class="field"><label>COM Port</label>
      <select id="np-port">${opts}</select>
    </div>
    <div class="row2">
      <div class="field"><label>Baud Rate</label>
        <select id="np-baud">${['1200','2400','4800','9600','19200','38400','57600','115200'].map(b=>`<option ${(bc.baud||'9600')===b?'selected':''}>${b}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Parity</label>
        <select id="np-parity">
          <option value="none" ${(bc.parity||'none')==='none'?'selected':''}>None</option>
          <option value="even" ${bc.parity==='even'?'selected':''}>Even</option>
          <option value="odd" ${bc.parity==='odd'?'selected':''}>Odd</option>
        </select>
      </div>
    </div>
    <details style="margin:6px 0">
      <summary style="cursor:pointer;font-size:12px;color:var(--text2);font-weight:600">Advanced — line control (only if the weight drops when you connect)</summary>
      <div style="padding:8px 4px 2px">
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px">
          <input type="checkbox" id="np-kick" ${bc.kick===true?'checked':''}/>
          Reset pulse on connect — leave OFF for Prolific/FTDI; try ON only for CH340
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:12px">
          <input type="checkbox" id="np-dtr" ${bc.dtr===false?'':'checked'}/>
          Hold DTR/RTS high (most indicators need this to transmit)
        </label>
        <div style="font-size:11px;color:var(--text3);margin-top:6px">If it opens in PuTTY but not here, keep "Reset pulse" OFF — that's the default now.</div>
      </div>
    </details>
    <div style="background:var(--greenl);border-radius:8px;padding:10px;font-size:12px;color:var(--green);margin:8px 0">
      ✓ Set once. The port stays open at the OS level, reopens automatically every time you start the app, and survives power cuts and cable knocks. You never need to unplug it.
    </div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-navy" style="flex:1" onclick="saveNativePort(${bi})">💾 Set &amp; Go Live</button>
    </div>`);
}

async function saveNativePort(bi){
  const bc=cfg.bridges[bi];
  const path=document.getElementById('np-port')?.value;
  const baud=document.getElementById('np-baud')?.value||'9600';
  const parity=document.getElementById('np-parity')?.value||'none';
  if(!path){ toast('Pick a COM port','error'); return; }
  const kick=document.getElementById('np-kick')?.checked===true;
  const dtr =document.getElementById('np-dtr')?.checked!==false;
  bc.baud=baud; bc.parity=parity; bc.paired=true; bc.comPath=path; bc.kick=kick; bc.dtr=dtr; bc.rts=dtr; saveCfg();
  const opts={path,baud,parity,dataBits:bc.dataBits||8,stopBits:1,kick,dtr,rts:dtr};
  const r=await window.issDesktop.serialOpen(bi,opts);
  closeModal();
  if(r&&r.ok){
    auditLog('config','settings','bridge'+bi,'Set serial port '+path+' @ '+baud+' for '+(bc.name||'Bridge '+(bi+1)));
    toast((bc.name||'Bridge '+(bi+1))+' live on '+path+' ✓ — remembered','success',5000);
    if(currentTab==='settings') renderSettings();
  }else{
    toast('Could not open '+path+': '+(r?.error||'unknown'),'error',5000);
  }
}

async function disconnectNative(bi){
  if(window.issDesktop && _nativeSerial){
    await window.issDesktop.serialClose(bi);
    cfg.bridges[bi].paired=false; delete cfg.bridges[bi].comPath; saveCfg();
    bState[bi].state='sim'; startSim(bi);
    toast('Port released','info');
    if(currentTab==='settings') renderSettings();
  }
}

async function openSerialPort(port,bi){
  const br=bState[bi],bc=cfg.bridges[bi];
  if(_rawRunning){ await rawDisconnect(); }
  if(br.serial){ await disconnectSerial(bi); await new Promise(r=>setTimeout(r,200)); }
  stopSim(bi);
  setPill('◌ Connecting…','rgba(255,204,0,.15)','#FCD34D',bi);
  let opened=false,lastErr=null;
  for(let a=0;a<4&&!opened;a++){
    try{
      await port.open({baudRate:parseInt(bc.baud)||9600,dataBits:parseInt(bc.dataBits)||8,stopBits:1,parity:bc.parity||'none'});
      opened=true;
    }catch(e){
      lastErr=e;
      // if it's already open by us, treat as success
      if(/already open/i.test(e.message||'')){ opened=true; break; }
      await new Promise(r=>setTimeout(r,400));
    }
  }
  if(!opened) throw lastErr||new Error('open failed');
  br.serial=port; br.state='connected';
  setPill('● Live','rgba(27,122,67,.15)','#4ADE80',bi);
  readSerial(port,bi);
  return true;
}

// MASTER: pair a port — shows the chooser ONCE, then remembers it.
async function connectSerial(bi){
  // In the desktop EXE, use the bulletproof native serial path
  if(window.issDesktop && _nativeSerial){ return connectSerialNative(bi); }
  if(!('serial' in navigator)){toast('Web Serial not available — run the ISS Weighbridge desktop app','error');return;}
  // Only the master may CHANGE the paired port. Clerks just get the
  // already-paired live connection (handled by autoOpenSavedPorts).
  if(!roleAtLeast('manager')){
    toast('Only Master can set the serial port. It opens automatically in live mode.','error',5000);
    return;
  }
  const br=bState[bi],bc=cfg.bridges[bi];
  try{
    const port=await navigator.serial.requestPort();   // the ONE popup
    // Remember which physical device this is (USB IDs)
    try{
      const info=port.getInfo?.();
      if(info){ bc.usbVendorId=info.usbVendorId; bc.usbProductId=info.usbProductId; saveCfg(); }
    }catch{}
    bc.paired=true; saveCfg();
    await openSerialPort(port,bi);
    auditLog('config','settings','bridge'+bi,'Paired serial port for '+(bc.name||'Bridge '+(bi+1)));
    toast((bc.name||'Bridge')+' paired ✓ — will auto-open from now on','success',5000);
  }catch(e){
    if(e.name==='AbortError'){ startSim(bi); return; }
    if(/already open|in use|not available|failed to open/i.test(e.message||''))
      toast('Port busy — unplug/replug USB or close other programs using it','error',6000);
    else toast('Connect failed: '+(e.message||e.name),'error');
    startSim(bi);
  }
}

// STARTUP: silently re-open every paired bridge, no popup.
// Matches saved USB vendor/product IDs to a granted port.
async function autoOpenSavedPorts(){
  if(!('serial' in navigator)) return;
  let granted=[];
  try{ granted=await navigator.serial.getPorts(); }catch{ return; }
  if(!granted.length) return;
  for(let bi=0;bi<cfg.bridges.length;bi++){
    const bc=cfg.bridges[bi];
    if(!bc.paired) continue;
    if(bc.src && /^wss?:/.test(bc.src)) continue;   // this bridge is a WeighBox, skip
    // Find the granted port whose USB IDs match this bridge
    let match=null;
    for(const p of granted){
      let info={}; try{ info=p.getInfo?.()||{}; }catch{}
      if(bc.usbVendorId==null || (info.usbVendorId===bc.usbVendorId && info.usbProductId===bc.usbProductId)){
        match=p; break;
      }
    }
    // Fallback: if only one device is granted and bridge has no stored IDs, use it
    if(!match && granted.length===1 && bc.usbVendorId==null) match=granted[0];
    if(match){
      try{
        await openSerialPort(match,bi);
        toast((bc.name||'Bridge '+(bi+1))+' live ✓','success',2500);
      }catch(e){
        // device not plugged in yet — keep simulation, retry later
        startSim(bi);
      }
    }
  }
}

// Watchdog: if a paired bridge drops (cable knocked), keep trying to
// silently re-open it every 8s — no popup, no operator action.
let _serialWatchdog=null, _serialEvtBound=false;
function startSerialWatchdog(){
  if(_serialWatchdog) clearInterval(_serialWatchdog);
  _serialWatchdog=setInterval(async()=>{
    if(!('serial' in navigator)) return;
    for(let bi=0;bi<cfg.bridges.length;bi++){
      const bc=cfg.bridges[bi], br=bState[bi];
      if(!bc.paired) continue;
      if(bc.src && /^wss?:/.test(bc.src)) continue;
      if(br.state==='connected') continue;   // already live
      // try to re-open from granted ports
      try{
        const granted=await navigator.serial.getPorts();
        let match=null;
        for(const p of granted){
          let info={}; try{info=p.getInfo?.()||{};}catch{}
          if(bc.usbVendorId==null || (info.usbVendorId===bc.usbVendorId && info.usbProductId===bc.usbProductId)){ match=p; break; }
        }
        if(!match && granted.length===1 && bc.usbVendorId==null) match=granted[0];
        if(match){ await openSerialPort(match,bi); toast((bc.name||'Bridge '+(bi+1))+' reconnected ✓','success',2000); }
      }catch{}
    }
  },8000);
}
async function readSerial(port,bi){
  const br=bState[bi],bc=cfg.bridges[bi];
  const dec=new TextDecoder(); let buf='';
  try{
    br.reader=port.readable.getReader();
    while(true){
      const {value,done}=await br.reader.read();
      if(done)break;
      buf+=dec.decode(value);
      const lines=buf.split('\n'); buf=lines.pop();
      for(const ln of lines){const w=parseRaw(ln,bc);if(w!==null){br.live=w;if(bi===activeBridge)updateWeight(w);}}
    }
  }catch(e){
    // expected when we cancel the reader during disconnect
  }finally{
    // ALWAYS release the lock so the port can be reopened
    try{ br.reader&&br.reader.releaseLock(); }catch{}
    br.reader=null;
  }
}
// ══════════════════════════════════════════════════════════
// SIMPLE SERIAL — the only path that matters.
// EXE: native port held open by main process, raw bytes streamed in.
// Browser: Web Serial fallback.
// ══════════════════════════════════════════════════════════
let _portList=[];
let _monBuf=['',''];
let _browserPoll=[null,null];
let _idleFlush=[null,null];
function expandPoll(cmd){
  return String(cmd||'')
    .replace(/<CR>/gi,'\r').replace(/<LF>/gi,'\n')
    .replace(/<ENQ>/gi,'\x05').replace(/<STX>/gi,'\x02').replace(/<ETX>/gi,'\x03');
}

async function refreshPortList(bi){
  if(window.issDesktop && _nativeSerial){
    _portList=await window.issDesktop.serialList();
    const sel=document.getElementById('s-b'+bi+'port');

      sel.innerHTML=_portList.length
        ? _portList.map(p=>`<option value="${esc(p.path)}" ${p.path===cur?'selected':''}>${esc(p.path)} — ${esc(p.friendlyName||'')}</option>`).join('')
        : '<option value="">No COM ports found — check USB cable/driver</option>';
    }
    toast(_portList.length+' COM port'+(_portList.length!==1?'s':'')+' found','info');
  }else{
    // Browser: can't enumerate; Connect will show the chooser
    const sel=document.getElementById('s-b'+bi+'port');
    if(sel) sel.innerHTML='<option value="browser">Click Connect → choose port in popup</option>';
    toast('Browser mode: Connect opens the port chooser','info');

/* Which transport a bridge uses. 'usb' is the COM port; 'tcp' is an
   IP-to-serial converter (Moxa/USR/Elfin) reached over the LAN; 'box' is an
   ISS ScaleLink WiFi unit speaking WebSocket. TCP and ScaleLink both avoid
   USB entirely, which matters on PCs that drop CH340/FTDI adapters. */
function bridgeLink(bi){ return (cfg.bridges[bi]||{}).link||'usb'; }
function setBridgeLink(bi,v){ setBridge(bi,'link',v); renderSettings(); }

async function connectBridge(bi){
  if(!roleAtLeast('manager')){ toast('Setting the scale connection needs Manager access','error'); return; }
  const bc=cfg.bridges[bi];
  const baud=document.getElementById('s-b'+bi+'b')?.value || bc.baud || '9600';
  bc.baud=baud;
  const link=bridgeLink(bi);

  // ── IP → Serial converter (no COM port, no USB driver) ──
  if(link==='tcp'){
    if(!window.issDesktop?.tcpOpen){ toast('Network gateways need the desktop EXE','error'); return; }
    const host=(document.getElementById('s-b'+bi+'host')?.value||bc.tcpHost||'').trim();
    const port=parseInt(document.getElementById('s-b'+bi+'tport')?.value||bc.tcpPort||8899);
    if(!host){ toast('Enter the gateway IP address','error'); return; }
    bc.tcpHost=host; bc.tcpPort=port; bc.paired=true; saveCfg();
    setMon(bi,'Connecting to '+host+':'+port+'…');
    const r=await window.issDesktop.tcpOpen(bi,{host,port,pollCmd:bc.pollCmd||'',pollMs:bc.pollMs||1000});
    if(r&&r.ok){
      auditLog('config','settings','bridge'+bi,'Connected TCP '+host+':'+port);
      toast((bc.name||'Bridge '+(bi+1))+' connecting to '+host,'success');
    }else{
      setMon(bi,'ERROR: '+(r?.error||'could not connect'));
      toast('Could not reach '+host+':'+port+' — '+(r?.error||'unknown'),'error',6000);
    }
    return;
  }

  // ── ISS ScaleLink WiFi box (WebSocket) ──
  if(link==='box'){
    const url=(document.getElementById('s-b'+bi+'ws')?.value||bc.boxUrl||'').trim();
    if(!url){ toast('Enter the ScaleLink URL — e.g. ws://192.168.4.1:81','error'); return; }
    bc.boxUrl=url; bc.paired=true; saveCfg();
    connectBox(url,bi);   // note: connectBox takes (url, bi)
    return;
  }

  // ── EXE native path (USB / COM) ──
  if(window.issDesktop && _nativeSerial){
    const sel=document.getElementById('s-b'+bi+'port');
    const path=sel?.value;
    if(!path){ toast('Pick a COM port (click Refresh Ports first)','error'); return; }
    bc.comPath=path; bc.paired=true; saveCfg();
    setMon(bi,'Opening '+path+' @ '+baud+'…');
    const r=await window.issDesktop.serialOpen(bi,{path,baud,dataBits:8,parity:'none',stopBits:1,pollCmd:bc.pollCmd||'',pollMs:bc.pollMs||1000});
    if(r&&r.ok){
      auditLog('config','settings','bridge'+bi,'Connected '+path+' @ '+baud);
      toast((bc.name||'Bridge '+(bi+1))+' connecting on '+path,'success');
    }else{
      setMon(bi,'ERROR: '+(r?.error||'could not open'));
      toast('Could not open '+path+': '+(r?.error||'unknown'),'error',6000);
    }
    return;
  }

  // ── Browser Web Serial fallback ──
  if(!('serial' in navigator)){ toast('Run the desktop EXE for serial, or use Chrome/Edge','error'); return; }
  try{
    const port=await navigator.serial.requestPort();
    await port.open({baudRate:parseInt(baud)||9600});
    bc.paired=true; saveCfg();
    bState[bi].serial=port; bState[bi].state='connected';
    stopSim(bi);
    setPill('● Live','rgba(27,122,67,.15)','#4ADE80',bi);
    readBrowserSerial(port,bi);
    // Browser polling for demand-mode indicators
    if(bc.pollCmd){
      try{
        const enc=new TextEncoder();
        const cmd=expandPoll(bc.pollCmd);
        const writer=port.writable.getWriter();
        await writer.write(enc.encode(cmd)); writer.releaseLock();
        if(_browserPoll[bi]) clearInterval(_browserPoll[bi]);
        _browserPoll[bi]=setInterval(async()=>{
          try{ const w=port.writable.getWriter(); await w.write(enc.encode(cmd)); w.releaseLock(); }catch{}
        }, parseInt(bc.pollMs)||1000);
      }catch{}
    }
    toast((bc.name||'Bridge '+(bi+1))+' live','success');
  }catch(e){
    if(e.name!=='AbortError') toast('Open failed: '+e.message,'error');
  }
}

async function readBrowserSerial(port,bi){
  const dec=new TextDecoder();
  try{
    while(port.readable){
      const reader=port.readable.getReader();
      try{
        while(true){
          const {value,done}=await reader.read();
          if(done) break;
          feedSerial(bi, dec.decode(value,{stream:true}));
        }
      }catch(e){ break; }
      finally{ reader.releaseLock(); }
    }
  }catch(e){}
}

async function stopBridge(bi){
  const bc=cfg.bridges[bi];
  bc.paired=false; delete bc.comPath; saveCfg();
  if(_browserPoll[bi]){ clearInterval(_browserPoll[bi]); _browserPoll[bi]=null; }
  if(window.issDesktop && _nativeSerial){ await window.issDesktop.serialClose(bi); }
  if(bState[bi].serial){ try{ await bState[bi].serial.close(); }catch{} bState[bi].serial=null; }
  bState[bi].state='sim'; startSim(bi);
  setMon(bi,'Stopped.');
  toast('Bridge stopped','info');
}

// Central feed: raw text in → parse → update weight + monitor
function feedSerial(bi, data){
  _monBuf[bi]=(_monBuf[bi]+data);
  const parts=_monBuf[bi].split(/[\r\n\x02\x03]+/);
  _monBuf[bi]=parts.pop();
  for(const ln of parts){
    if(!ln.trim()) continue;
    processLine(bi, ln);
  }
  // ── Idle-flush: some indicators send a fixed frame with NO line break.
  // If the leftover buffer looks like a full reading and nothing else
  // arrives within 250ms, parse it anyway.
  if(_idleFlush[bi]) clearTimeout(_idleFlush[bi]);
  if(_monBuf[bi].length>=4){
    _idleFlush[bi]=setTimeout(()=>{
      const leftover=_monBuf[bi];
      if(leftover.length>=4){
        processLine(bi, leftover);
        _monBuf[bi]='';
      }
    },250);
  }
  if(_monBuf[bi].length>300) _monBuf[bi]='';
}
function processLine(bi, ln){
  const bc=cfg.bridges[bi];
  const nums=numTokens(ln).map(t=>t.val);
  _deckLive[bi]=nums;
  if(_deckLearn[bi]) deckLearnTick(bi, nums);

  let w;
  if(isMulti(bc)){
    const d=parseDecks(nums, bc);
    bState[bi].decks=d.decks; bState[bi].deckSum=d.sum; bState[bi].deckAgrees=d.agrees;
    // Nothing mapped yet: fall back to the single-deck parser so a half-set-up
    // bridge still shows a weight instead of going dead.
    w = d.weight!==null && d.weight!==undefined ? d.weight : parseRaw(ln, bc);
  }else{
    bState[bi].decks=[]; bState[bi].deckSum=null; bState[bi].deckAgrees=null;
    w=parseRaw(ln, bc);
  }

  showMonLine(bi, ln, w);
  if(w!==null){
    bState[bi].live=w; bState[bi].state='connected';
    if(bi===activeBridge){ updateWeight(w); renderDeckBar(); }
  }
  if(isMulti(bc)) refreshDeckSetupThrottled(bi);
}
function refreshDeckSetupThrottled(bi){
  const now=Date.now();
  if(now-_deckFieldsPaint<400) return;
  _deckFieldsPaint=now;
  if(document.getElementById('dkset'+bi)) renderDeckSetup(bi);
}

function setMon(bi,msg){
  const m=document.getElementById('mon'+bi);
  if(m) m.innerHTML='<div style="color:#6a86a8">'+esc(msg)+'</div>';
}
let _monLines=[[],[]];
function showMonLine(bi, ln, w){
  _monLines[bi].unshift({ln,w});
  if(_monLines[bi].length>8) _monLines[bi].pop();
  const m=document.getElementById('mon'+bi);
  if(m){
    m.innerHTML=_monLines[bi].map((x,i)=>
      `<div style="${i===0?'color:#7CD992':'color:#4a6a52'}">${esc(x.ln)}${x.w!==null?' <span style="color:#FBBF24">→ '+fmt(x.w)+'</span>':''}</div>`
    ).join('');
  }
  const d=document.getElementById('dec'+bi);
  if(d && w!==null) d.textContent=fmt(w)+' '+(cfg.weightUnit||'kg');
}


/* ══════════════════════════════════════════════════════════════════════
   MULTI-DECK SUPPORT
   Some indicators send each deck's weight plus the gross in one string:
     #<d1>kg,NUL<d2>kg,NUL<d3>kg,NUL<d4>kg,NUL<status><gross>kg LF CR NUL
   Single-deck bridges are untouched — they keep using parseRaw().
   ══════════════════════════════════════════════════════════════════════ */

const DECK_SLOTS=[
  {k:'d1',l:'Deck 1',c:'#F2A93B'},{k:'d2',l:'Deck 2',c:'#2FB170'},
  {k:'d3',l:'Deck 3',c:'#B98BFF'},{k:'d4',l:'Deck 4',c:'#FF7A6B'}];
const GROSS_SLOT={k:'gross',l:'Gross',c:'#D9B45B'};
function deckSlots(bc){ return DECK_SLOTS.slice(0,Math.max(2,Math.min(4,parseInt(bc&&bc.deckCount)||4))); }
function allDeckSlots(bc){ return deckSlots(bc).concat([GROSS_SLOT]); }
function slotByKey(k){ return k==='gross'?GROSS_SLOT:DECK_SLOTS.find(s=>s.k===k); }
function isMulti(bc){ return !!(bc && bc.deckMode==='multi'); }

let _deckLive=[[],[]];        // last numbers seen per bridge
let _deckLearn=[null,null];   // learn-a-deck state per bridge
let _deckPaint=0, _deckFieldsPaint=0;

/* ONE tokeniser for everything. The field number the operator maps in
   Settings is an index into this array, so the mapper and the parser must
   never disagree about what counts as a number. */
function numTokens(ln){
  if(ln==null) return [];
  const clean=String(ln).replace(/(\d),(\d)/g,'$1$2');   // 14,280 -> 14280
  const out=[];
  const re=/[-+]?\d[\d ]*\.?\d*/g; let m;
  while((m=re.exec(clean))!==null){
    const c=m[0].replace(/[^0-9.\-]/g,'');
    if(!c||c==='-'||c==='.') continue;
    const v=parseFloat(c);
    if(isFinite(v)) out.push({raw:m[0].trim(),val:v});
  }
  return out;
}

/* Which number is the gross? The one equal to the sum of the others.
   Only trustworthy when two or more of the others carry load — with a single
   deck loaded, that deck and the gross hold the same figure and nothing can
   separate them. Returns -1 when it cannot be decided yet. */
function deckSumIndex(nums){
  const n=nums.length, hits=[];
  for(let i=0;i<n;i++){
    let sum=0,loaded=0;
    for(let j=0;j<n;j++) if(j!==i){ sum+=nums[j]; if(Math.abs(nums[j])>1) loaded++; }
    if(loaded<2) continue;
    if(Math.abs(sum-nums[i])/Math.max(Math.abs(nums[i]),1)<0.02) hits.push(i);
  }
  return hits.length===1?hits[0]:-1;
}

function parseDecks(nums, bc){
  const map=bc.deckMap||{}, tol=parseFloat(bc.deckTol)||0;
  const at=k=>{ const i=map[k]; return (i===undefined||nums[i]===undefined)?null:nums[i]; };
  const decks=deckSlots(bc).map(s=>at(s.k));
  const gross=at('gross');
  const got=decks.filter(v=>v!==null);
  const sum=got.length?got.reduce((a,v)=>a+v,0):null;
  // Gross is what gets ticketed. If it is not in the string, the decks added
  // up are the next best thing. If neither is mapped, fall through to the
  // ordinary single-deck parser so the bridge never goes dead.
  const weight = gross!==null ? gross : sum;
  return {decks, gross, sum,
          agrees:(gross===null||sum===null)?null:Math.abs(sum-gross)<=tol,
          weight};
}

/* ── Learn: load one deck, watch which number moves ── */
function deckLearnStart(bi, slot){
  const bc=cfg.bridges[bi]||{}, nums=_deckLive[bi];
  if(!nums.length){ toast('No data yet — connect the indicator first','error'); return; }
  if(slot!=='gross' && (bc.deckMap||{}).gross===undefined && deckSumIndex(nums)<0){
    toast('Set Gross first — put load on two or more decks, then press Suggest','error',6000); return;
  }
  _deckLearn[bi]={slot, baseline:nums.slice(), best:-1, bestDelta:0, until:Date.now()+20000};
  toast('Learning '+slotByKey(slot).l+' — put a load on that deck now','info',6000);
  renderDeckSetup(bi);
}
function deckLearnTick(bi, nums){
  const L=_deckLearn[bi]; if(!L) return;
  const bc=cfg.bridges[bi]||{}, map=bc.deckMap||{};
  // The gross rises by exactly the load being added, so it would otherwise win
  // the "what moved most" contest every time.
  const gi = map.gross!==undefined ? map.gross : deckSumIndex(nums);
  for(let i=0;i<nums.length;i++){
    if(i===gi && L.slot!=='gross') continue;
    let taken=false;
    for(const k of Object.keys(map)) if(map[k]===i && k!==L.slot) taken=true;
    if(taken) continue;
    const d=Math.abs(nums[i]-(L.baseline[i]||0));
    if(d>L.bestDelta){ L.bestDelta=d; L.best=i; }
  }
  if(Date.now()>L.until) deckLearnFinish(bi);
}
function deckLearnFinish(bi){
  const L=_deckLearn[bi]; if(!L) return;
  _deckLearn[bi]=null;
  const bc=cfg.bridges[bi]; if(!bc.deckMap) bc.deckMap={};
  if(L.best<0 || L.bestDelta<10){
    toast('Nothing moved enough to be sure — try again with a heavier load','error',5000);
    renderDeckSetup(bi); return;
  }
  for(const k of Object.keys(bc.deckMap)) if(bc.deckMap[k]===L.best) delete bc.deckMap[k];
  bc.deckMap[L.slot]=L.best; saveCfg();
  toast(slotByKey(L.slot).l+' = field '+L.best+' (moved '+fmt(Math.round(L.bestDelta))+')','success',5000);
  renderDeckSetup(bi);
}

function deckSuggest(bi){
  const bc=cfg.bridges[bi], nums=_deckLive[bi];
  if(!nums.length){ toast('No data yet — connect the indicator first','error'); return; }
  const gi=deckSumIndex(nums);
  bc.deckMap={};
  if(gi>=0){
    bc.deckMap.gross=gi;
    const ds=deckSlots(bc); let d=0;
    for(let i=0;i<nums.length && d<ds.length;i++){ if(i!==gi) bc.deckMap[ds[d++].k]=i; }
    toast('Field '+gi+' adds up to the others — set as Gross','success',5000);
  }else{
    const sl=allDeckSlots(bc);
    for(let i=0;i<Math.min(nums.length,sl.length);i++) bc.deckMap[sl[i].k]=i;
    toast('Cannot tell which field is the gross yet — load two or more decks and press Suggest again','error',7000);
  }
  saveCfg(); renderDeckSetup(bi);
}
function deckAssign(bi, i, k){
  const bc=cfg.bridges[bi]; if(!bc.deckMap) bc.deckMap={};

}

/* ══════════════════════════════════════════════════════════════════════
   AXLE CHECK — advisory overload indication (South Africa, NRTR Reg 240)
   Each deck carries one axle group. The operator picks a truck preset (one
   tap, assigns every deck) or overrides a single deck by hand. Limits are
   editable per site because enforcement tolerances vary and a site may
   run under permit.

   THIS IS A CHECK-WEIGH AID, NOT A LEGAL DETERMINATION. The ticketed
   figure stays the gross. Nothing here changes what gets recorded.
   ══════════════════════════════════════════════════════════════════════ */
const AXLE_GROUPS=[
  {id:'none',     l:'Not in use',                   limit:0,     axles:0, dual:false},
  {id:'steer',    l:'Steering axle (single tyres)',  limit:7700,  axles:1, dual:false},
  {id:'s_sgl',    l:'Single axle, single tyres',     limit:8000,  axles:1, dual:false},
  {id:'s_dual',   l:'Single axle, dual tyres',       limit:9000,  axles:1, dual:true},
  {id:'tan_sgl',  l:'Tandem, single tyres',          limit:16000, axles:2, dual:false},
  {id:'tan_dual', l:'Tandem, dual tyres',            limit:18000, axles:2, dual:true},
  {id:'tridem',   l:'Tridem, single or dual tyres',  limit:24000, axles:3, dual:true}
];
const COMBO_LIMIT=56000;                    // max permissible combination mass
const TRUCK_PRESETS=[
  {id:'',      l:'— pick a truck —',                   decks:[],                                              shape:[],                          unit:[]},
  {id:'r2',    l:'Rigid 2-axle tipper',                 decks:['steer','s_dual'],                              shape:['cab','rigid'],              unit:[0,0]},
  {id:'r3',    l:'Rigid 3-axle tipper (6x4)',           decks:['steer','tan_dual'],                            shape:['cab','rigid'],              unit:[0,0]},
  {id:'r4',    l:'Rigid 4-axle tipper (8x4)',           decks:['steer','steer','tan_dual'],                    shape:['cab','steer2','rigid'],     unit:[0,0,0]},
  {id:'art_t', l:'Horse 6x4 + tri-axle side tipper',    decks:['steer','tan_dual','tridem'],                   shape:['cab','drive','tipper'],     unit:[0,1,1]},
  {id:'art_d', l:'Horse 6x4 + tandem side tipper',      decks:['steer','tan_dual','tan_dual'],                 shape:['cab','drive','tipper'],     unit:[0,1,1]},
  {id:'inter', l:'Interlink side tipper (horse + 2)',   decks:['steer','tan_dual','tan_dual','tan_dual'],      shape:['cab','drive','tipper','tipper'], unit:[0,1,1,2]},
  {id:'super', l:'Superlink side tipper (tri + tri)',   decks:['steer','tan_dual','tridem','tridem'],          shape:['cab','drive','tipper','tipper'], unit:[0,1,1,2]},
  {id:'drawb', l:'Rigid tipper + drawbar trailer',      decks:['steer','tan_dual','tan_dual','tan_dual'],      shape:['cab','rigid','draw','draw'], unit:[0,0,1,1]}
];
function axleGroup(id){ return AXLE_GROUPS.find(g=>g.id===id)||AXLE_GROUPS[0]; }
function axleCfg(){
  if(!cfg.axle) cfg.axle={on:false,preset:'',groups:{},tolPct:0,limits:{},comboLimit:COMBO_LIMIT};
  if(!cfg.axle.groups) cfg.axle.groups={};
  if(!cfg.axle.limits) cfg.axle.limits={};
  return cfg.axle;
}
/* Site-editable limit, falling back to the regulated figure. */
function axleLimit(id){
  const a=axleCfg(), g=axleGroup(id);
  const v=parseFloat(a.limits[id]);
  return isFinite(v)&&v>0?v:g.limit;
}
function setAxleOn(v){ axleCfg().on=!!v; saveCfg(); renderSettings&&renderSettings(); renderWeighAxle(); }
function setAxlePreset(v){
  const a=axleCfg(); a.preset=v;
  const p=TRUCK_PRESETS.find(x=>x.id===v);
  if(p&&p.decks.length){
    a.groups={};
    DECK_SLOTS.forEach((s,i)=>{ a.groups[s.k]=p.decks[i]||'none'; });
  }
  saveCfg(); renderWeighAxle();
}
function setAxleGroup(k,v){
  const a=axleCfg(); a.groups[k]=v; a.preset='';   // hand override drops the preset label
  saveCfg(); renderWeighAxle();
}
function setAxleLimit(id,v){
  const a=axleCfg(); const n=parseFloat(v);
  if(isFinite(n)&&n>0) a.limits[id]=n; else delete a.limits[id];
  saveCfg();
}
function setAxleTol(v){ axleCfg().tolPct=Math.max(0,parseFloat(v)||0); saveCfg(); renderWeighAxle(); }

/* Evaluate the live decks against the assigned groups.
   `blocked` is the important one: if the decks do not add up to the gross a
   group is straddling a joint, every deck figure is wrong, and NO verdict is
   given. Calling a straddled truck legal is the failure that kills trust in
   a check-weigh system. */
function axleEval(bi){
  const bc=cfg.bridges[bi]||{}, st=bState[bi]||{}, a=axleCfg();
  if(!isMulti(bc)) return null;
  const tol=1+((parseFloat(a.tolPct)||0)/100);
  const sl=deckSlots(bc);
  const rows=sl.map((s,i)=>{
    const w=(st.decks||[])[i];
    const gid=a.groups[s.k]||'none';
    const g=axleGroup(gid), lim=axleLimit(gid)*tol;
    const has=w!==null&&w!==undefined;
    const pct=(has&&lim>0)?(w/lim)*100:null;
    return {slot:s, w:has?w:null, gid, g, limit:gid==='none'?0:Math.round(lim),
            pct, over:(has&&lim>0&&w>lim)?Math.round(w-lim):0};
  });
  const gross=(st.live!=null?st.live:st.deckSum);
  const comboLim=(parseFloat(a.comboLimit)||COMBO_LIMIT)*tol;
  const comboOver=(gross!=null&&gross>comboLim)?Math.round(gross-comboLim):0;
  const anyOver=rows.some(r=>r.over>0)||comboOver>0;
  const mapped=rows.some(r=>r.gid!=='none');
  return {rows, gross, comboLim:Math.round(comboLim), comboOver, anyOver, mapped,
          blocked: st.deckAgrees===false, noCheck: st.deckAgrees===null};
}

/* Side-on schematic generated from the assignment — always matches the truck,
   unlike fixed truck artwork. Each deck segment is tinted by its own load. */
/* Side-on vehicle drawing generated from the selected truck preset.
   Each deck owns a horizontal band and is tinted by its own load, but chassis
   rails and tipper bin walls run FLUSH across deck boundaries within the same
   unit - so an interlink reads as one vehicle rather than four separate boxes,
   while a drawbar trailer is visibly a separate unit behind the truck.
   Generated rather than fixed artwork, so it always matches the actual rig. */
function axleShapeFor(ev,idx){
  const a=axleCfg();
  const p=TRUCK_PRESETS.find(x=>x.id===a.preset);
  if(p&&p.shape&&p.shape[idx]) return p.shape[idx];
  const gid=ev.rows[idx]&&ev.rows[idx].gid;
  if(gid==='steer') return idx===0?'cab':'steer2';
  if(gid==='none')  return 'none';
  return idx===1?'drive':'tipper';
}
function axleUnitOf(ev,idx){
  const a=axleCfg();
  const p=TRUCK_PRESETS.find(x=>x.id===a.preset);
  if(p&&p.unit&&p.unit[idx]!=null) return p.unit[idx];
  return idx===0?0:1;
}
function axleSchematic(ev){
  if(!ev) return '';
  var segW=108, H=124, GROUND=88, N=ev.rows.length, W=N*segW+16;
  var STEEL='#39414A', TYRE='#22272D', RIM='#8A8172', GLASS='#DCE6F2';
  var x0=8, parts='';

  parts+='<line x1="0" y1="'+(GROUND+10)+'" x2="'+W+'" y2="'+(GROUND+10)+'" stroke="#CFC5AC" stroke-width="2"/>';

  function wheels(cx0,n,dual){
    var o='', i, cx;
    for(i=0;i<n;i++){
      cx=cx0+(i-(n-1)/2)*26;
      if(dual){
        o+='<circle cx="'+(cx-5)+'" cy="'+GROUND+'" r="9" fill="'+TYRE+'"/>';
        o+='<circle cx="'+(cx+5)+'" cy="'+GROUND+'" r="9" fill="'+TYRE+'"/>';
        o+='<circle cx="'+(cx+5)+'" cy="'+GROUND+'" r="3.4" fill="'+RIM+'"/>';
      } else {
        o+='<circle cx="'+cx+'" cy="'+GROUND+'" r="9" fill="'+TYRE+'"/>';
        o+='<circle cx="'+cx+'" cy="'+GROUND+'" r="3.4" fill="'+RIM+'"/>';
      }
    }
    return o;
  }

  ev.rows.forEach(function(r,idx){
    var util = (r.pct==null)?null:r.pct;
    var col = (r.gid==='none'||util==null) ? '#B9AE97'
            : util>100 ? '#D24A36'
            : util>90  ? '#C8881A' : '#1F9D57';
    var shape=axleShapeFor(ev,idx);
    var unit=axleUnitOf(ev,idx);
    var openL = idx>0 && axleUnitOf(ev,idx-1)===unit;
    var openR = idx<N-1 && axleUnitOf(ev,idx+1)===unit;
    var n=(r.g&&r.g.axles)||0, dual=!!(r.g&&r.g.dual);
    var x=x0+idx*segW, mid=x+segW/2, chY=GROUND-14;
    var railL=x+(openL?0:4), railR=x+segW-(openR?0:4);

    if(shape==='cab'){
      var cabX=x+20, cabTop=GROUND-56;
      parts+='<rect x="'+(cabX+44)+'" y="'+(cabTop-6)+'" width="5" height="26" rx="2" fill="'+STEEL+'"/>';
      parts+='<rect x="'+railL+'" y="'+chY+'" width="'+(railR-railL)+'" height="7" fill="'+STEEL+'"/>';
      parts+='<rect x="'+cabX+'" y="'+cabTop+'" width="46" height="42" rx="5" fill="'+col+'"/>';
      parts+='<path d="M'+cabX+' '+(cabTop+42)+' L'+(cabX-16)+' '+(cabTop+42)+' L'+(cabX-16)+' '+(cabTop+24)+' L'+cabX+' '+(cabTop+17)+' Z" fill="'+col+'"/>';
      parts+='<rect x="'+(cabX+6)+'" y="'+(cabTop+6)+'" width="27" height="16" rx="3" fill="'+GLASS+'"/>';
      parts+=wheels(cabX-1,n,dual);
    } else if(shape==='steer2'){
      parts+='<rect x="'+railL+'" y="'+chY+'" width="'+(railR-railL)+'" height="7" fill="'+STEEL+'"/>';
      parts+='<rect x="'+(x+8)+'" y="'+(GROUND-38)+'" width="'+(segW-16)+'" height="24" rx="3" fill="'+col+'"/>';
      parts+=wheels(mid,n,dual);
    } else if(shape==='drive'||shape==='tipper'||shape==='draw'||shape==='rigid'){
      var binTop=GROUND-62, binBot=GROUND-22;
      var tl=x+(openL?0:3), tr=x+segW-(openR?0:3);
      var bl=x+(openL?0:16), br=x+segW-(openR?0:16);
      parts+='<rect x="'+railL+'" y="'+chY+'" width="'+(railR-railL)+'" height="7" fill="'+STEEL+'"/>';
      if(shape==='drive')
        parts+='<rect x="'+(x+8)+'" y="'+(chY-8)+'" width="46" height="8" rx="2" fill="'+STEEL+'"/>';
      if(shape==='draw'&&!openL){
        parts+='<rect x="'+(x-10)+'" y="'+(chY+2)+'" width="12" height="4" fill="'+STEEL+'"/>';
        parts+='<circle cx="'+(x-12)+'" cy="'+(chY+4)+'" r="4" fill="none" stroke="'+STEEL+'" stroke-width="2.5"/>';
      }
      parts+='<path d="M'+tl+' '+binTop+' L'+tr+' '+binTop+' L'+br+' '+binBot+' L'+bl+' '+binBot+' Z" fill="'+col+'"/>';
      parts+='<rect x="'+tl+'" y="'+(binTop-5)+'" width="'+(tr-tl)+'" height="6" rx="2" fill="'+col+'"/>';
      parts+='<rect x="'+tl+'" y="'+(binTop-5)+'" width="'+(tr-tl)+'" height="6" rx="2" fill="#000" opacity="0.12"/>';
      var k, fx, fbx;
      for(k=1;k<=3;k++){
        fx=tl+(tr-tl)*k/4; fbx=bl+(br-bl)*k/4;
        parts+='<line x1="'+fx+'" y1="'+binTop+'" x2="'+fbx+'" y2="'+binBot+'" stroke="#000" stroke-opacity="0.15" stroke-width="2"/>';
      }
      parts+=wheels(shape==='drive'?mid+14:mid,n,dual);
    } else {
      parts+='<rect x="'+(x+8)+'" y="'+(GROUND-36)+'" width="'+(segW-16)+'" height="22" rx="4" fill="'+col+'" opacity="0.3"/>';
      parts+=wheels(mid,n,dual);
    }

    parts+='<text x="'+mid+'" y="'+(GROUND-70)+'" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1A1A1A">'+
           (r.w==null?'\u2014':fmt(Math.round(r.w)))+'</text>';
    parts+='<text x="'+mid+'" y="'+(GROUND+24)+'" font-size="9" font-weight="700" text-anchor="middle" fill="#8A8172">'+
           esc(r.slot.l)+'</text>';
  });

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:100%;height:auto">'+parts+'</svg>';
}

function parseRaw(ln,bc){
  if(ln==null) return null;
  ln=String(ln);
  // ── MANUAL position mode (only if explicitly chosen via parser tool) ──
  if(bc && bc.manualParse && parseInt(bc.read)>0){
    const skip=parseInt(bc.skip)||0, read=parseInt(bc.read)||6;
    const sub=ln.substr(skip,read).replace(/[^0-9.\-]/g,'');
    const w=parseFloat(sub);
    return isFinite(w)?w:null;
  }
  // ── AUTO mode (default) — find the weight number in the line ──
  const toks=numTokens(ln);
  if(!toks.length) return null;
  let best=null, bestLen=0;
  for(const t of toks){
    // pick the LONGEST numeric token — that's the weight, not a status digit
    const digits=String(t.val).replace(/[^0-9]/g,'').length;
    if(digits>bestLen){ bestLen=digits; best=t.val; }
  }
  return best;
}
async function unpairBridge(bi){
  const bc=cfg.bridges[bi];
  if(!confirm('Unpair the serial port for '+(bc.name||'Bridge '+(bi+1))+'? You will need to pick it again.'))return;
  if(window.issDesktop && _nativeSerial){ await disconnectNative(bi); auditLog('config','settings','bridge'+bi,'Released serial port'); return; }
  bc.paired=false; delete bc.usbVendorId; delete bc.usbProductId; saveCfg();
  await disconnectSerial(bi);
  auditLog('config','settings','bridge'+bi,'Unpaired serial port');
  toast('Port unpaired','info');
  renderSettings();
}
async function disconnectSerial(bi){
  const br=bState[bi];
  try{
    if(br.reader){ await br.reader.cancel(); /* releaseLock handled in readSerial finally */ }
  }catch{}
  // wait for the read loop's finally{} to release the lock
  await new Promise(r=>setTimeout(r,120));
  try{
    if(br.serial){ await br.serial.close(); br.serial=null; }
  }catch(e){ console.warn('close',e.message); }
  br.reader=null;
  br.state='disconnected';
  // let the OS fully release the COM handle before any reopen
  await new Promise(r=>setTimeout(r,250));
  startSim(bi);
  toast('Disconnected','info');
}

// RAW SERIAL PARSER / READER — commissioning diagnostic
// Opens a COM port, shows live hex+ASCII of every byte the
// indicator sends, auto-detects the weight field, and lets
// you set skip/read for a bridge by clicking the data.
// ══════════════════════════════════════════════════════════
let _rawPort=null, _rawReader=null, _rawRunning=false, _rawBridge=0;
let _rawLines=[];          // recent decoded lines (raw strings)
let _rawByteBuf='';        // accumulator
let _rawFrozen=false;
let _rawCfg={baud:'9600',parity:'none',dataBits:8,stopBits:1};

let _parserNativeFeed=false;
function rawFeedNative(data){
  if(_rawFrozen) return;
  _rawByteBuf += data;
  const parts=_rawByteBuf.split(/[\r\n\x02\x03]+/);
  _rawByteBuf=parts.pop();
  for(const ln of parts){
    if(!ln.length) continue;
    _rawLatest=ln; _rawLines.unshift(ln);
    if(_rawLines.length>50) _rawLines.pop();
  }
  if(_rawByteBuf.length>200){ _rawByteBuf=''; }
  rawRenderMonitor(); rawRenderCharmap();
}
function openRawParser(bridgeIdx){
  _rawBridge = bridgeIdx ?? activeBridge;
  _rawLines=[]; _rawByteBuf=''; _rawFrozen=false;
  // preload settings from that bridge
  const bc=cfg.bridges[_rawBridge]||{};
  _rawCfg={baud:bc.baud||'9600',parity:bc.parity||'none',dataBits:bc.dataBits||8,stopBits:1};
  openModal('🔬 Raw Serial Parser — '+(cfg.bridges[_rawBridge]?.name||'Bridge '+(_rawBridge+1)), rawParserHTML());
}

let _rawSkip=0, _rawRead=6, _rawLatest='';

async function rawConnect(){
  // In the EXE, the native port is already streaming — just tap into it
  if(window.issDesktop && _nativeSerial){
    const bc=cfg.bridges[_rawBridge];
    if(!bc.comPath){
      toast('Set the serial port for this bridge first (Settings → Set Serial Port), then open the parser','error',6000);
      return;
    }
    _parserNativeFeed=true;
    _rawRunning=true;
    const btn=document.getElementById('raw-connect-btn');
    if(btn){ btn.textContent='⏹ Stop'; btn.className='btn btn-red btn-sm'; }
    toast('Reading live from '+bc.comPath+' (native)','success');
    return;
  }
  if(!('serial' in navigator)){
    toast('Web Serial needs Chrome/Edge desktop or the EXE app','error');
    return;
  }
  if(_rawRunning){ rawDisconnect(); return; }

  // ── CRITICAL: a COM port can only be held by ONE connection.
  // Release any live weighing connection on BOTH bridges first,
  // otherwise the OS reports "port not available".
  for(let i=0;i<bState.length;i++){
    if(bState[i].serial){
      try{ if(bState[i].reader) await bState[i].reader.cancel(); }catch{}
      await new Promise(r=>setTimeout(r,100));
      try{ if(bState[i].serial) await bState[i].serial.close(); }catch{}
      bState[i].reader=null; bState[i].serial=null; bState[i].state='sim';
    }
    stopSim(i);
  }
  // give Windows time to fully release the COM handle
  await new Promise(r=>setTimeout(r,300));

  try{
    _rawCfg.baud=document.getElementById('raw-baud').value;
    _rawCfg.parity=document.getElementById('raw-parity').value;
    _rawCfg.dataBits=parseInt(document.getElementById('raw-data').value)||8;

    // Reuse an already-granted port if possible (avoids double-open)
    let port=null;
    try{
      const ports=await navigator.serial.getPorts();
      // requestPort always shows the chooser; that's what we want here
    }catch{}
    _rawPort=await navigator.serial.requestPort();

    // Retry open up to 3× — the handle may still be settling
    let opened=false, lastErr=null;
    for(let attempt=0;attempt<3 && !opened;attempt++){
      try{
        await _rawPort.open({baudRate:parseInt(_rawCfg.baud),dataBits:_rawCfg.dataBits,stopBits:1,parity:_rawCfg.parity});
        opened=true;
      }catch(e){
        lastErr=e;
        // "port already open" or "failed to open" → wait and retry
        await new Promise(r=>setTimeout(r,400));
      }
    }
    if(!opened) throw lastErr||new Error('Could not open port');

    _rawRunning=true;
    const btn=document.getElementById('raw-connect-btn');
    if(btn){ btn.textContent='⏹ Close Port'; btn.className='btn btn-red btn-sm'; }
    rawRead();
    toast('Port open — reading raw data','success');
  }catch(e){
    _rawRunning=false;
    if(e.name==='AbortError'){ /* user cancelled chooser */ }
    else if(/already open|in use|not available|failed to open/i.test(e.message||'')){
      toast('Port busy — unplug/replug the USB cable, then try again','error',6000);
    }else{
      toast('Open failed: '+(e.message||e.name),'error',5000);
    }
    // restart sim so the app stays alive
    startSim(0); startSim(1);
  }
}

async function rawRead(){
  const dec=new TextDecoder();
  try{
    _rawReader=_rawPort.readable.getReader();
    while(_rawRunning){
      const {value,done}=await _rawReader.read();
      if(done)break;
      if(_rawFrozen) continue;
      const chunk=dec.decode(value,{stream:true});
      _rawByteBuf+=chunk;
      // Split on CR/LF — keep remainder. Also handle CR-only and LF-only.
      const parts=_rawByteBuf.split(/[\r\n]+/);
      _rawByteBuf=parts.pop();
      // Safety: if no line terminator after 200 chars, flush as one line
      if(_rawByteBuf.length>200){ parts.push(_rawByteBuf); _rawByteBuf=''; }
      for(const ln of parts){
        if(ln.length===0) continue;
        _rawLatest=ln;
        _rawLines.unshift(ln);
        if(_rawLines.length>50)_rawLines.pop();
      }
      if(parts.length){ rawRenderMonitor(); rawRenderCharmap(); }
    }
  }catch(e){
    // expected on cancel
  }finally{
    try{ _rawReader&&_rawReader.releaseLock(); }catch{}
    _rawReader=null;
  }
}

function rawRenderMonitor(){
  const el=document.getElementById('raw-monitor');
  if(!el)return;
  if(!_rawLines.length){el.innerHTML='<div style="color:#6a86a8">Port open — waiting for indicator to send…</div>';return;}
  el.innerHTML=_rawLines.slice(0,20).map((ln,i)=>{
    const hex=[...ln].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join(' ');
    const safe=esc(ln);
    return `<div style="${i===0?'color:#7CD992;font-weight:bold':'color:#4a6a52'};border-bottom:1px solid #1a2c40;padding:2px 0">
      <span style="color:#5a7a92">ASCII:</span> ${safe}
      <span style="color:#3a5a72;font-size:10px;display:block">HEX: ${hex}</span>
    </div>`;
  }).join('');
}

function rawRenderCharmap(){
  const el=document.getElementById('raw-charmap');
  if(!el)return;
  if(!_rawLatest){el.textContent='—';return;}
  el.innerHTML=[..._rawLatest].map((c,i)=>{
    const inField=i>=_rawSkip && i<_rawSkip+_rawRead;
    const isDigit=/[0-9.]/.test(c);
    const bg=inField?(isDigit?'#1B7A43':'#D97706'):'transparent';
    const col=inField?'#fff':(isDigit?'var(--navy)':'var(--text3)');
    const disp=c===' '?'·':esc(c);
    return `<span onclick="rawSetSkip(${i})" title="char ${i}" style="cursor:pointer;padding:1px 3px;border-radius:3px;background:${bg};color:${col}">${disp}</span>`;
  }).join('');
  // live decode
  rawUpdateDetected();
}

function rawSetSkip(i){
  _rawSkip=i;
  document.getElementById('raw-skip').textContent=_rawSkip;
  rawRenderCharmap();
}

function rawUpdateDetected(){
  const sub=_rawLatest.slice(_rawSkip,_rawSkip+_rawRead).replace(/[^0-9.\-]/g,'');
  const w=parseFloat(sub);
  const el=document.getElementById('raw-detected');
  if(el) el.textContent=isNaN(w)?'—':fmt(w)+' '+(cfg.weightUnit||'kg');
}

function rawAutoDetect(){
  if(!_rawLatest){toast('No data yet','error');return;}
  // Find the longest run of digits in the latest line
  let best={start:0,len:0};
  const re=/[0-9][0-9.\s]*[0-9]|[0-9]/g;
  let m;
  while((m=re.exec(_rawLatest))!==null){
    const len=m[0].replace(/\s/g,'').length;
    if(len>best.len) best={start:m.index,len:m[0].length};
  }
  if(best.len){
    _rawSkip=best.start;
    _rawRead=best.len;
    document.getElementById('raw-skip').textContent=_rawSkip;
    document.getElementById('raw-read').textContent=_rawRead;
    rawRenderCharmap();
    toast('Auto-detected weight field at position '+_rawSkip,'success');
  }else toast('No numeric field found in data','error');
}

function rawToggleFreeze(){
  _rawFrozen=!_rawFrozen;
  const b=document.getElementById('raw-freeze-btn');
  if(b) b.textContent=_rawFrozen?'▶ Resume':'⏸ Freeze';
}
function rawClear(){ _rawLines=[]; rawRenderMonitor(); }

async function rawDisconnect(){
  _rawRunning=false;
  _parserNativeFeed=false;                       // stops the read loop
  try{ if(_rawReader) await _rawReader.cancel(); }catch{}
  // wait for rawRead's finally{} to release the lock
  await new Promise(r=>setTimeout(r,120));
  try{ if(_rawPort){ await _rawPort.close(); _rawPort=null; } }catch(e){ console.warn('raw close',e.message); }
  _rawReader=null;
  const b=document.getElementById('raw-connect-btn');
  if(b){ b.textContent='🔌 Open Port'; b.className='btn btn-green btn-sm'; }
  // let the OS release the COM handle, then resume sim
  await new Promise(r=>setTimeout(r,250));
  if(!_rawRunning){ startSim(0); startSim(1); }
}
async function rawClose(){ await rawDisconnect(); closeModal(); }

async function rawApplyToBridge(){
  setBridge(_rawBridge,'skip',_rawSkip);
  setBridge(_rawBridge,'read',_rawRead);

//  WEIGHBOX — ESP32 box auto-connect + remote_tx sync
// ══════════════════════════════════════════════════════════

// Connect to a WeighBox WebSocket (from box or manually entered URL)
/* Demand-mode polling over ScaleLink.
   USB and TCP both write the poll command straight down the wire; the box
   path could not, because a WebSocket frame is not a serial byte stream. The
   command is wrapped so the ESP32 knows to forward it to its RS232 port:

       {"cmd":"serial","data":"KPRINT\r\n"}

   The firmware must handle cmd=="serial" by writing data to Serial. Without
   that handler this is harmless — the box just ignores an unknown message. */
let boxPollTimers={};
function stopBoxPoll(bi){ if(boxPollTimers[bi]){ clearInterval(boxPollTimers[bi]); delete boxPollTimers[bi]; } }
function startBoxPoll(sock, bi){
  stopBoxPoll(bi);
  const bc=cfg.bridges[bi]||{};
  if(!bc.pollCmd) return;                       // streaming indicator: nothing to send
  const data=expandPoll(bc.pollCmd);            // <CR><LF> etc -> real bytes
  const send=()=>{
    if(!sock || sock.readyState!==1){ stopBoxPoll(bi); return; }
    try{ sock.send(JSON.stringify({cmd:'serial', data})); }
    catch(e){ console.warn('[box] poll send failed: '+e.message); }
  };
  send();
  boxPollTimers[bi]=setInterval(send, Math.max(250, parseInt(bc.pollMs)||1000));
}

function connectBox(url, bi){
  bi = bi ?? activeBridge;
  if(!url) return;
  disconnectBox(bi);
  stopSim(bi);
  try{
    const sock = new WebSocket(url);
    boxSocks[bi] = sock;
    sock.onopen = () => {
      setPill('📦 WeighBox live','rgba(27,122,67,.15)','#4ADE80', bi);
      toast('WeighBox connected on Bridge '+(bi+1),'success');
      sock.send(JSON.stringify({cmd:'ping'}));
      startBoxPoll(sock, bi);        // demand-mode indicators (920i KPRINT etc.)
    };
    sock.onmessage = e => {
      try{
        const d = JSON.parse(e.data);
        // ── Live weight update from box
        if(d.weight != null || d.kg != null){
          const w = parseFloat(d.weight ?? d.kg) || 0;
          bState[bi].live = w;
          if(d.box_name) cfg.bridges[bi].name = d.box_name;
          if(bi === activeBridge) updateWeight(w);
          boxInfo[bi] = d;
          // Update pill with box ID
          const lbl = (d.box_name||('Box '+(bi+1))) + (d.scale_ok?' ●':' ○');
          setPill('📦 '+lbl,'rgba(27,122,67,.15)','#4ADE80', bi);
        }
        // ── Remote transaction from another box on the network (UDP relay)
        if(d.cmd === 'remote_tx' && d.tx){
          mergeRemoteTx(d.tx, d.from_box);
        }
      }catch{}
    };
    sock.onclose = () => {
      setPill('◌ Box disconnected','rgba(220,38,38,.15)','#FCA5A5', bi);
      startSim(bi);
      // Auto-reconnect after 5s
      clearTimeout(boxReconnTimers[bi]);
      boxReconnTimers[bi] = setTimeout(() => connectBox(url, bi), 5000);
    };
    sock.onerror = () => {};
  }catch(e){ toast('Box connect error: '+e.message,'error'); startSim(bi); }
}

function disconnectBox(bi){
  stopBoxPoll(bi);
  clearTimeout(boxReconnTimers[bi]);
  boxReconnTimers[bi] = null;
  if(boxSocks[bi]){ try{ boxSocks[bi].close(); }catch{} boxSocks[bi]=null; }
}

// Tell the box about a completed transaction → it relays to all other boxes via UDP
function syncTxToBox(tx){
  boxSocks.forEach(sock => {
    if(sock && sock.readyState === WebSocket.OPEN){
      sock.send(JSON.stringify({cmd:'sync_tx', tx}));
    }
  });
  // Also push to Electron desktop sync if available
  if(window.issDesktop) window.issDesktop.syncWrite(tx).catch(()=>{});
}

// Merge a transaction that arrived from another box
function mergeRemoteTx(txData, fromBox){
  try{
    const rt = typeof txData === 'string' ? JSON.parse(txData) : txData;
    if(!rt || !rt.id) return;
    // Already have it?
    if(txs.find(t => t.id === rt.id)) return;
    txs.unshift(rt);
    // If it was pending on our side, remove from pending
    pending = pending.filter(p => p.vehicleReg !== rt.vehicleReg);
    saveTxs(); savePend();
    updateWBCount();
    toast('🔄 Synced from Box '+(fromBox||'?')+': '+rt.vehicleReg+' — '+fmt(rt.net||0)+' kg','info');
    if(currentTab==='dashboard') renderDash();
    if(currentTab==='records') renderRecords();
  }catch(e){ console.error('mergeRemoteTx',e); }
}

// Scan the local network for ISS WeighBox devices via /info endpoint
// Tries common IPs: 192.168.x.1 (gateway/AP) and mDNS hostnames
async function scanForBoxes(){
  if(window.issDesktop) return [];   // offline EXE: native serial only, no network scan
  const results = [];
  const urls = [
    'http://192.168.4.1/info',      // ESP32 default AP IP
    'http://iss-wb-001.local/info', // mDNS box 001
    'http://iss-wb-002.local/info', // mDNS box 002
    'http://iss-wb-003.local/info', // mDNS box 003
  ];
  // Also try the current page's host if served from a box
  if(window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1'){
    urls.unshift('http://'+window.location.hostname+'/info');
  }
  await Promise.allSettled(urls.map(async url => {
    try{
      const r = await fetch(url, {signal: AbortSignal.timeout(1500)});
      if(r.ok){ const d = await r.json(); results.push({...d, url}); }
    }catch{}
  }));
  return results;
}

// Auto-connect: called on startup — if loaded FROM a box, connect immediately
function autoConnectBox(){
  // The WeighBox firmware injects window._ISS_BOX_WS with the WebSocket URL
  if(window._ISS_BOX_WS){
    toast('📦 WeighBox detected — connecting…','info');
    connectBox(window._ISS_BOX_WS, 0);
    // Save it for future manual use
    if(!cfg.bridges[0].src) { cfg.bridges[0].src = window._ISS_BOX_WS; saveCfg(); }
    return;
  }
  // Also check if saved box URLs exist in config
  cfg.bridges.forEach((br, i) => {
    if(br.src && /^wss?:\/\//.test(br.src)){
      connectBox(br.src, i);
    }
  });
}

}

// ── Stable / in-motion detection ──
// Heuristic: reading is STABLE once it has stayed within MOTION_TOL of a
// reference value for SETTLE_MS; any larger jump marks IN MOTION and restarts
// the settle timer. Works for both live serial feeds and the simulator.
const MOTION_TOL=80, SETTLE_MS=700;
let _mRef=null,_mSince=0,_mStable=true;
function computeMotion(w){
  const now=(typeof performance!=='undefined'?performance.now():Date.now());
  if(_mRef===null){_mRef=w;_mSince=now;_mStable=false;return false;}
  if(Math.abs(w-_mRef)>MOTION_TOL){_mRef=w;_mSince=now;_mStable=false;}
  else if(now-_mSince>=SETTLE_MS){_mStable=true;}
  return _mStable;
}
function setMotion(stable){
  document.querySelectorAll('.ns-motion').forEach(el=>{
    el.classList.toggle('stable',stable);
    el.classList.toggle('motion',!stable);
    const l=el.querySelector('.ns-motion-lbl'); if(l) l.textContent=stable?'STABLE':'IN MOTION';
  });
}
function motionPill(){
  return `<span class="ns-motion ${_mStable?'stable':'motion'}"><span class="ns-dot"></span><span class="ns-motion-lbl">${_mStable?'STABLE':'IN MOTION'}</span></span>`;
}

function updateWeight(w){
  renderDeckBar();
  const u=cfg.weightUnit||'kg';
  document.getElementById('hdr-wt').textContent=Math.round(w);
  document.getElementById('wb-live').textContent=Math.round(w);
  const over=cfg.grossMax>0&&w>cfg.grossMax;
  document.getElementById('hdr-wt').classList.toggle('over',over);
  setMotion(computeMotion(Math.round(w)));
}

// ── WEIGHING ────────────────────────────────────
/* Freeze the live per-deck weights and the axle assignment onto the
   transaction. Without this the numbers live only in bState and are gone the
   moment the next poll lands — which is exactly why they never printed. */
function captureDecks(tx,key){
  const bc=cfg.bridges[activeBridge]||{}, st=bState[activeBridge]||{};
  if(!isMulti(bc)||!Array.isArray(st.decks)) return;
  tx[key]=st.decks.map(v=>(v==null?null:Math.round(v)));
  const a=axleCfg();
  if(a.on){ tx.axleGroups=Object.assign({},a.groups); tx.truckPreset=a.preset||''; }
}

/* manual=true reads the hand-typed box on the Manual Weigh tab instead of the
   indicator, and flags the ticket so the audit trail shows it was keyed. */
function cap1(manual){
  if(!activeDir){ toast('Pick Dispatch or Receive first','error'); return; }
  const w = manual
    ? applyDivision(parseFloat(document.getElementById('f-manual-w')?.value), activeBridge)
    : applyDivision(bState[activeBridge].live, activeBridge);
  if(!isFinite(w)||w<=0){
    toast(manual?'Enter a weight first':'No weight on scale','error');
    if(manual) document.getElementById('f-manual-w')?.focus();
    return;
  }
  const reg=(document.getElementById('f-reg')?.value||'').trim().toUpperCase();
  if(!reg){toast('Enter vehicle registration first','error');document.getElementById('f-reg')?.focus();return;}
  const existing=pending.find(p=>p.vehicleReg===reg);   // any bridge — one truck, one weigh-in
  if(existing){toast(reg+' already on site with 1st weight','error');return;}
  const bc=cfg.bridges[activeBridge];
  activeTx.vehicleReg=reg;
  activeTx.direction=activeDir;                 // 'dispatch' or 'receive'
  activeTx.product=(document.getElementById('f-prod')?.value||'').trim();
  activeTx.customer=(document.getElementById('f-cust')?.value||'').trim();
  activeTx.transporter=(document.getElementById('f-trans')?.value||'').trim();
  activeTx.supplier=(document.getElementById('f-sup')?.value||'').trim();
  activeTx.destination=(document.getElementById('f-dest')?.value||'').trim();
  activeTx.driver=(document.getElementById('f-driver')?.value||'').trim();
  // Order field is now type-or-pick: value is the order NUMBER. If it matches an
  // existing order, keep that order's id for validation; otherwise store the
  // free-typed number and remember it for the report.
  const ordTyped=(document.getElementById('f-order')?.value||'').trim();
  const matchOrder=orders.find(o=>String(o.no)===ordTyped);
  activeTx.orderId=matchOrder?matchOrder.id:'';
  activeTx.orderNoManual=matchOrder?'':ordTyped;   // free-typed order number (no matching order record)
  // Batch Number / Dispatch Ticket Nr — one field, meaning depends on direction.
  const bd=(document.getElementById('f-batchdisp')?.value||'').trim();
  if(dirFieldIsDispatch(activeDir)){ activeTx.dispatchTicketNo=bd; activeTx.batchNo=''; }
  else { activeTx.batchNo=bd; activeTx.dispatchTicketNo=''; }
  activeTx.custom=(cfg.customFields||[]).filter(cf=>cf.id!=='cfBatch').map(cf=>({
    id:cf.id, label:cf.label, onTicket:cf.onTicket!==false,
    value:(document.getElementById('f-cf-'+cf.id)?.value||'').trim()
  })).filter(c=>c.value);
  // keep batch in the custom array too (as cfBatch) so existing report/ticket code still finds it
  if(activeTx.batchNo) activeTx.custom.push({id:'cfBatch',label:'Batch No',onTicket:true,value:activeTx.batchNo});
  activeTx.firstWeight=w;
  activeTx.firstWeightTime=nowISO();
  if(manual) activeTx.manual=true;      // shows on the ticket and in the audit log
  captureDecks(activeTx,'decks1');      // freeze per-deck weights onto the ticket
  activeTx.bridge=activeBridge;
  activeTx.bridgeName=bc?.name||'Bridge '+(activeBridge+1);
  activeTx.operatorName=session?.name||'';
  // Order + fleet checks
  if(activeTx.orderId){
    const o=orders.find(x=>x.id===activeTx.orderId);
    if(o&&o.active===false){
      toast('⛔ Order '+o.no+' is closed (target tonnage reached)','error',5000);return;
    }
    if(o&&o.fleet&&o.fleet.length>0&&!o.fleet.includes(reg)){
      toast('⛔ '+reg+' is NOT on fleet list for order '+o.no,'error',5000);return;
    }
    if(o&&o.targetKg){
      const rem=orderRemainingKg(o);
      if(rem!==null&&rem<=0){ toast('⛔ Order '+o.no+' target already reached','error',5000);return; }
    }
  }
  pending.push({...activeTx,queuedAt:nowISO()});
  savePend();
  auditLog('weigh1','tx',activeTx.vehicleReg,(manual?'MANUAL ':'')+'1st weight '+w+'kg on '+activeTx.bridgeName);
  updateWBCount();
  clearForm();
  toast((manual?'1st weight saved (manual) — ':'1st weight captured — ')+reg+': '+fmt(w)+' '+cfg.weightUnit+' ✓','success');
  if(currentTab==='weigh'||currentTab==='manual') renderWeighScreen(weighMode);
}

    <div style="font-size:11px;font-weight:800;color:var(--text3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">${bPend.length} truck${bPend.length!==1?'s':''} waiting:</div>
    ${rows}<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">Cancel</button>`);

function completeTx(printType){
  activeTx.vehicleReg =(document.getElementById('np-reg')?.value||'').trim().toUpperCase();
  activeTx.orderId    =(document.getElementById('np-ord')?.value||'').trim();
  activeTx.product    =(document.getElementById('np-prod')?.value||'').trim();
  activeTx.customer   =(document.getElementById('np-cust')?.value||'').trim();
  activeTx.transporter=(document.getElementById('np-trans')?.value||'').trim();
  activeTx.supplier   =(document.getElementById('np-sup')?.value||'').trim();
  activeTx.destination=(document.getElementById('np-dest')?.value||'').trim();
  activeTx.driver     =(document.getElementById('np-drv')?.value||'').trim();
  activeTx.notes      =(document.getElementById('np-notes')?.value||'').trim();
  // Batch Number / Dispatch Ticket Nr — one field, meaning set by the direction
  // chosen at 1st weigh. Written back to whichever property applies.
  const bdEl=document.getElementById('np-batchdisp');
  if(bdEl){
    const bd=String(bdEl.value||'').trim();
    if(dirFieldIsDispatch(txDir(activeTx))){ activeTx.dispatchTicketNo=bd; activeTx.batchNo=''; }
    else { activeTx.batchNo=bd; activeTx.dispatchTicketNo=''; }
  }
  activeTx.custom=(cfg.customFields||[]).filter(f=>f.id!=='cfBatch').map(f=>{
    const el=document.getElementById('np-cf-'+f.id);
    const prev=((activeTx.custom||[]).find(c=>c.id===f.id)||{}).value||'';
    // keep what was entered at 1st weigh unless the modal field overrides it
    const value=(el? el.value : prev)||'';
    return {id:f.id, label:f.label, onTicket:f.onTicket!==false, value:String(value).trim()};
  }).filter(c=>c.value);
  // mirror the batch into the custom array so ticket/report code still finds it
  if(activeTx.batchNo) activeTx.custom.push({id:'cfBatch',label:'Batch No',onTicket:true,value:activeTx.batchNo});
  activeTx.id=txId(); activeTx.completedAt=nowISO();
  stampTx(activeTx);
  txs.unshift({...activeTx}); saveTxs(); syncTxToBox(txs[0]); autoBackup('tx');
  _editUnlocked=false;
  auditLog('complete','tx',activeTx.id,activeTx.vehicleReg+' NET '+activeTx.net+'kg ('+activeTx.product+')');
  checkOrderCompletion(activeTx.orderId);   // deactivate order once tonnage reached
  if(cfg.syncFolder){ pending.filter(p=>p.vehicleReg===activeTx.vehicleReg).forEach(pd=>shareDel('pend',_pendKey(pd))); }
  pending=pending.filter(p=>!(p.vehicleReg===activeTx.vehicleReg));
  savePend(); closeModal(); updateWBCount();
  toast('Transaction saved ✓','success');
  const done={...activeTx}; clearTx();
  if(printType==='thermal') printThermal(done);
  else printA4(done);
  if(currentTab==='dashboard')renderDash();
  if(currentTab==='records')renderRecords();
  if(currentTab==='weigh')renderWeigh();     // clear the truck from "on site" NOW
}
function voidTx(){
  if(!confirm('Void this transaction?'))return;
  if(cfg.syncFolder){ pending.filter(p=>p.vehicleReg===activeTx.vehicleReg).forEach(pd=>shareDel('pend',_pendKey(pd))); }
  pending=pending.filter(p=>!(p.vehicleReg===activeTx.vehicleReg));
  savePend(); clearTx(); closeModal(); updateWBCount();
  autoBackup('void');
  auditLog('void','tx',activeTx.vehicleReg,'Voided pending transaction');
  toast('Transaction voided','info');
  if(currentTab==='weigh')renderWeigh();
  if(currentTab==='dashboard')renderDash();
}

/* ── AXLE / DECK ROWS ON THE TICKET ─────────────────────────────────────
   Uses the snapshot taken at weigh time (tx.decks1 / tx.decks2), NOT live
   state — so a reprint months later shows the same numbers as the original.
   Returns [] when the ticket has no deck data, so single-deck sites and any
   ticket taken before this version print exactly as they always did. */
/* Which decks (if any) belong on this ticket.
   TWO RULES, both set by the client:
     1. Axle weights print on DISPATCH tickets only. A receive ticket never
        shows them, however the load was weighed.
     2. Weights ONLY — no axle-group name, no legal limit, no tolerance and
        no OVER wording. The overload check stays on screen for the operator;
        it is not a statement the ticket makes to the driver.
   Returns [] when there is nothing to print, so single-deck sites and every
   ticket taken before this version print exactly as they always did. */
function ticketDeckSnapshot(tx){
  if(txDir(tx)!=='dispatch') return null;              // rule 1
  return (Array.isArray(tx.decks2)&&tx.decks2.some(v=>v!=null)) ? tx.decks2
       : (Array.isArray(tx.decks1)&&tx.decks1.some(v=>v!=null)) ? tx.decks1 : null;
}
function ticketDeckRows(tx){
  const which=ticketDeckSnapshot(tx);
  if(!which) return [];
  const u=cfg.weightUnit||'kg', rows=[];
  which.forEach((w,i)=>{
    const slot=DECK_SLOTS[i]; if(!slot||w==null) return;
    rows.push([slot.l, fmt(w)+' '+u]);                 // rule 2
  });
  return rows;
}
/* Same data, condensed for a 32-column thermal roll. */
function ticketDeckRowsNarrow(tx){
  const which=ticketDeckSnapshot(tx);
  if(!which) return [];
  const rows=[];
  which.forEach((w,i)=>{
    const slot=DECK_SLOTS[i]; if(!slot||w==null) return;
    rows.push([slot.l, fmt(w)]);
  });
  return rows;
}

// ── ESC/POS raw thermal (proper cutter, no browser dialog) ──
async function escposPrint(tx){
  if(!('serial' in navigator)){ return false; }
  try{
    const port=await navigator.serial.requestPort();
    await port.open({baudRate:parseInt(cfg.escposBaud)||9600});
    const enc=new TextEncoder();
    const w=port.writable.getWriter();
    const ESC='\x1B', GS='\x1D';
    const u=cfg.weightUnit||'kg';
    const net=tx.net??Math.abs((tx.secondWeight||0)-(tx.firstWeight||0));
    let out='';
    out+=ESC+'@';                    // init
    out+=ESC+'a'+'\x01';            // center
    out+=ESC+'!'+'\x18';            // double height/width
    const T=cfg.ticket||{};
    if((T.companyName||'').trim()) out+=(T.companyName).trim()+'\n';
    out+=ESC+'!'+'\x00';            // normal
    { const g=k=>((T[k]||'').trim());
      if(g('vat'))     out+='VAT No: '+g('vat')+'\n';
      if(g('address')) out+=g('address')+'\n';
      if(g('reg'))     out+='Reg: '+g('reg')+'\n';
      if(g('phone'))   out+='Tel: '+g('phone')+'\n';
      if(g('email'))   out+=g('email')+'\n';
      if(g('tagline')) out+=g('tagline')+'\n'; }
    out+='--------------------------------\n';
    out+=ESC+'a'+'\x00';            // left
    const row=(l,v)=>l.padEnd(14)+String(v)+'\n';
    out+=ESC+'a'+'\x01'+ESC+'!'+'\x10'+tx.vehicleReg+'\n'+ESC+'!'+'\x00'+ESC+'a'+'\x00';
    out+='--------------------------------\n';
    out+=row('1st Weight',fmt(tx.firstWeight)+' '+u);
    out+=row('2nd Weight',fmt(tx.secondWeight)+' '+u);
    { const dr=ticketDeckRowsNarrow(tx);
      if(dr.length){
        out+='--------------------------------\n';
        out+='AXLE WEIGHTS ('+u+')\n';
        dr.forEach(r=>{ out+=row(r[0],r[1]); });
      } }
    out+=ESC+'a'+'\x01'+ESC+'!'+'\x18'+'NET '+fmt(net)+' '+u+'\n'+ESC+'!'+'\x00'+ESC+'a'+'\x00';
    out+='--------------------------------\n';
    if(tx.product) out+=row('Product',tx.product);
    if(tx.customer)out+=row('Customer',tx.customer);
    if(tx.transporter)out+=row('Transporter',tx.transporter);
    if(tx.orderId) out+=row('Order',(orders.find(o=>o.id===tx.orderId)?.no)||tx.orderId);
    out+=row('Operator',tx.operatorName||'');
    out+=row('Date',fmtDT(tx.completedAt));
    out+='\n'+ESC+'a'+'\x01'+POWERED_BY+'\n\n\n';
    out+=GS+'V'+'\x42'+'\x00';     // partial cut
    await w.write(enc.encode(out));
    w.releaseLock();
    await port.close();
    return true;
  }catch(e){ console.warn('ESC/POS failed:',e.message); return false; }
}

// ══════════════════════════════════════════════════════════
// UNIFIED TICKET RENDERER — uses the ticket builder config.
// Larger, readable fonts. Templates: standard | compact | detailed.
// Always prints via the Windows DEFAULT printer (browser print).
// ══════════════════════════════════════════════════════════
// ── Ticket QR (receiving-side allocation) ──
// Encodes human-readable ticket info so the receiver can scan with any phone
// and allocate the truck to the correct offloading point. No server needed.
function nsQRSVG(text){
  if(typeof qrcode==='undefined') return '';
  let qr=null;
  // Prefer error-correction M, then L — FEWER modules = bigger squares = scans on
  // a thermal printer. (Q first made it needlessly dense.)
  for(const lvl of ['M','L','Q','H']){
    try{ const q=qrcode(0,lvl); q.addData(text); q.make(); qr=q; break; }catch(e){}
  }
  if(!qr) return '';
  const n=qr.getModuleCount();
  const q=4;                     // REQUIRED quiet zone — without it, scanners fail
  const sz=n+q*2;
  let d='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d+='M'+(c+q)+' '+(r+q)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+sz+' '+sz+'" shape-rendering="crispEdges" width="100%" height="100%">'+
         '<rect width="'+sz+'" height="'+sz+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function nsTicketQRText(tx){
  const u=cfg.weightUnit||'kg';
  const t=cfg.ticket||{};
  const net=tx.net??Math.abs((tx.secondWeight||0)-(tx.firstWeight||0));
  const ordNo=tx.orderId?((orders.find(o=>o.id===tx.orderId)?.no)||tx.orderId):'';
  // Cap each free-text field so the QR can't balloon in density (long customer/
  // transporter names would otherwise make it unscannable on thermal). Full,
  // untruncated detail is printed on the ticket itself.
  const cap=(v,n=24)=>{v=String(v||'').trim(); return v.length>n?v.slice(0,n-1)+'…':v;};
  const L=[];
  if((t.companyName||'').trim()) L.push(cap(t.companyName,28));
  L.push('Ticket '+(tx.id||''));
  L.push('Date '+fmtDT(tx.completedAt));
  L.push('Reg '+(tx.vehicleReg||''));
  if(ordNo)          L.push('Order '+cap(ordNo,20));
  if(tx.product)     L.push('Product '+cap(tx.product));
  if(tx.customer)    L.push('Customer '+cap(tx.customer));
  if(tx.transporter) L.push('Transporter '+cap(tx.transporter));
  if(tx.destination) L.push('Destination '+cap(tx.destination));
  L.push('Net '+fmt(net)+' '+u);
  return L.join('\n');
}
function nsTicketQRBlock(tx,t,px,accent){
  if(!t.showQR) return '';
  const svg=nsQRSVG(nsTicketQRText(tx));
  if(!svg) return '';
  const size=Math.max(175,px);   // floor: a QR under ~150px won't scan off thermal
  return `<div style="text-align:center;margin-top:10px">
    <div style="width:${size}px;height:${size}px;margin:0 auto">${svg}</div>
    <div style="font-size:10px;color:#666;margin-top:4px;font-family:'Segoe UI',Arial,sans-serif">Scan to allocate offloading point</div></div>`;
}
