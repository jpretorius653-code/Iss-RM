function renderUsers(){
  document.getElementById('content').innerHTML=`
    <div class="sec-hd">
      <div><h2>User Management</h2><div class="sub">Access levels: Clerk · Supervisor · Manager · Master</div></div>
      <button class="btn btn-navy" onclick="openUserModal()">+ Add User</button>
    </div>
    ${users.map(u=>`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-size:15px;font-weight:800;color:var(--navy)">${esc(u.name)} <span class="badge ${u.role==='master'?'b-blue':'b-gray'}">${esc(roleLabel(u.role))}</span> ${!u.active?'<span class="badge b-gray">Inactive</span>':''}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px">
            ${roleRank(u.role)>=roleRank('supervisor')?esc(roleDef(u.role).desc):(Object.entries(u.perms||{}).filter(([,v])=>v).map(([k])=>k).join(', ')||'No permissions set')}
          </div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="openUserModal('${u.id}')">Edit</button>
          ${u.id!=='master'?`<button class="btn btn-ghost btn-sm" onclick="deleteUser('${u.id}')">Delete</button>`:''}
        </div>
      </div>
    </div>`).join('')}`;
}
const PERMS={weigh:'Weigh tab',records:'Records',database:'Database',orders:'Orders',reports:'Reports'};
function openUserModal(id){
  const u=id?users.find(x=>x.id===id):null;
  const isMasterU=u?.id==='master';
  openModal(u?'Edit User':'Add User',`
    <div class="row2">
      <div class="field"><label>Name</label><input id="u-name" value="${esc(u?.name||'')}" placeholder="Full name" ${isMasterU?'readonly':''}/></div>
      <div class="field"><label>New PIN (4 digits)</label><input id="u-pin" type="password" maxlength="4" placeholder="${u?'Leave blank to keep':'1234'}" inputmode="numeric"/></div>
    </div>
    ${!isMasterU?`
    <div class="field"><label>Access Level</label>
      <select id="u-role" onchange="onRoleChange()">
        ${ROLES.filter(r=>r.id!=='master'||roleAtLeast('master')).map(r=>
          `<option value="${r.id}" ${(u?.role||'clerk')===r.id?'selected':''}>${esc(r.l)} — ${esc(r.desc)}</option>`).join('')}
      </select>
      <div id="u-role-note" style="font-size:11px;color:var(--text3);margin-top:4px"></div>
    </div>
    <div class="field" id="u-perm-wrap" style="margin-bottom:6px"><label>Permissions</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
        ${Object.entries(PERMS).map(([k,l])=>`<div class="perm-chip ${(u?.perms||{})[k]?'on':'off'}" id="pc-${k}" onclick="togglePerm('${k}')">${l}</div>`).join('')}
      </div>
    </div>
    <div class="field"><label>Status</label>
      <select id="u-active"><option value="1" ${u?.active!==false?'selected':''}>Active</option><option value="0" ${u?.active===false?'selected':''}>Inactive</option></select>
    </div>`:''}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-navy" style="flex:1" onclick="saveUser('${u?.id||''}')">Save</button>
    </div>`);
  setTimeout(onRoleChange,0);
}
function togglePerm(k){const el=document.getElementById('pc-'+k);if(el){el.classList.toggle('on');el.classList.toggle('off');}}
/* Supervisor and above get every feature tab by rule, so the per-permission
   chips are meaningless for them — hide them and say why, rather than leaving
   a set of switches on screen that do nothing. */
function onRoleChange(){
  const r=document.getElementById('u-role')?.value||'clerk';
  const wrap=document.getElementById('u-perm-wrap');
  const note=document.getElementById('u-role-note');
  const tiered=roleRank(r)>=roleRank('supervisor');
  if(wrap) wrap.style.display=tiered?'none':'';
  if(note) note.textContent = r==='clerk'
    ? 'Tick the areas this clerk may use.'
    : (r==='supervisor' ? 'All tabs except Settings and Cloud.'
    : (r==='manager'    ? 'All tabs except Cloud.'
    :                     'Full access, including Users and Cloud.'));
}
async function saveUser(id){
  const name=(document.getElementById('u-name')?.value||'').trim();
  const pin=(document.getElementById('u-pin')?.value||'').trim();
  if(!name){toast('Enter a name','error');return;}
  if(!id&&(pin.length!==4||!/^\d{4}$/.test(pin))){toast('PIN must be 4 digits','error');return;}
  const isMasterU=id==='master';
  if(!isMasterU){
    const perms={};Object.keys(PERMS).forEach(k=>{perms[k]=document.getElementById('pc-'+k)?.classList.contains('on');});
    const active=document.getElementById('u-active')?.value!=='0';
    let role=document.getElementById('u-role')?.value||'clerk';
    if(!ROLES.some(r=>r.id===role)) role='clerk';
    // Only a Master may hand out Master. Stops a Manager promoting themselves.
    if(role==='master'&&!roleAtLeast('master')){ toast('Only a Master can grant Master access','error'); return; }
    if(id){const u=users.find(x=>x.id===id);if(u){u.name=name;if(pin){u.pinHash=await hashStr(pin);delete u.pin;}u.perms=perms;u.role=role;u.active=active;auditLog('edit','user',id,'Edited '+roleLabel(role)+' '+name);}}
    else{const nh=await hashStr(pin);users.push({id:'U'+Date.now(),name,pinHash:nh,role,active:true,perms});auditLog('create','user',name,'Created '+roleLabel(role)+' '+name);}
  }else{
    const u=users.find(x=>x.id==='master');if(u){u.name=name;if(pin){if(pin.length!==4||!/^\d{4}$/.test(pin)){toast('PIN must be 4 digits','error');return;}u.pinHash=await hashStr(pin);delete u.pin;auditLog('edit','user','master','Changed master PIN');}}
  }
  saveUsers();closeModal();renderUsers();toast('User saved ✓','success');
}
function deleteUser(id){if(!confirm('Delete this user?'))return;const u=users.find(x=>x.id===id);auditLog('delete','user',id,'Deleted clerk '+(u?.name||id));users=users.filter(u=>u.id!==id);saveUsers();shareDel('users',_uKey(u||{id}));renderUsers();}

// ── AUDIT TRAIL ───────────────────────────────────
let auditFilter='';
function renderAudit(){
  const ICON={login:'🔑',weigh1:'📥',weigh2:'📤',complete:'✅',void:'🗑',edit:'✏️',create:'➕',delete:'❌',reprint:'🖨',access:'🔓',config:'⚙',recover:'⚡'};
  let list=auditTrail;
  if(auditFilter){
    const q=auditFilter.toLowerCase();
    list=list.filter(e=>[e.user,e.action,e.entity,e.entityId,e.detail].join(' ').toLowerCase().includes(q));
  }
  document.getElementById('content').innerHTML=`
    <div class="sec-hd">
      <div><h2>Audit Trail</h2><div class="sub">${auditTrail.length} logged actions · append-only · tamper-evident</div></div>
      <button class="btn btn-ghost btn-sm" onclick="exportAudit()">↓ Export CSV</button>
    </div>
    <div class="card" style="margin-bottom:12px">
      <input id="audit-q" placeholder="🔍 Search by user, action, vehicle, detail…" value="${esc(auditFilter)}" oninput="auditFilter=this.value;renderAuditRows()"/>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div id="audit-rows"></div>
    </div>`;
  renderAuditRows();
}
function renderAuditRows(){
  const ICON={login:'🔑',weigh1:'📥',weigh2:'📤',complete:'✅',void:'🗑',edit:'✏️',create:'➕',delete:'❌',reprint:'🖨',access:'🔓',config:'⚙',recover:'⚡'};
  let list=auditTrail;
  if(auditFilter){
    const q=auditFilter.toLowerCase();
    list=list.filter(e=>[e.user,e.action,e.entity,e.entityId,e.detail].join(' ').toLowerCase().includes(q));
  }
  const el=document.getElementById('audit-rows');
  if(!el)return;
  if(!list.length){el.innerHTML='<div class="empty"><div class="ico">📜</div><p>No audit entries</p></div>';return;}
  el.innerHTML=`<table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>
    ${list.slice(0,300).map(e=>`<tr>
      <td style="font-size:11px;color:var(--text3);white-space:nowrap">${fmtDT(e.ts)}</td>
      <td style="font-weight:700">${esc(e.user)}</td>
      <td style="white-space:nowrap">${ICON[e.action]||'•'} ${esc(e.action)}</td>
      <td style="font-size:12px">${esc(e.detail)}${e.before!==undefined?`<br><span style="font-size:10px;color:var(--red)">was: ${esc(JSON.stringify(e.before))}</span>`:''}</td>
    </tr>`).join('')}</tbody></table>`;
}
function exportAudit(){
  if(!auditTrail.length){toast('No audit entries','error');return;}
  const hdr='Timestamp,User,UserID,Action,Entity,EntityID,Detail\n';
  const rows=auditTrail.map(e=>[e.ts,e.user,e.userId,e.action,e.entity,e.entityId,'"'+(e.detail||'').replace(/"/g,'""')+'"'].join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([hdr+rows],{type:'text/csv'}));
  a.download='ISS-Audit-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();URL.revokeObjectURL(a.href);
  auditLog('config','settings','','Exported audit trail');
  toast('Audit trail exported','success');
}

// ── SETTINGS ──────────────────────────────────────

/* ══════════════════════════════════════════════════════════════════════
   CLOUD — connect this weighbridge to Supabase without touching SQL.

   What runs where, and why:
   A publishable key deliberately cannot create tables — that is the whole
   reason it is safe to ship inside this app. So the backend is built by four
   functions that live in the database, pasted in once from the Cloud tab's
   "Copy setup SQL" button. After that everything happens here: the app calls
   those functions over the normal REST endpoint as a signed-in admin.

   No secret key is ever stored on a weighbridge PC.
   ══════════════════════════════════════════════════════════════════════ */

const ISS_BOOTSTRAP_SQL = "-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n-- ISS \u00b7 BOOTSTRAP \u2014 paste this ONCE into the Supabase SQL editor.\n--\n-- It creates four functions. After this you never open the SQL editor\n-- again: the app's Cloud tab calls these to inspect the backend, build\n-- or repair it, and register each site.\n--\n-- BEFORE RUNNING: put your own login email on the line marked ADMIN.\n-- That account becomes the only one allowed to change the backend.\n-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nbegin;\n\n-- \u2500\u2500 who may provision \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ncreate table if not exists public.iss_admins (\n  user_id uuid primary key references auth.users(id) on delete cascade,\n  added_at timestamptz not null default now()\n);\nalter table public.iss_admins enable row level security;\n\ndrop policy if exists iss_admins_self on public.iss_admins;\ncreate policy iss_admins_self on public.iss_admins\n  for select to authenticated using (user_id = auth.uid());\n\n-- ADMIN: your Supabase Auth account. Create it in Authentication \u2192 Users first.\ninsert into public.iss_admins (user_id)\nselect id from auth.users where email = 'CHANGE-ME@yourdomain.co.za'\non conflict (user_id) do nothing;\n\ncreate or replace function public.iss_is_admin()\nreturns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.iss_admins a where a.user_id = auth.uid());\n$$;\ngrant execute on function public.iss_is_admin() to authenticated;\n\n-- \u2500\u2500 1. iss_status() \u2014 what does the backend look like right now? \u2500\u2500\n-- Read-only. This is what fills the checklist in the Cloud tab, and it is\n-- what works out your user_sites column names instead of you reading them\n-- off a query and typing them into a script.\ncreate or replace function public.iss_status()\nreturns jsonb language plpgsql stable security definer set search_path = public as $$\ndeclare\n  r jsonb := '{}'::jsonb;\n  v_user_col text;\n  v_site_col text;\n  v_site_type text;\nbegin\n  if not public.iss_is_admin() then\n    return jsonb_build_object('error','not an ISS admin');\n  end if;\n\n  -- which column in user_sites holds the auth user, and which holds the site\n  select column_name into v_user_col from information_schema.columns\n   where table_schema='public' and table_name='user_sites'\n     and column_name = any (array['user_id','uid','auth_user_id','user','account_id'])\n   order by array_position(array['user_id','uid','auth_user_id','user','account_id'], column_name)\n   limit 1;\n\n  select column_name, data_type into v_site_col, v_site_type\n    from information_schema.columns\n   where table_schema='public' and table_name='user_sites'\n     and column_name = any (array['site','site_code','site_id','sitename'])\n   order by array_position(array['site','site_code','site_id','sitename'], column_name)\n   limit 1;\n\n  r := jsonb_build_object(\n    'tables', (select jsonb_object_agg(t, ex) from (\n        select t, to_regclass('public.'||t) is not null as ex\n        from unnest(array['transactions','readings','user_sites','sites','orders','fleet']) t) x),\n    'transactions_columns', (select coalesce(jsonb_agg(column_name order by column_name),'[]'::jsonb)\n        from information_schema.columns\n        where table_schema='public' and table_name='transactions'),\n    'has_row_id', exists (select 1 from information_schema.columns\n        where table_schema='public' and table_name='transactions' and column_name='row_id'),\n    'has_site', exists (select 1 from information_schema.columns\n        where table_schema='public' and table_name='transactions' and column_name='site'),\n    'indexes', (select coalesce(jsonb_agg(indexname order by indexname),'[]'::jsonb)\n        from pg_indexes where schemaname='public' and tablename='transactions'),\n    'rls', (select coalesce(jsonb_object_agg(c.relname, c.relrowsecurity),'{}'::jsonb)\n        from pg_class c join pg_namespace n on n.oid=c.relnamespace\n        where n.nspname='public' and c.relname in ('transactions','readings','user_sites')),\n    'policies', (select coalesce(jsonb_agg(jsonb_build_object(\n          'table',tablename,'name',policyname,'cmd',cmd,'roles',roles) order by tablename,policyname),'[]'::jsonb)\n        from pg_policies where schemaname='public'\n          and tablename in ('transactions','readings','user_sites')),\n    'user_sites_user_col', v_user_col,\n    'user_sites_site_col', v_site_col,\n    'user_sites_site_type', v_site_type,\n    'helper_exists', to_regprocedure('public.iss_may_use_site(text)') is not null,\n    'sites_in_transactions', (select coalesce(jsonb_agg(distinct site),'[]'::jsonb)\n        from public.transactions where to_regclass('public.transactions') is not null\n          and exists (select 1 from information_schema.columns\n                      where table_schema='public' and table_name='transactions' and column_name='site')),\n    'anon_policies_transactions', (select count(*) from pg_policies\n        where schemaname='public' and tablename='transactions' and 'anon' = any(roles)),\n    'anon_policies_readings', (select count(*) from pg_policies\n        where schemaname='public' and tablename='readings' and 'anon' = any(roles))\n  );\n  return r;\nend $$;\ngrant execute on function public.iss_status() to authenticated;\n\n-- \u2500\u2500 2. iss_provision() \u2014 build or repair everything \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n-- Idempotent. Safe to run again. Never deletes a ticket.\n-- p_existing_site: the site code that rows already in transactions belong to.\n-- p_user_col / p_site_col: only needed if iss_status() could not work out the\n-- user_sites column names on its own.\ncreate or replace function public.iss_provision(\n  p_existing_site text default null,\n  p_user_col      text default null,\n  p_site_col      text default null,\n  p_lock_readings boolean default false\n) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare\n  acts text[] := '{}';\n  v_user_col text := p_user_col;\n  v_site_col text := p_site_col;\n  v_site_type text;\n  v_body text;\n  v_dupes int;\nbegin\n  if not public.iss_is_admin() then\n    return jsonb_build_object('ok',false,'error','not an ISS admin');\n  end if;\n\n  -- user_sites: create it if absent, otherwise detect its shape\n  if to_regclass('public.user_sites') is null then\n    create table public.user_sites (\n      user_id uuid not null references auth.users(id) on delete cascade,\n      site    text not null,\n      primary key (user_id, site)\n    );\n    alter table public.user_sites enable row level security;\n    create policy us_self_select on public.user_sites\n      for select to authenticated using (user_id = auth.uid());\n    v_user_col := 'user_id'; v_site_col := 'site'; v_site_type := 'text';\n    acts := acts || 'created user_sites';\n  else\n    if v_user_col is null then\n      select column_name into v_user_col from information_schema.columns\n       where table_schema='public' and table_name='user_sites'\n         and column_name = any (array['user_id','uid','auth_user_id','user','account_id'])\n       order by array_position(array['user_id','uid','auth_user_id','user','account_id'], column_name)\n       limit 1;\n    end if;\n    if v_site_col is null then\n      select column_name into v_site_col from information_schema.columns\n       where table_schema='public' and table_name='user_sites'\n         and column_name = any (array['site','site_code','site_id','sitename'])\n       order by array_position(array['site','site_code','site_id','sitename'], column_name)\n       limit 1;\n    end if;\n    select data_type into v_site_type from information_schema.columns\n     where table_schema='public' and table_name='user_sites' and column_name=v_site_col;\n  end if;\n\n  if v_user_col is null or v_site_col is null then\n    return jsonb_build_object('ok',false,\n      'error','could not work out the user_sites columns \u2014 pass them in',\n      'user_col',v_user_col,'site_col',v_site_col);\n  end if;\n\n  -- transactions: keys\n  if to_regclass('public.transactions') is null then\n    return jsonb_build_object('ok',false,'error','table public.transactions does not exist');\n  end if;\n\n  execute 'alter table public.transactions add column if not exists row_id uuid';\n  execute 'alter table public.transactions add column if not exists site text';\n  acts := acts || 'ensured row_id + site columns';\n\n  execute 'update public.transactions set row_id = gen_random_uuid() where row_id is null';\n  if p_existing_site is not null and p_existing_site <> '' then\n    execute format('update public.transactions set site = %L where site is null or site = %L',\n                   p_existing_site, '');\n    acts := acts || ('backfilled existing rows as '||p_existing_site);\n  end if;\n\n  if not exists (select 1 from public.transactions where site is null or site='') then\n    execute 'alter table public.transactions alter column row_id set not null';\n    execute 'alter table public.transactions alter column site set not null';\n    execute 'alter table public.transactions alter column row_id set default gen_random_uuid()';\n    acts := acts || 'row_id + site now required';\n  else\n    acts := acts || 'WARNING: rows still have no site \u2014 pass p_existing_site';\n  end if;\n\n  execute 'create unique index if not exists transactions_row_id_uk on public.transactions (row_id)';\n\n  select count(*) into v_dupes from (\n    select site, ticket from public.transactions\n    where site is not null group by site, ticket having count(*) > 1) d;\n  if v_dupes = 0 then\n    execute 'create unique index if not exists transactions_site_ticket_uk on public.transactions (site, ticket)';\n    acts := acts || 'ticket numbers now unique per site';\n  else\n    acts := acts || ('SKIPPED per-site unique index: '||v_dupes||' duplicate site+ticket pairs already exist');\n  end if;\n\n  -- the helper, generated to match whatever columns this project uses\n  if v_site_type = 'uuid' and to_regclass('public.sites') is not null then\n    v_body := format($f$\n      select exists (\n        select 1 from public.user_sites us\n        join public.sites s on s.id = us.%I\n        where us.%I = auth.uid() and s.code = p_site)$f$, v_site_col, v_user_col);\n    acts := acts || 'helper joins sites.code (site stored as uuid)';\n  else\n    v_body := format($f$\n      select exists (\n        select 1 from public.user_sites us\n        where us.%I = auth.uid() and us.%I = p_site)$f$, v_user_col, v_site_col);\n    acts := acts || format('helper matches user_sites.%s = auth.uid() and user_sites.%s = site', v_user_col, v_site_col);\n  end if;\n\n  execute format($f$\n    create or replace function public.iss_may_use_site(p_site text)\n    returns boolean language sql stable security definer set search_path = public as $body$ %s $body$\n  $f$, v_body);\n  execute 'revoke all on function public.iss_may_use_site(text) from public, anon';\n  execute 'grant execute on function public.iss_may_use_site(text) to authenticated';\n\n  -- policies\n  execute 'alter table public.transactions enable row level security';\n  execute 'drop policy if exists tx_site_select on public.transactions';\n  execute 'drop policy if exists tx_site_insert on public.transactions';\n  execute 'drop policy if exists tx_site_update on public.transactions';\n  execute 'create policy tx_site_select on public.transactions for select to authenticated\n             using (public.iss_may_use_site(site))';\n  execute 'create policy tx_site_insert on public.transactions for insert to authenticated\n             with check (public.iss_may_use_site(site))';\n  execute 'create policy tx_site_update on public.transactions for update to authenticated\n             using (public.iss_may_use_site(site)) with check (public.iss_may_use_site(site))';\n  acts := acts || 'transactions policies set (no delete policy \u2014 a site can never delete a ticket)';\n\n  -- readings is left ALONE unless explicitly asked. The ESP32 gateways sign in\n  -- with the publishable key as anon; switching this table to authenticated-only\n  -- silences them until the firmware is re-flashed, which means a trip to site.\n  if p_lock_readings\n     and to_regclass('public.readings') is not null\n     and exists (select 1 from information_schema.columns\n                 where table_schema='public' and table_name='readings' and column_name='site') then\n    execute 'alter table public.readings enable row level security';\n    execute 'drop policy if exists rd_site_select on public.readings';\n    execute 'drop policy if exists rd_site_insert on public.readings';\n    execute 'create policy rd_site_select on public.readings for select to authenticated\n               using (public.iss_may_use_site(site))';\n    execute 'create policy rd_site_insert on public.readings for insert to authenticated\n               with check (public.iss_may_use_site(site))';\n    acts := acts || 'readings locked to authenticated \u2014 RE-FLASH THE GATEWAYS or they stop posting';\n  else\n    acts := acts || 'readings left as-is (ESP32 gateways keep working)';\n  end if;\n\n  -- Deliberately NOT dropping anon policies on readings here: that is what the\n  -- gateways and the current dashboard build rely on. Retire them from the\n  -- Cloud tab once both can sign in.\n\n  return jsonb_build_object('ok',true,'actions',to_jsonb(acts),\n    'user_col',v_user_col,'site_col',v_site_col);\nend $$;\ngrant execute on function public.iss_provision(text,text,text,boolean) to authenticated;\n\n-- \u2500\u2500 3. iss_register_site() \u2014 link a login to a site by email \u2500\u2500\u2500\u2500\u2500\u2500\n-- Saves copying UUIDs out of the dashboard.\ncreate or replace function public.iss_register_site(p_email text, p_site text)\nreturns jsonb language plpgsql security definer set search_path = public as $$\ndeclare v_id uuid; v_user_col text; v_site_col text;\nbegin\n  if not public.iss_is_admin() then\n    return jsonb_build_object('ok',false,'error','not an ISS admin');\n  end if;\n  if p_site !~ '^[a-z0-9]+(-[a-z0-9]+)*$' then\n    return jsonb_build_object('ok',false,'error','site code must be lower case letters, digits and hyphens');\n  end if;\n\n  select id into v_id from auth.users where lower(email) = lower(p_email);\n  if v_id is null then\n    return jsonb_build_object('ok',false,\n      'error','no Supabase Auth user with that email \u2014 create it in Authentication \u2192 Users first');\n  end if;\n\n  select column_name into v_user_col from information_schema.columns\n   where table_schema='public' and table_name='user_sites'\n     and column_name = any (array['user_id','uid','auth_user_id','user','account_id'])\n   order by array_position(array['user_id','uid','auth_user_id','user','account_id'], column_name) limit 1;\n  select column_name into v_site_col from information_schema.columns\n   where table_schema='public' and table_name='user_sites'\n     and column_name = any (array['site','site_code','sitename'])\n   order by array_position(array['site','site_code','sitename'], column_name) limit 1;\n\n  if v_user_col is null or v_site_col is null then\n    return jsonb_build_object('ok',false,'error','run Set up / repair first');\n  end if;\n\n  execute format('insert into public.user_sites (%I,%I) values (%L,%L) on conflict do nothing',\n                 v_user_col, v_site_col, v_id, p_site);\n  return jsonb_build_object('ok',true,'email',p_email,'site',p_site,'user_id',v_id);\nend $$;\ngrant execute on function public.iss_register_site(text,text) to authenticated;\n\n-- \u2500\u2500 4. iss_my_sites() \u2014 what is THIS login allowed to touch? \u2500\u2500\u2500\u2500\u2500\u2500\n-- Any signed-in account may call it about itself. The Cloud tab uses it to\n-- tell an operator \"this PC is registered for hillside\" before anything breaks.\ncreate or replace function public.iss_my_sites()\nreturns jsonb language plpgsql stable security definer set search_path = public as $$\ndeclare v_user_col text; v_site_col text; v_out jsonb;\nbegin\n  if auth.uid() is null then return jsonb_build_object('signed_in',false); end if;\n  select column_name into v_user_col from information_schema.columns\n   where table_schema='public' and table_name='user_sites'\n     and column_name = any (array['user_id','uid','auth_user_id','user','account_id']) limit 1;\n  select column_name into v_site_col from information_schema.columns\n   where table_schema='public' and table_name='user_sites'\n     and column_name = any (array['site','site_code','sitename']) limit 1;\n  if v_user_col is null or v_site_col is null then\n    return jsonb_build_object('signed_in',true,'sites','[]'::jsonb,'note','backend not set up yet');\n  end if;\n  execute format('select coalesce(jsonb_agg(%I),%L::jsonb) from public.user_sites where %I = auth.uid()',\n                 v_site_col, '[]', v_user_col) into v_out;\n  return jsonb_build_object('signed_in',true,'sites',v_out,'admin',public.iss_is_admin());\nend $$;\ngrant execute on function public.iss_my_sites() to authenticated;\n\ncommit;\n\n-- Done. Open the app \u2192 Cloud tab \u2192 sign in as the admin account \u2192\n-- Check backend \u2192 Set up / repair.\n";

let _cloudTok=null, _cloudBusy=false, _cloudStatus=null, _cloudMsg='', _cloudMsgKind='';

function cloudCfg(){ if(!cfg.cloud) cfg.cloud={url:'',key:'',email:'',pass:'',enabled:false}; return cfg.cloud; }
/* A weighbridge PC gets the PUBLISHABLE key and nothing else. The Cloud Sync
   desktop app is the one that holds a service key, and the two must never be
   confused: a service_role key ignores every row-level rule, so one pasted
   here would let this PC read and rewrite every site's tickets. The warning
   under the field was advice; this is the guard. */
function cloudKeyIsSecret(v){
  const x=String(v||'').trim();
  if(/^sb_secret/i.test(x)) return true;
  if(/^service_role/i.test(x)) return true;
  const parts=x.split('.');                       // legacy JWT-style keys
  if(parts.length===3){
    try{
      const b=parts[1].replace(/-/g,'+').replace(/_/g,'/');
      const j=JSON.parse(atob(b+'==='.slice((b.length+3)%4)));
      if(String(j.role||'').toLowerCase()==='service_role') return true;
    }catch(e){}
  }
  return false;
}
function cloudSet(k,v){
  if(k==='key' && cloudKeyIsSecret(v)){
    toast('That is a SECRET key — it bypasses every access rule. This PC takes the publishable key only.','error',9000);
    renderCloud();
    return;
  }
  cloudCfg()[k]=(typeof v==='string'?v.trim():v); saveCfg();
}
function cloudUrl(){ return (cloudCfg().url||'').replace(/\/+$/,''); }
function cloudSay(msg,kind){ _cloudMsg=msg; _cloudMsgKind=kind||''; renderCloud(); }

/* Sign in with the site (or admin) account and keep the access token. */
// ══════════════════════════════════════════════════════════════════════════
// FLEET + ORDER CLOUD SYNC
//
// WHERE THIS RUNS: on ONE weighbridge PC, ticked as the sync host in the
// Cloud tab. Not on the dashboard, not on a server, not on both bridges.
//
// Why one PC: two bridges sharing a folder both hold the same fleet list.
// If both pulled and pushed, each would keep re-writing the other's rows
// through the share and the folder would never go quiet — the same fight
// that produced Syncthing conflict files before _pushIfChanged. So one PC
// talks to Supabase; the share carries it to the other bridge, exactly as
// it already carries tickets.
//
// Direction: two-way. The client adds trucks on their phone; the clerk adds
// them at the bridge. Last write wins on updated_at, and a removal travels
// as deleted=true rather than a row that silently vanishes.
//
// Needs 06_fleet_orders_remote_write.sql. Without it a site login can read
// this table but not write, and the push half returns 403.
// ══════════════════════════════════════════════════════════════════════════
function syncCfg(){
  const c=cloudCfg();
  if(!c.sync) c.sync={on:false,host:'',everyMin:5,fleetCursor:'',orderCursor:'',lastAt:'',lastMsg:''};
  return c.sync;
}
function syncSet(k,v){ syncCfg()[k]=v; saveCfg(); }
/* A stable-ish id for this PC, so "the sync host" survives a restart. */
function syncThisPC(){
  let id=cfg.deviceId;
  if(!id){ id='pc'+Math.random().toString(36).slice(2,10); cfg.deviceId=id; saveCfg(); }
  return id;
}
function syncIsHost(){ return syncCfg().host===syncThisPC(); }
function syncClaimHost(on){
  syncSet('host', on?syncThisPC():'');
  if(on) syncSet('on',true);
  renderCloud();
}

/* PostgREST helpers that reuse the Cloud tab's sign-in. */
async function _sbAuthed(){
  const c=cloudCfg();
  if(!cloudUrl()||!c.key) throw new Error('Cloud is not configured');
  if(!_cloudTok || _cloudTok===c.key) await cloudSignIn(c.email,c.pass);
  return c;
}
async function _sbReq(path, opts){
  const c=await _sbAuthed();
  const go=async()=>fetch(cloudUrl()+'/rest/v1/'+path, Object.assign({},opts,{
    headers:Object.assign({apikey:c.key,'Authorization':'Bearer '+_cloudTok,
      'Content-Type':'application/json'}, (opts&&opts.headers)||{})}));
  let r=await go();
  if(r.status===401){                       // token aged out mid-shift — sign in again
    await cloudSignIn(c.email,c.pass);
    r=await go();
  }
  if(!r.ok){ let d=''; try{ d=(await r.text()).slice(0,200); }catch(e){}
             throw new Error(r.status+(d?': '+d:'')); }
  const txt=await r.text();
  return txt?JSON.parse(txt):null;
}

const _regKey=r=>String(r||'').trim().toUpperCase().replace(/\s+/g,'');

/* ── PULL ────────────────────────────────────────────────────────────────
   Ask only for what changed since last time. The cursor is the newest
   updated_at already stored, so a bridge that was off for a week catches
   up in one call instead of re-reading the whole list every 5 minutes. */
async function syncPullFleet(){
  const site=siteCode();
  const rows=await _sbReq('rpc/iss_fleet_since',{method:'POST',
    body:JSON.stringify({p_site:site,p_since:syncCfg().fleetCursor||null})});
  if(!Array.isArray(rows)||!rows.length) return {added:0,updated:0,removed:0};
  let added=0,updated=0,removed=0,cursor=syncCfg().fleetCursor||'';
  rows.forEach(r=>{
    if(r.updated_at>cursor) cursor=r.updated_at;
    const key=_regKey(r.reg);
    let i=fleet.findIndex(f=>f._cid===r.id);
    if(i<0) i=fleet.findIndex(f=>_regKey(f.reg)===key);
    if(r.deleted){
      if(i>=0){ fleet.splice(i,1); removed++; }
      return;
    }
    const rec={reg:String(r.reg||'').trim(), trailer1:r.trailer1||'', trailer2:r.trailer2||'',
               driver:r.driver||'', transporter:r.transporter||'',
               tare:(r.tare===null||r.tare===undefined)?'':Number(r.tare)};
    if(i>=0){
      const f=fleet[i];
      // Last write wins. A local edit made AFTER the cloud row was written
      // is not thrown away by a stale pull.
      if(f._at && r.updated_at && new Date(f._at) > new Date(r.updated_at)){ f._cid=r.id; return; }
      let ch=false;
      Object.keys(rec).forEach(k=>{ if(String(f[k]||'')!==String(rec[k]||'')){ f[k]=rec[k]; ch=true; } });
      f._cid=r.id; f._cat=r.updated_at;
      if(ch){ f._at=r.updated_at; updated++; }
    }else{
      fleet.push(Object.assign({id:r.local_id||('fl'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),
        _cid:r.id,_cat:r.updated_at,_at:r.updated_at}, rec));
      added++;
    }
  });
  syncSet('fleetCursor',cursor);
  if(added||updated||removed) saveFleet();
  return {added,updated,removed};
}
async function syncPullOrders(){
  const site=siteCode();
  const rows=await _sbReq('rpc/iss_orders_since',{method:'POST',
    body:JSON.stringify({p_site:site,p_since:syncCfg().orderCursor||null})});
  if(!Array.isArray(rows)||!rows.length) return {added:0,updated:0,removed:0};
  let added=0,updated=0,removed=0,cursor=syncCfg().orderCursor||'';
  rows.forEach(r=>{
    if(r.updated_at>cursor) cursor=r.updated_at;
    let i=orders.findIndex(o=>o._cid===r.id);
    if(i<0) i=orders.findIndex(o=>String(o.no)===String(r.order_no));
    if(r.deleted){ if(i>=0){ orders.splice(i,1); removed++; } return; }
    const rec={no:r.order_no, customer:r.customer||'', product:r.product||'',
               supplier:r.supplier||'', destination:r.destination||'',
               transporter:r.transporter||'',
               targetKg:r.tons_target?Math.round(Number(r.tons_target)*1000):null,
               fleet:Array.isArray(r.fleet_regs)?r.fleet_regs:[]};
    if(i>=0){
      const o=orders[i];
      if(o._at && r.updated_at && new Date(o._at) > new Date(r.updated_at)){ o._cid=r.id; return; }
      // loadedKg is the site's own tally and is never overwritten from the office
      Object.keys(rec).forEach(k=>{ o[k]=rec[k]; });
      o.active=r.active!==false; o._cid=r.id; o._cat=r.updated_at; o._at=r.updated_at;
      updated++;
    }else{
      orders.unshift(Object.assign({id:r.local_id||('O'+Date.now()+Math.floor(Math.random()*99)),
        created:r.created_at||nowISO(),_cid:r.id,_cat:r.updated_at,_at:r.updated_at,
        rate:null,active:r.active!==false}, rec));
      added++;
    }
  });
  syncSet('orderCursor',cursor);
  if(added||updated||removed) saveOrders();
  return {added,updated,removed};
}

/* ── PUSH ────────────────────────────────────────────────────────────────
   Only records changed since they were last sent. Upsert on (site, reg) so
   a truck the clerk added and the client also added becomes one row. */
async function syncPushFleet(){
  const site=siteCode();
  const due=fleet.filter(f=>f.reg && (!f._cat || (f._at && new Date(f._at)>new Date(f._cat))));
  if(!due.length) return 0;
  const body=due.map(f=>({site, reg:String(f.reg).trim(), local_id:f.id,
    trailer1:f.trailer1||null, trailer2:f.trailer2||null, driver:f.driver||null,
    transporter:f.transporter||null,
    tare:(f.tare===''||f.tare==null)?null:Number(f.tare), active:true, deleted:false}));
  for(let i=0;i<body.length;i+=100){
    await _sbReq('fleet?on_conflict=site,reg',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(body.slice(i,i+100))});
  }
  const at=nowISO();
  due.forEach(f=>{ f._cat=at; });
  saveFleet();
  return due.length;
}
async function syncPushOrders(){
  const site=siteCode();
  const due=orders.filter(o=>o.no && (!o._cat || (o._at && new Date(o._at)>new Date(o._cat))));
  if(!due.length) return 0;
  const body=due.map(o=>({site, order_no:String(o.no), local_id:o.id,
    customer:o.customer||null, product:o.product||null, supplier:o.supplier||null,
    destination:o.destination||null, transporter:o.transporter||null,
    tons_target:o.targetKg?Number(o.targetKg)/1000:null,
    fleet_regs:Array.isArray(o.fleet)&&o.fleet.length?o.fleet:null,
    active:o.active!==false, deleted:false}));
  for(let i=0;i<body.length;i+=100){
    await _sbReq('orders?on_conflict=site,order_no',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(body.slice(i,i+100))});
  }
  const at=nowISO();
  due.forEach(o=>{ o._cat=at; });
  saveOrders();
  return due.length;
}

let _syncBusy=false;
async function syncRun(manual){
  if(_syncBusy) return;
  if(!manual){
    if(!syncCfg().on || !syncIsHost()) return;      // only the host PC, only when on
    if(!cloudUrl()||!cloudCfg().key||!cloudCfg().email) return;
  }
  _syncBusy=true;
  if(manual) renderCloud();
  try{
    // Pull first: the cloud is where the client's additions live, and pushing
    // first would send a stale local copy over a newer remote row.
    const f=await syncPullFleet();
    const o=await syncPullOrders();
    const pf=await syncPushFleet();
    const po=await syncPushOrders();
    const bits=[];
    if(f.added||f.updated||f.removed) bits.push(`fleet in ${f.added}+/${f.updated}~/${f.removed}-`);
    if(o.added||o.updated||o.removed) bits.push(`orders in ${o.added}+/${o.updated}~/${o.removed}-`);
    if(pf) bits.push(pf+' trucks up');
    if(po) bits.push(po+' orders up');
    syncSet('lastAt',nowISO());
    syncSet('lastMsg', bits.length?bits.join(' · '):'up to date');
    if(f.added||f.updated||f.removed||o.added||o.updated||o.removed){
      if(currentTab==='fleet') renderFleet();
      if(currentTab==='orders') renderOrdersTab();
    }
    if(manual) toast('Sync complete — '+(bits.join(' · ')||'nothing to do'),'success',5000);
  }catch(e){
    const m=String(e.message||e);
    syncSet('lastAt',nowISO());
    syncSet('lastMsg','failed — '+m.slice(0,120));
    if(/403/.test(m))      syncSet('lastMsg','failed — this login may read but not write. Run 06_fleet_orders_remote_write.sql');
    else if(/42883|does not exist|404/.test(m)) syncSet('lastMsg','failed — the tables or RPCs are missing. Run 05_orders_fleet.sql then 06_fleet_orders_remote_write.sql');
    if(manual) toast('Sync failed: '+m.slice(0,90),'error',7000);
  }
  _syncBusy=false;

async function cloudSignIn(email, pass){
  const c=cloudCfg();
  if(!cloudUrl()||!c.key) throw new Error('Enter the project URL and publishable key first');
  const r=await fetch(cloudUrl()+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{'apikey':c.key,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pass})
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||('sign-in failed ('+r.status+')'));
  _cloudTok=j.access_token;
  return j;
}
/* Call one of the iss_* functions. */
async function cloudRpc(fn, args){
  const c=cloudCfg();
  const r=await fetch(cloudUrl()+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'apikey':c.key,'Authorization':'Bearer '+(_cloudTok||c.key),'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  });
  const txt=await r.text();
  let j=null; try{ j=JSON.parse(txt); }catch(e){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint))||txt.slice(0,200)||('HTTP '+r.status));
  return j;
}

async function cloudTest(){
  if(_cloudBusy) return; _cloudBusy=true; cloudSay('Connecting…','');
  try{
    const c=cloudCfg();
    if(!cloudUrl()) throw new Error('Project URL is empty');
    if(!c.email||!c.pass) throw new Error('Enter the login for this PC');
    await cloudSignIn(c.email,c.pass);
    const mine=await cloudRpc('iss_my_sites');
    const sites=(mine&&mine.sites)||[];
    const here=siteCode();
    if(mine&&mine.note){ cloudSay('Signed in ✓ — but the backend is not set up yet. Use Backend setup below.','warn'); }
    else if(sites.includes(here)) cloudSay('Signed in ✓ — this PC is registered for "'+here+'".','ok');
    else if(!sites.length) cloudSay('Signed in ✓ — but this login is not registered for any site. Register it under Backend setup.','warn');
    else cloudSay('Signed in ✓ — but this login covers ['+sites.join(', ')+'], and the Site Code here is "'+here+'". They must match.','warn');
    if(mine&&mine.admin) { try{ _cloudStatus=await cloudRpc('iss_status'); }catch(e){} }
  }catch(e){ _cloudTok=null; cloudSay('✗ '+e.message,'bad'); }
  _cloudBusy=false; renderCloud();
}

async function cloudCheck(){
  if(_cloudBusy) return; _cloudBusy=true; cloudSay('Reading the backend…','');
  try{
    const c=cloudCfg();
    await cloudSignIn(c.email,c.pass);
    _cloudStatus=await cloudRpc('iss_status');
    if(_cloudStatus&&_cloudStatus.error) throw new Error(_cloudStatus.error+' — this login is not an ISS admin');
    cloudSay('Backend read ✓','ok');
  }catch(e){ cloudSay('✗ '+e.message,'bad'); }
  _cloudBusy=false; renderCloud();
}

async function cloudProvision(){
  const existing=document.getElementById('cl-existing')?.value.trim()||'';
  if(!confirm('Set up or repair the backend now?\n\n'+
    'This adds columns, indexes and access rules. It never deletes a ticket.\n'+
    'The readings table is left alone, so the ESP32 gateways keep posting.\n'+
    (existing?('Tickets already up there will be tagged as: '+existing):
              'Rows already up there will NOT be tagged — fill in the site code box first if there are any.'))) return;
  if(_cloudBusy) return; _cloudBusy=true; cloudSay('Setting up…','');
  try{
    const c=cloudCfg();
    await cloudSignIn(c.email,c.pass);
    const r=await cloudRpc('iss_provision',{p_existing_site:existing||null,p_lock_readings:false});
    if(!r||!r.ok) throw new Error((r&&r.error)||'provision failed');
    _cloudStatus=await cloudRpc('iss_status');
    const acts=(r.actions||[]).join('\n• ');
    cloudSay('Backend ready ✓\n• '+acts,'ok');
    auditLog('config','cloud','','Backend provisioned: '+(r.actions||[]).length+' actions');
  }catch(e){ cloudSay('✗ '+e.message,'bad'); }
  _cloudBusy=false; renderCloud();
}

async function cloudRegister(){
  const email=(document.getElementById('cl-regmail')?.value||'').trim();
  const site=(document.getElementById('cl-regsite')?.value||'').trim().toLowerCase();
  if(!email||!site){ toast('Enter the login email and the site code','error'); return; }
  if(_cloudBusy) return; _cloudBusy=true; cloudSay('Registering…','');
  try{
    const c=cloudCfg();
    await cloudSignIn(c.email,c.pass);
    const r=await cloudRpc('iss_register_site',{p_email:email,p_site:site});
    if(!r||!r.ok) throw new Error((r&&r.error)||'could not register');
    cloudSay(email+' may now use "'+site+'" ✓','ok');
    auditLog('config','cloud','',email+' registered for site '+site);
  }catch(e){ cloudSay('✗ '+e.message,'bad'); }
  _cloudBusy=false; renderCloud();
}

// Pull a transaction array out of ANY backup shape we've ever shipped:
//  - {_iss:'weighbridge-backup', iss8_txs:[...]}
//  - {txs:[...]} (older backupAll format)
//  - a bare [ ... ] array of transactions
//  - nested under data/db/state
function extractLegacyTxs(pack){
  if(!pack) return [];
  if(Array.isArray(pack)) return pack.filter(looksLikeTx);
  const buckets=[];
  ['iss8_txs','txs','transactions','records','iss7_txs','iss_txs'].forEach(k=>{
    if(Array.isArray(pack[k])) buckets.push(...pack[k]);
  });
  ['data','db','state','store','backup'].forEach(k=>{
    if(pack[k]&&typeof pack[k]==='object') buckets.push(...extractLegacyTxs(pack[k]));
  });
  return buckets.filter(looksLikeTx);
}
function looksLikeTx(t){
  return t && typeof t==='object' &&
    (t.id||t.ticket||t.ticketNo) &&
    (t.vehicleReg||t.reg||t.registration||t.vehicle);
}
// Normalise an old ticket into the shape reprint/records expect
function normaliseLegacyTx(t){
  const n=Object.assign({},t);
  n.id          = n.id || n.ticket || n.ticketNo;
  n.vehicleReg  = n.vehicleReg || n.reg || n.registration || n.vehicle || '';
  n.completedAt = n.completedAt || n.date || n.timestamp || n.time || nowISO();
  n.firstWeight = num(n.firstWeight!=null?n.firstWeight:n.first);
  n.secondWeight= num(n.secondWeight!=null?n.secondWeight:n.second);
  if(n.net==null && isFinite(n.firstWeight) && isFinite(n.secondWeight))
    n.net=Math.abs(n.firstWeight-n.secondWeight);
  n.net=num(n.net);
  n.bridgeName  = n.bridgeName || n.bridge || 'Bridge 1';
  n.operatorName= n.operatorName || n.operator || n.clerk || '';
  n._imported   = true;
  return n;
}
function num(v){ const x=parseFloat(v); return isFinite(x)?x:0; }

// Import specifically to RECOVER OLD TICKETS. Never deletes; merges by id.
function importLegacyTickets(el){
  const f=el.files&&el.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let pack=null;
    try{ pack=JSON.parse(r.result); }catch(e){ toast('That file is not valid JSON','error'); return; }
    const found=extractLegacyTxs(pack).map(normaliseLegacyTx);
    if(!found.length){ toast('No recognisable tickets found in that file','error',6000); return; }
    const have=new Set(txs.map(t=>String(t.id)));
    const add=found.filter(t=>!have.has(String(t.id)));
    if(!add.length){ toast('All '+found.length+' ticket(s) are already in Records','info',5000); el.value=''; return; }
    if(!confirm('Found '+found.length+' ticket(s) in the file.\n\n'+add.length+' are new and will be ADDED to Records.\nNothing already saved is deleted.\n\nImport now?')){ el.value=''; return; }
    txs=txs.concat(add);
    txs.sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));
    saveTxs();
    // keep the ticket counter ahead of any imported sequential numbers
    try{
      let mx=parseInt(G(K.seq,0))||0;
      add.forEach(t=>{ const m=String(t.id).match(/(\d+)\s*$/); if(m){ const v=parseInt(m[1]); if(v>mx) mx=v; } });
      P(K.seq,mx);
    }catch(e){}
    if(cfg.syncFolder) add.forEach(t=>sharePut('txs',t.id,t));
    auditLog('import','tx','','Recovered '+add.length+' ticket(s) from a backup file');
    toast('Recovered '+add.length+' ticket(s) ✓ — reloading…','success',3500);
    el.value='';
    setTimeout(()=>{ if(currentTab==='records') renderRecords(); else renderTab('records'); },800);
  };
  r.readAsText(f);
}

function importBackupFile(el){
  const f=el.files&&el.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let pack=null;
    try{ pack=JSON.parse(r.result); }catch(e){ toast('That file is not a valid backup','error'); return; }
    if(!pack||pack._iss!=='weighbridge-backup'){ toast('That file is not a Weighbridge backup','error'); return; }
    const inTx=(pack['iss8_txs']||[]).length;
    if(!confirm('Import this backup?\n\n'+inTx+' transaction(s) in the file.\n\nRecords are MERGED — nothing already saved is deleted.')) return;
    // merge transactions by id — never drop existing ones
    try{
      const have=G(K.txs,[]);
      const seen=new Set(have.map(t=>t.id));
      const merged=have.concat((pack['iss8_txs']||[]).filter(t=>t&&t.id&&!seen.has(t.id)));
      pack['iss8_txs']=merged;
    }catch(e){}
    _ALLKEYS.forEach(k=>{ if(pack[k]!==undefined){ try{ localStorage.setItem(k,JSON.stringify(pack[k])); }catch(e){} } });
    toast('Backup imported — reloading…','success',3000);
    setTimeout(()=>location.reload(),900);
  };
  r.readAsText(f);
  el.value='';
}

function confirmNextTicketNo(){
  const el=document.getElementById('snt-v');
  const n=parseInt(String(el?.value||'').replace(/[^0-9]/g,''));
  if(!isFinite(n)||n<1){ toast('Enter a number of 1 or more','error'); el?.focus(); return; }
  // Never allow a number that would collide with an existing ticket
  if(txs.some(t=>t.id===fmtTicketNo(n))){
    toast('Ticket '+fmtTicketNo(n)+' already exists — pick a different number','error',6000); return;
  }
  P(K.seq,n-1);
  // Mark this as a deliberate reset so it beats the shared high-water mark on
  // the other PC (otherwise an inflated shared counter would pull it back up).
  cfg._seqResetAt=nowISO(); cfg._ticketAt=nowISO(); saveCfg();
  _ticketPushedSig=null;                 // force a re-push of the ticket config
  auditLog('config','settings','','Next ticket number set to '+fmtTicketNo(n));
  closeModal(); renderSettings();
  toast('Next ticket: '+fmtTicketNo(n),'success');
}

  const el=document.getElementById('cf-new');
  const label=(el?.value||'').trim();
  if(!label){toast('Enter a field name first','error');return;}

/* ══════════════════════════════════════════════════════════════════════
   REQUEST COMMAND — presets + free text
   The preset list only covers common indicators. Anything else (a 920i
   aux format needing "K2<CR><LF>KPRINT<CR><LF>", a chained XG poll, a
   vendor-specific string) goes in the custom box. Tokens understood:
   <CR> <LF> <ENQ> <STX> <ETX> <EOT> and \xNN for any raw byte.
   ══════════════════════════════════════════════════════════════════════ */
const POLL_PRESETS=[
  {v:'',                 l:'None — indicator streams on its own'},
  {v:'<CR><LF>',         l:'CR LF'},
  {v:'P<CR><LF>',        l:'P + CR LF (print)'},
  {v:'W<CR><LF>',        l:'W + CR LF (weight)'},
  {v:'<ENQ>',            l:'ENQ (0x05)'},
  {v:'<STX>',            l:'STX (0x02)'},
  {v:'RM<CR><LF>',       l:'RM + CR LF'},
  {v:'SI<CR><LF>',       l:'SI + CR LF (Toledo)'},
  {v:'KPRINT<CR><LF>',   l:'KPRINT + CR LF (Rice Lake 920i)'},
  {v:'XG#1<CR><LF>',     l:'XG#1 + CR LF (920i gross, scale 1)'}
];
function pollIsCustom(bc){
  const pc=(bc&&bc.pollCmd)||'';
  if(bc&&bc.pollCustom) return true;
  return !!pc && !POLL_PRESETS.some(p=>p.v===pc);
}
function setPollPreset(bi,v){
  const bc=cfg.bridges[bi]||(cfg.bridges[bi]={});
  if(v==='__custom__'){ bc.pollCustom=true; bc.pollCmd=bc.pollCmdText||''; }
  else { bc.pollCustom=false; bc.pollCmd=v; }
  saveCfg(); renderSettings();
}
function setPollCustom(bi,v){
  const bc=cfg.bridges[bi]||(cfg.bridges[bi]={});
  bc.pollCustom=true; bc.pollCmdText=v; bc.pollCmd=v; saveCfg();
  const pv=document.getElementById('pollprev'+bi);
  if(pv) pv.innerHTML=pollPreviewHTML(v);
}
/* Show the operator the actual bytes — the fastest way to spot a typo
   like <RC> instead of <CR>, which otherwise just looks like silence. */
function pollPreviewHTML(s){
  if(!s) return '<span style="color:var(--text3)">nothing will be sent</span>';
  const un=String(s)
    .replace(/<CR>/gi,'\r').replace(/<LF>/gi,'\n').replace(/<ENQ>/gi,'\x05')
    .replace(/<STX>/gi,'\x02').replace(/<ETX>/gi,'\x03').replace(/<EOT>/gi,'\x04')
    .replace(/\\r/g,'\r').replace(/\\n/g,'\n').replace(/\\t/g,'\t')
    .replace(/\\x([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
  const hex=[...un].map(ch=>ch.charCodeAt(0).toString(16).padStart(2,'0')).join(' ');
  return 'Sends '+un.length+' byte'+(un.length===1?'':'s')+': <span style="font-family:monospace;color:var(--blue)">'+esc(hex)+'</span>';
}
function pollFieldHTML(bi,bc,label){
  const custom=pollIsCustom(bc), pc=(bc&&bc.pollCmd)||'';
  const txt=custom?((bc&&bc.pollCmdText)||pc):((bc&&bc.pollCmdText)||'');
  return '<div class="field"><label>'+(label||'Request Command (if it reads only once)')+'</label>'+
    '<select id="s-b'+bi+'poll" onchange="setPollPreset('+bi+',this.value)">'+
      POLL_PRESETS.map(p=>'<option value="'+esc(p.v)+'"'+((!custom&&pc===p.v)?' selected':'')+'>'+esc(p.l)+'</option>').join('')+
      '<option value="__custom__"'+(custom?' selected':'')+'>Custom — type my own command…</option>'+
    '</select>'+
    '<div id="pollcustom'+bi+'" style="margin-top:6px;'+(custom?'':'display:none')+'">'+
      '<input id="s-b'+bi+'pollx" value="'+esc(txt)+'" placeholder="e.g. K2&lt;CR&gt;&lt;LF&gt;KPRINT&lt;CR&gt;&lt;LF&gt;" '+
        'style="font-family:monospace" oninput="setPollCustom('+bi+',this.value)"/>'+
      '<div id="pollprev'+bi+'" style="font-size:11px;color:var(--text3);margin-top:3px">'+pollPreviewHTML(txt)+'</div>'+
      '<div style="font-size:11px;color:var(--text3);margin-top:3px;line-height:1.5">'+
        'Tokens: <b>&lt;CR&gt; &lt;LF&gt; &lt;ENQ&gt; &lt;STX&gt; &lt;ETX&gt; &lt;EOT&gt;</b> and <b>\\xNN</b> for any raw byte. '+
        'Several commands can be chained — they go out as one write.</div>'+
    '</div></div>';
}

function buildTicketPreviewHTML(tx){

  // simplest path — call a shared builder. We replicate the body here

  let captured='';

async function clearAll(){
  if(!confirm('Delete ALL transactions?\n\nThis clears every stored copy: local storage, the crash-recovery database, and the disk mirror.'))return;
  if(!confirm('This cannot be undone. Confirm?'))return;
  if(cfg.syncFolder){
    if(!confirm('WARNING: a shared sync folder is still set.\n\nThe app will pull those records straight back in.\n\nClear the sync folder first (Settings → Multi-PC Sync) then try again.\n\nContinue anyway?')) return;
  }
  txs=[]; pending=[];
  saveTxs(); savePend();
  // Wipe the IndexedDB copy too. Without this, the startup power-cut recovery
  // sees IndexedDB holding more records than local storage and restores them,
  // which made "Delete ALL" appear to do nothing.
  try{ await idbClear('txs'); await idbClear('meta'); }catch(e){}
  auditLog('config','settings','','Deleted ALL transactions (all storage layers)');
  toast('All data cleared — local, recovery database and disk','info',6000);
  renderSettings();
}

      </button>
    </div>`).join('');
  openModal('🔍 WeighBox Devices Found',
    `<p style="font-size:12px;color:var(--text3);margin-bottom:14px">${found.length} box${found.length!==1?'es':''} on this network:</p>${rows}
     <button class="btn btn-ghost" style="width:100%;margin-top:4px" onclick="closeModal()">Cancel</button>`);
}

function startApp(){

  document.getElementById('hdr-logo-wrap').innerHTML=issLogo(true,62);
  applyBranding();renderBridgePills();
  applyStoredBrand();
  buildTabs();
  renderTab('dashboard');
  startSim(0);startSim(1);
  updateWBCount();
  // SERIAL: prefer native (EXE) — main process holds the port open.
  // The native layer auto-opens saved ports itself; we just bind events.
  initNativeSerial().then(native=>{
    if(native){
      // native main process already auto-opens saved ports on launch.
      // Reflect any already-open ports in the UI.
      if(window.issDesktop.serialSaved) window.issDesktop.serialSaved().then(saved=>{
        Object.keys(saved||{}).forEach(bi=>{ cfg.bridges[bi] && (cfg.bridges[bi].paired=true); });
      });
    }else{
      // Browser/PWA fallback: Web Serial silent reopen + watchdog
      setTimeout(()=>{ autoOpenSavedPorts(); startSerialWatchdog(); }, 600);
      if('serial' in navigator && !_serialEvtBound){
        _serialEvtBound=true;
        navigator.serial.addEventListener('connect', ()=>{ setTimeout(autoOpenSavedPorts,300); });
        navigator.serial.addEventListener('disconnect', (e)=>{
          for(let bi=0;bi<bState.length;bi++){
            if(bState[bi].serial===e.target){ bState[bi].state='disconnected'; bState[bi].serial=null; startSim(bi); }
          }
        });
      }
    }
  });
  // Auto-connect to WeighBox if loaded from one, or if URLs saved
  setTimeout(autoConnectBox, 800);
  // Start desktop sync poll if configured
  if(window.issDesktop && cfg.syncFolder) syncPoll();
  // Open IndexedDB, recover any data lost in power cut, restore backup folder
  openIDB().then(async()=>{
    await recoverData();
    await restoreBackupHandle();
    updateBackupFolderStatus();
    checkStorageStatus();
    updateSavedBadge(!!(_backupDir||window.issDesktop));
    if(currentTab==='dashboard') renderDash();
    if(currentTab==='records') renderRecords();
  });
  // Service Worker
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// Desktop multi-PC sync poll (Electron only)
let syncPollTimer = null;
// ══════════════════════════════════════════════════════════
// SHARED DATABASE — one folder, both weighbridges.
//
// RULES (never broken):
//  • Sync only ADDS. It never deletes a record.
//  • A record disappears only when a dashboard explicitly deletes it,
//    which writes a tombstone {_deleted:true} that the other side honours.
//  • If either PC ever comes up empty, the share rebuilds it completely.
//  • Both PCs write their own copy of every record, so either folder alone
//    is a complete database.
// ══════════════════════════════════════════════════════════
let _shareOK=false, _shareBusy=false;
const _pendKey=p=>String(p.vehicleReg||'')+'@'+String(p.bridge==null?0:p.bridge);
const _uKey=u=>String(u.id||u.name||'');

async function sharePut(kind,id,obj){
  if(!window.issDesktop||!window.issDesktop.sharedPut||!cfg.syncFolder) return;
  try{ await window.issDesktop.sharedPut(kind,id,obj); }catch(e){}
}
// Explicit delete from a dashboard -> tombstone the other side will honour
async function shareDel(kind,id){
  if(!window.issDesktop||!window.issDesktop.sharedPut||!cfg.syncFolder) return;
  try{ await window.issDesktop.sharedPut(kind,id,{id,_deleted:true,_at:nowISO()}); }catch(e){}
}
async function shareList(kind){
  if(!window.issDesktop||!window.issDesktop.sharedList||!cfg.syncFolder) return [];
  try{ const r=await window.issDesktop.sharedList(kind); return (r&&r.items)||[]; }catch(e){ return []; }
}

// Push everything this PC knows to the share.
// Cache of what we last wrote to the share, keyed by "kind/id" -> content string.
// Without this, sharePushAll rewrote EVERY record every 10 seconds on BOTH PCs,
// so Syncthing saw both sides modifying the same files and produced a
// .sync-conflict copy for every ticket. Now an unchanged record is never
// rewritten, so the folder goes quiet once both PCs agree.
const _pushCache=new Map();
async function _pushIfChanged(kind,id,obj){
  if(id===undefined||id===null||id==='') return;
  const key=kind+'/'+id;
  let body;
  try{ body=JSON.stringify(obj); }catch(e){ return; }
  if(_pushCache.get(key)===body) return;      // unchanged — do not touch the file
  await sharePut(kind,id,obj);
  _pushCache.set(key,body);
}
async function sharePushAll(){
  if(!cfg.syncFolder||!window.issDesktop) return;
  for(const t of txs)      await _pushIfChanged('txs',    t.id, t);
  for(const pd of pending) await _pushIfChanged('pend',   _pendKey(pd), pd);
  for(const o of orders)   await _pushIfChanged('orders', o.id, o);
  for(const fv of fleet)   await _pushIfChanged('fleet',  fv.id, fv);
  for(const u of users)    await _pushIfChanged('users',  _uKey(u), u);
  try{
    // Only (re)write the shared fields doc when the definitions actually
    // changed. Previously this ran every push with a fresh _at timestamp, so
    // two PCs endlessly leapfrogged each other's timestamp — each pull saw a
    // "newer" fields doc, overwrote cfg.customFields, and re-rendered the Weigh
    // screen mid-typing (clearing the boxes). We keep a stable signature of the
    // last-written definitions and skip the write when nothing changed.
    const sig=JSON.stringify(cfg.customFields||[]);
    if(sig!==_fieldsPushedSig){
      const at=cfg._fieldsAt||nowISO();
      await window.issDesktop.sharedPutDoc('fields',{customFields:cfg.customFields||[], _at:at});
      _fieldsPushedSig=sig;
    }
  }catch(e){}
  // ── ticket numbering: share prefix/padding + the counter. Both PCs write the
  //    SAME doc, so before pushing we check whether the share already holds a
  //    NEWER deliberate reset. If it does we adopt it instead of overwriting —
  //    otherwise a PC with a stale high counter would clobber the reset and
  //    drag the other PC back up.
  try{
    let shared=null;
    try{ shared=await window.issDesktop.sharedDoc('ticketcfg'); }catch(e){}
    const myReset=cfg._seqResetAt||'';
    const theirReset=(shared&&shared.resetAt)||'';
    if(theirReset && (!myReset || new Date(theirReset)>new Date(myReset))){
      // The share has a newer reset than us — take it, don't push over it.
      const theirs=parseInt(shared.seq)||0;
      if(theirs!==(parseInt(G(K.seq,0))||0)) P(K.seq,theirs);
      cfg._seqResetAt=theirReset; saveCfg();
      _ticketPushedSig=null;
      if(window._dbg) window._dbg('ticket: adopted reset from share → next '+fmtTicketNo(theirs+1),'#79d0ff');
    } else {
      const seq=parseInt(G(K.seq,0))||0;
      const tk={prefix:(cfg.ticketPrefix!==undefined?cfg.ticketPrefix:'WB'),
                pad:Math.max(1,Math.min(8,parseInt(cfg.ticketPad)||3)),
                seq, resetAt:myReset, _at:(cfg._ticketAt||nowISO())};
      const sig=JSON.stringify([tk.prefix,tk.pad,tk.seq,tk.resetAt]);
      if(sig!==_ticketPushedSig){
        await window.issDesktop.sharedPutDoc('ticketcfg',tk);
        _ticketPushedSig=sig;
      }
    }
  }catch(e){}
}
let _fieldsPushedSig=null;
let _ticketPushedSig=null;

// Pull the share and merge in. Additive only.
async function sharePull(){
  if(!cfg.syncFolder||!window.issDesktop) return 0;
  let changed=0;
  const _brk={txs:0,pend:0,orders:0,users:0,fleet:0,fields:0,ticket:0};

  // ── transactions: add anything we don't have; honour tombstones ──
  const rTx=await shareList('txs');
  if(rTx.length){
    const have=new Map(txs.map(t=>[String(t.id),t]));
    const dead=new Set(rTx.filter(t=>t._deleted).map(t=>String(t.id)));
    // Fingerprints of clashes we've ALREADY reconciled, so we never re-number
    // the same incoming record twice (that caused an endless-renumber loop).
    const reconciled=new Set(G('iss8_reconciled',[])||[]);
    const fp=t=>[t.vehicleReg,t.firstWeightTime,t.firstWeight,t.secondWeight].join('|');
    // Also treat a record we already hold (by fingerprint) as "have it", even if
    // its id differs — prevents re-importing an already-reconciled clash.
    const haveFP=new Set(txs.map(fp));
    let collisions=0, newReconciled=false;
    rTx.forEach(t=>{
      if(t._deleted||!t.id) return;
      const id=String(t.id);
      const f=fp(t);
      if(reconciled.has(f)) return;        // already handled this exact record — skip
      if(haveFP.has(f)) return;            // we already hold this transaction (any id) — skip
      const mine=have.get(id);
      if(!mine){ txs.push(t); have.set(id,t); haveFP.add(f); changed++; return; }
      if(_sameTx(mine,t)){ haveFP.add(f); return; }  // same record — nothing to do
      // Genuine clash: keep BOTH. Re-number the incoming one ONCE, remember its
      // fingerprint so it's never re-processed, and do NOT push it back to the
      // share (pushing re-created the clash and looped).
      const newId=_nextFreeTicket(have);
      const moved={...t, id:newId, _collisionFrom:id, notes:((t.notes?t.notes+' · ':'')+'Auto-renumbered from '+id+' (ticket clash on sync)')};
      txs.push(moved); have.set(newId,moved); haveFP.add(f);
      reconciled.add(f); newReconciled=true;
      changed++; collisions++;
      auditLog('sync','tx',newId,'Ticket clash: incoming '+id+' re-numbered to '+newId+' (kept alongside '+mine.vehicleReg+')');
    });
    if(newReconciled){ try{ P('iss8_reconciled', [...reconciled].slice(-500)); }catch(e){} }
    if(dead.size){ const b=txs.length; txs=txs.filter(t=>!dead.has(String(t.id))); changed+=b-txs.length; }
    if(changed){ txs.sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt)); saveTxs(); }
    _brk.txs=changed;
    if(collisions){
      toast('⚠ '+collisions+' ticket-number clash'+(collisions>1?'es':'')+' reconciled — nothing lost. Check Records.','info',7000);
      if(window._dbg) window._dbg('TICKET CLASH x'+collisions+' reconciled (one-time)','#ffb84d');
    }
  }

  // ── trucks on site: union, tombstones remove ──
  const rPd=await shareList('pend');
  if(rPd.length){
    const have=new Set(pending.map(_pendKey));
    const dead=new Set(rPd.filter(x=>x._deleted).map(x=>String(x.id)));
    let c=0;
    rPd.forEach(x=>{ if(!x._deleted && x.vehicleReg && !have.has(_pendKey(x))){ pending.push(x); c++; } });
    const b=pending.length;
    pending=pending.filter(x=>!dead.has(_pendKey(x)));
    c+=b-pending.length;
    if(c){ savePend(); changed+=c; _brk.pend=c; }
  }

  // ── allocations / orders: newest wins, tombstones remove ──
  const rOr=await shareList('orders');
  if(rOr.length){
    let c=0;
    rOr.forEach(o=>{
      if(!o.id) return;
      const i=orders.findIndex(x=>String(x.id)===String(o.id));
      if(o._deleted){ if(i>=0){ orders.splice(i,1); c++; } return; }
      if(i<0){ orders.push(o); c++; }
      else if(o._at && (!orders[i]._at || new Date(o._at)>new Date(orders[i]._at))){
        // Only apply if the record content actually differs — otherwise a
        // newer-but-identical timestamp causes an endless pull/push loop.
        if(_recDiff(orders[i],o)){ orders[i]=o; c++; }
        else { orders[i]._at=o._at; }   // adopt timestamp silently, no churn
      }
    });
    if(c){ saveOrders(); changed+=c; _brk.orders=c; }
  }

  // ── users: newest wins, tombstones remove ──
  const rUs=await shareList('users');
  if(rUs.length){
    let c=0;
    rUs.forEach(u=>{
      const k=String(u.id||u.name||'');
      if(!k) return;
      const i=users.findIndex(x=>_uKey(x)===k);
      if(u._deleted){ if(i>=0){ users.splice(i,1); c++; } return; }
      if(i<0){ users.push(u); c++; }
      else if(u._at && (!users[i]._at || new Date(u._at)>new Date(users[i]._at))){
        if(_recDiff(users[i],u)){ users[i]=u; c++; }
        else { users[i]._at=u._at; }
      }
    });
    if(c){ saveUsers(); changed+=c; _brk.users=c; }
  }

  // ── fleet list: newest wins, tombstones remove ──
  const rFl=await shareList('fleet');
  if(rFl.length){
    let c=0;
    rFl.forEach(fv=>{
      if(!fv.id) return;
      const i=fleet.findIndex(x=>String(x.id)===String(fv.id));
      if(fv._deleted){ if(i>=0){ fleet.splice(i,1); c++; } return; }
      if(i<0){ fleet.push(fv); c++; }
      else if(fv._at && (!fleet[i]._at || new Date(fv._at)>new Date(fleet[i]._at))){
        if(_recDiff(fleet[i],fv)){ fleet[i]=fv; c++; }
        else { fleet[i]._at=fv._at; }
      }
    });
    if(c){ P(K.fleet,fleet); changed+=c; _brk.fleet=c; }
  }

  // ── custom fields: newest definition wins ──
  try{
    const doc=await window.issDesktop.sharedDoc('fields');
    if(doc&&doc.customFields){
      const mine=JSON.stringify(cfg.customFields||[]);
      if(JSON.stringify(doc.customFields)!==mine &&
         (!cfg._fieldsAt || (doc._at && new Date(doc._at)>new Date(cfg._fieldsAt)))){
        cfg.customFields=doc.customFields; cfg._fieldsAt=doc._at; saveCfg(); changed++; _brk.fields=1;
      }
    }
  }catch(e){}

  // ── ticket numbering: adopt newest prefix/padding, and pull the sequence
  //    counter FORWARD to the highest number either PC has issued. Never moves
  //    backward, so tickets stay unique and monotonic across both machines.
  try{
    const tk=await window.issDesktop.sharedDoc('ticketcfg');
    if(tk){
      // prefix / padding: newest definition wins
      if(tk._at && (!cfg._ticketAt || new Date(tk._at)>new Date(cfg._ticketAt))){
        const np=String(tk.prefix!=null?tk.prefix:'WB');
        const nd=Math.max(1,Math.min(8,parseInt(tk.pad)||3));
        if(np!==cfg.ticketPrefix || nd!==(parseInt(cfg.ticketPad)||3)){
          cfg.ticketPrefix=np; cfg.ticketPad=nd; changed++;
        }
        cfg._ticketAt=tk._at; saveCfg();
      }
      // Sequence: normally a high-water mark (only ever forward, so numbers are
      // never reused). BUT if the other PC deliberately RESET the counter (via
      // Settings → next ticket number), adopt that exact value even if it's
      // lower — otherwise an inflated counter could never be corrected.
      const theirs=parseInt(tk.seq)||0;
      const mine=parseInt(G(K.seq,0))||0;
      const theirReset=tk.resetAt||'';
      const myReset=cfg._seqResetAt||'';
      if(theirReset && (!myReset || new Date(theirReset)>new Date(myReset))){
        if(theirs!==mine){ P(K.seq,theirs); changed++; _brk.ticket=1; }
        cfg._seqResetAt=theirReset; saveCfg();
      } else if(theirs>mine){
        P(K.seq,theirs); changed++; _brk.ticket=(theirs-mine);
      }
    }
  }catch(e){}

  if(changed && window._dbg){
    const parts=Object.entries(_brk).filter(([k,v])=>v).map(([k,v])=>k+':'+v).join(' ');
    window._dbg('sharePull merged '+changed+' → '+parts, '#79d0ff');
  }
  return changed;
}

// True when two records are the SAME transaction (not a ticket-number clash):
// same vehicle, same first-weight time, same weights. Lets a genuine re-sync of
// one record be distinguished from two different trucks sharing an id.
function _sameTx(a,b){
  if(!a||!b) return false;
  return a.vehicleReg===b.vehicleReg
      && String(a.firstWeightTime||'')===String(b.firstWeightTime||'')
      && (a.firstWeight||0)===(b.firstWeight||0)
      && (a.secondWeight||0)===(b.secondWeight||0);
}
// Next ticket number not already used in the given id-map (keeps prefix/padding).
// Also advances the shared counter so future numbers stay ahead.
function _nextFreeTicket(haveMap){
  let n=parseInt(G(K.seq,0))||0, id, guard=0;
  do{ n++; id=fmtTicketNo(n); }while(haveMap.has(String(id)) && guard++<100000);
  P(K.seq,n); cfg._ticketAt=nowISO();
  return id;
}
// Compare two records ignoring sync bookkeeping (_at/_deleted). Returns true
// only when the meaningful content differs — used to prevent a newer-but-
// identical timestamp from triggering an endless pull/push sync loop.
function _recDiff(a,b){
  const strip=o=>{ const c={...o}; delete c._at; delete c._deleted; delete c._syncedAt; return JSON.stringify(c); };
  try{ return strip(a)!==strip(b); }catch(e){ return true; }
}

// Rebuild this PC entirely from the share (used when we come up empty)
async function shareRebuild(){
  const n=await sharePull();
  if(n) auditLog('config','sync','','Rebuilt '+n+' record(s) from the shared database');
  return n;
}

// True when the operator has work in the Weigh form that a background
// re-render would destroy: a first weight captured but not completed, or any
// visible input filled in. Used to hold off sync-driven renderWeigh() calls.
function _weighFormDirty(){
  try{
    if(activeTx && (activeTx.firstWeight!=null || activeTx.vehicleReg)) return true;
    const ids=['f-reg','f-prod','f-cust','f-trans','f-sup','f-dest','f-driver','f-order','f-batchdisp'];
    if(activeDir) return true;   // operator has chosen a direction — treat as active
    for(const id of ids){ const el=document.getElementById(id); if(el && String(el.value||'').trim()) return true; }
    // any custom-field input with a value
    const cf=document.querySelectorAll('[id^="f-cf-"]');
    for(const el of cf){ if(String(el.value||'').trim()) return true; }
  }catch(e){}
  return false;
}

async function syncPoll(){
  if(!window.issDesktop) return;
  clearTimeout(syncPollTimer);
  if(!_shareBusy && cfg.syncFolder){
    _shareBusy=true;
    try{
      const st=await window.issDesktop.sharedStatus();
      _shareOK=!!(st&&st.ok);
      if(_shareOK){
        const n=await sharePull();
        await sharePushAll();
        if(n){
          if(currentTab==='dashboard') renderDash();
          if(currentTab==='records')   renderRecords();
          // Only re-render the Weigh screen from a background sync when the
          // A background sync must NEVER rebuild the Weigh form — doing so
          // wipes whatever the operator is typing (the "boxes clear" bug).
          // We update ONLY the on-site truck list in place; the form inputs
          // are left completely untouched. The live weight has its own timer.
          if(currentTab==='weigh'){
            if(window._dbg) window._dbg('sync: '+n+' change(s) → refreshOnSite (form untouched)','#7bff9f');
            refreshOnSite();
          }
          if(currentTab==='orders'&&typeof renderOrdersTab==='function') renderOrdersTab();
        }
      }
    }catch(e){ _shareOK=false; }
    _shareBusy=false;
  }
  syncPollTimer = setTimeout(syncPoll, 10000);
}

// ══════════════════════════════════════════════════════════
// DATA SAFETY — never boot to a clean state while data exists
// ══════════════════════════════════════════════════════════
const _ALLKEYS=['iss8_act','iss8_cfg','iss8_usr','iss8_db','iss8_txs','iss8_pend','iss8_ord','iss8_audit','iss8_brand','iss8_seq','iss8_fleet'];

// Pull durable state off disk (async IPC — works even if the sync preload
// snapshot was empty, which is what caused the clean-install boots).
async function readDisk(){
  try{
    if(window.issDesktop&&window.issDesktop.stateRead){
      const d=await window.issDesktop.stateRead();
      if(d&&typeof d==='object') return d;
    }
  }catch(e){}
  try{ return (window.issDesktop&&window.issDesktop.diskState)||{}; }catch(e){ return {}; }
}

// True if this browser storage looks like a fresh install
function looksClean(){
  const a=G(K.act,false), t=G(K.txs,[]), u=G(K.usr,null);
  return (!a && (!t||!t.length) && !u);
}
// True if the disk copy actually holds real data
function diskHasData(d){
  if(!d) return false;
  const t=d['iss8_txs'], u=d['iss8_usr'], c=d['iss8_cfg'];
  return !!(d['iss8_act'] || (t&&t.length) || u || c);
}

// Copy disk -> localStorage. Never destructive: only fills keys that are
// missing or empty locally, unless force=true (explicit user restore).
function applyDisk(d,force){
  let n=0;
  _ALLKEYS.forEach(k=>{
    if(d[k]===undefined) return;
    let cur=null; try{ cur=localStorage.getItem(k); }catch(e){}
    const empty=(cur===null||cur===''||cur==='null'||cur==='undefined'||cur==='[]');
    if(force||empty){ try{ localStorage.setItem(k,JSON.stringify(d[k])); n++; }catch(e){} }
  });
  return n;
}

// Push everything currently in localStorage down to disk.
async function pushAllToDisk(){
  if(!(window.issDesktop&&window.issDesktop.stateWrite)) return 0;
  let n=0;
  for(const k of _ALLKEYS){
    let cur=null; try{ cur=localStorage.getItem(k); }catch(e){}
    if(cur===null||cur===''||cur==='null'||cur==='undefined') continue;
    try{ await window.issDesktop.stateWrite(k,JSON.parse(cur)); n++; }catch(e){}
  }
  return n;
}

// Manual restore from Settings
async function manualRestore(){
  const d=await readDisk();
  if(!diskHasData(d)){ toast('No saved database found on disk','error',5000); return; }
  const t=(d['iss8_txs']||[]).length;
  if(!confirm('Restore from the on-disk database?\n\n'+t+' transaction(s) found.\n\nThis ADDS BACK anything missing. It never deletes records.')) return;
  const n=applyDisk(d,true);
  toast('Restored '+n+' data set(s) — reloading…','success',3000);
  setTimeout(()=>location.reload(),900);
}

// Manual save from Settings
async function manualSaveAll(){
  saveCfg();
  try{ P(K.usr,users); P(K.txs,txs); P(K.db,db); }catch(e){}
  const n=await pushAllToDisk();
  auditLog('config','settings','','Manual save — '+n+' data set(s) written to disk');
  toast('Saved ✓ — '+n+' data set(s) written to disk','success',4000);
}

// Boot sequence
(async function boot(){
  try{ Debug.log('ISS Weighbridge — build '+RENDERER_BUILD); }catch(e){}
  document.getElementById('act-logo').innerHTML=cvLockup(132);
  document.getElementById('login-logo').innerHTML=cvLockup(132);

  // ── GUARD: if local storage looks wiped but the disk has data, restore
  //    BEFORE showing the activation screen. This is the fix for the app
  //    occasionally booting as a clean install after a close/reopen. ──
  try{
    if(looksClean()){
      const d=await readDisk();
      if(diskHasData(d)){ applyDisk(d,true); }
    }else{
      // healthy boot — make sure the disk mirror is current
      const d=await readDisk();
      if(!diskHasData(d)) pushAllToDisk();
    }
  }catch(e){}

  // ── Last line of defence: if this PC is still empty but a shared
  //    database is configured, rebuild everything from the share. ──
  try{
    if(looksClean() && window.issDesktop && window.issDesktop.sharedList){
      const c=G(K.cfg,null);
      if(c && c.syncFolder){
        cfg=Object.assign({},DEF_CFG,c);
        const st=await window.issDesktop.sharedStatus();
        if(st&&st.ok) await shareRebuild();
      }
    }
  }catch(e){}

  try{ migrateTxKeys(); }catch(e){}

  const activated=G(K.act,false);
  if(!activated){document.getElementById('ovr-act').style.display='flex';return;}
  try{ if(cfg && cfg.debugPanel) Debug.show(true); }catch(e){}
  // Scheduled reports run off the app clock, so they start at boot and keep
  // ticking whether or not anyone is signed in — an unattended night shift
  // still gets its 06:00 report out.
  try{ cvLogoMigrate(); }catch(e){}
  // Re-check the licence every 10 minutes: a bridge left running for days
  // must still reach phase 2 without needing a restart.
  try{
    let _wasDue=licPhase2Due();
    setInterval(()=>{
      const due=licPhase2Due();
      if(due!==_wasDue){ _wasDue=due; try{ renderTab(currentTab); }catch(e){} }
    }, 10*60*1000);
  }catch(e){}
  try{ repStart(); }catch(e){ try{Debug.log('reports: '+e.message);}catch(_){} }
  try{ syncStart(); }catch(e){ try{Debug.log('fleet sync: '+e.message);}catch(_){} }
  showLogin();
})();

</script>
</body>
</html>
