// ══════════════════════════════════════════════════════════════════════════
//  AUTOMATIC REPORTING  —  e-mail + WhatsApp
//
//  Shape of it:
//    schedule  →  repDue() every 60 s  →  repBuild() makes ONE payload
//              →  job on the outbox    →  repFlush() hands it to each channel
//
//  The outbox is the important part. A weighbridge sits on a colliery LTE
//  link that drops for hours; a report that fails at 06:00 must still go out
//  when the link returns, and must not go out twice. So nothing sends
//  directly — everything is queued, retried with backoff, marked per channel,
//  and survives a restart.
//
//  ONE PC SENDS. Two bridges share a folder and both see the same
//  transactions, so both would send the same report. cfg.reports.host marks
//  the single PC that does it. Set it on the office/host PC only.
// ══════════════════════════════════════════════════════════════════════════
const REP_FREQ=[
  {id:'daily',   l:'Every day',        covers:'the previous day'},
  {id:'weekly',  l:'Every week',       covers:'the previous week (Mon–Sun)'},
  {id:'monthly', l:'Every month',      covers:'the previous month'},
  {id:'shift',   l:'Every shift',      covers:'the shift that has just ended'},
];
function repCfg(){
  if(!cfg.reports) cfg.reports={};
  const r=cfg.reports;
  if(!Array.isArray(r.schedules)) r.schedules=[];
  if(!r.smtp) r.smtp={host:'',port:587,secure:false,user:'',pass:'',from:'',fromName:''};
  if(!r.wa)   r.wa={mode:'link',phoneId:'',token:'',template:'',lang:'en',to:'',webhook:''};
  if(typeof r.host!=='boolean') r.host=false;
  return r;
}
// The outbox lives outside cfg on purpose: cfg is mirrored to the share and
// to the other bridge, and a queue must never be replicated to a second
// sender. This key stays on this PC.
let repOutbox=G(K.rep,[]);
function repSaveOutbox(){ P(K.rep,repOutbox.slice(0,200)); }

// ── shift boundaries ─────────────────────────────────────────────────────
/* A colliery runs named shifts that end at fixed clock times — 06:00 and
   18:00 on a two-shift site, 06:00 / 14:00 / 22:00 on three. The earlier
   "every N hours" mode counted blocks from the epoch, which in SAST lands on
   02:00 / 10:00 / 18:00 and never matches the shift board on the wall. These
   work off the real end times instead. An older schedule with no end times
   still works: its everyHours is spread from 06:00. */
function repShiftEnds(s){
  let list=(s&&Array.isArray(s.shiftEnds)&&s.shiftEnds.length)?s.shiftEnds.slice():null;
  if(!list){
    const hrs=Math.max(1,Math.min(24,parseInt(s&&s.everyHours)||8));
    list=[]; for(let m=360;m<360+1440;m+=hrs*60) list.push(m%1440);
  }
  const mins=list.map(v=>{
    if(typeof v==='number') return ((v%1440)+1440)%1440;
    const q=String(v).split(':');
    return ((((parseInt(q[0])||0)*60+(parseInt(q[1])||0))%1440)+1440)%1440;
  });
  const uniq=[...new Set(mins)].sort((a,b)=>a-b);
  return uniq.length?uniq:[360];
}
function _minHM(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function repShiftName(s,idx){
  const n=(s&&Array.isArray(s.shiftNames))?s.shiftNames[idx]:'';
  return String(n||'').trim();
}
/* The shift that has most recently ENDED at `now`: when it started, when it
   ended, and what it is called. */
function repShiftSlot(s,now){
  const ends=repShiftEnds(s);
  const mins=now.getHours()*60+now.getMinutes();
  let idx=-1;
  for(let i=ends.length-1;i>=0;i--){ if(mins>=ends[i]){ idx=i; break; } }
  const end=new Date(now);
  if(idx<0){ idx=ends.length-1; end.setDate(end.getDate()-1); }   // before today's first end
  end.setHours(Math.floor(ends[idx]/60),ends[idx]%60,0,0);
  const pIdx=(idx-1+ends.length)%ends.length;
  const start=new Date(end);
  if(pIdx>=idx) start.setDate(start.getDate()-1);                 // the shift crossed midnight
  start.setHours(Math.floor(ends[pIdx]/60),ends[pIdx]%60,0,0);
  return {idx,start,end,name:repShiftName(s,idx),ends};
}

// ── period maths ─────────────────────────────────────────────────────────
function _d0(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function _fmtDay(d){ return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear(); }
/* What window does this schedule cover when it fires at `at`? */
function repRange(s,at){
  const now=new Date(at);
  if(s.freq==='shift'){
    const sl=repShiftSlot(s,now);
    let from=sl.start;
    // If a shift was missed — PC off, no link — reach back to the last send so
    // those loads still get reported rather than falling down the crack.
    const ls=s.lastSentAt?new Date(s.lastSentAt):null;
    if(ls&&isFinite(ls.getTime())&&ls<from&&ls>new Date(now.getTime()-31*864e5)) from=ls;
    const nm=sl.name?sl.name+' · ':'';
    const sameDay=from.toDateString()===sl.end.toDateString();
    return {from,to:sl.end,
      label:nm+_fmtDay(from)+' '+_hm(from)+' → '+(sameDay?'':_fmtDay(sl.end)+' ')+_hm(sl.end)};
  }
  if(s.freq==='weekly'){
    const end=_d0(now); const dow=(end.getDay()+6)%7;      // Mon=0
    end.setDate(end.getDate()-dow);                        // this Monday 00:00
    const from=new Date(end); from.setDate(from.getDate()-7);
    return {from,to:end,label:'Week '+_fmtDay(from)+' – '+_fmtDay(new Date(end-1))};
  }
  if(s.freq==='monthly'){
    const end=new Date(now.getFullYear(),now.getMonth(),1,0,0,0,0);
    const from=new Date(now.getFullYear(),now.getMonth()-1,1,0,0,0,0);
    return {from,to:end,label:from.toLocaleString('en-ZA',{month:'long'})+' '+from.getFullYear()};
  }
  const to=_d0(now), from=new Date(to); from.setDate(from.getDate()-1);
  return {from,to,label:_fmtDay(from)};
}
function _hm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
/* The slot key is what stops a double send: one key per firing, stored on the
   schedule once it has been queued. A PC that was off all weekend catches up
   with exactly one report, not one per missed day. */
function repSlotKey(s,now){
  const [hh,mm]=String(s.time||'06:00').split(':').map(n=>parseInt(n)||0);
  if(s.freq==='shift'){
    const sl=repShiftSlot(s,now);
    return 'SH'+txYMD(sl.end.toISOString())+'#'+sl.idx;     // one key per shift end
  }
  const slot=new Date(now); slot.setHours(hh,mm,0,0);
  if(now<slot) return null;                                  // not yet today
  if(s.freq==='weekly'){
    const want=parseInt(s.dow); if(isFinite(want)&&now.getDay()!==want) return null;
    return 'W'+txYMD(slot.toISOString());
  }
  if(s.freq==='monthly'){
    const want=parseInt(s.dom)||1; if(now.getDate()!==want) return null;
    return 'M'+txYMD(slot.toISOString());
  }
  if(Array.isArray(s.days)&&s.days.length&&s.days.indexOf(now.getDay())<0) return null;
  return 'D'+txYMD(slot.toISOString());
}

// ── the numbers ──────────────────────────────────────────────────────────
function repStats(range,filt){
  const f=filt||{};
  const list=txs.filter(t=>{
    if(!t.completedAt) return false;
    const d=new Date(t.completedAt);
    if(!(d>=range.from&&d<range.to)) return false;
    if(f.product&&String(t.product||'')!==f.product) return false;
    if(f.customer&&String(t.customer||'')!==f.customer) return false;
    if(f.direction&&txDir(t)!==f.direction) return false;
    if(f.bridge&&String(t.bridgeName||'')!==f.bridge) return false;
    return true;
  }).sort((a,b)=>new Date(a.completedAt)-new Date(b.completedAt));

  const st={loads:list.length,net:0,disp:0,dispNet:0,recv:0,recvNet:0,
            byProduct:{},byCustomer:{},turn:[],onSite:pending.length,list};
  list.forEach(t=>{
    const n=Number(t.net)||0; st.net+=n;
    if(txDir(t)==='dispatch'){ st.disp++; st.dispNet+=n; } else if(txDir(t)==='receive'){ st.recv++; st.recvNet+=n; }
    const p=t.product||'—'; st.byProduct[p]=st.byProduct[p]||{loads:0,net:0};
    st.byProduct[p].loads++; st.byProduct[p].net+=n;
    const c=t.customer||'—'; st.byCustomer[c]=st.byCustomer[c]||{loads:0,net:0};
    st.byCustomer[c].loads++; st.byCustomer[c].net+=n;
    if(t.firstWeightTime&&t.secondWeightTime){
      const m=(new Date(t.secondWeightTime)-new Date(t.firstWeightTime))/60000;
      if(m>0&&m<24*60) st.turn.push(m);
    }
  });
  st.avgTurn=st.turn.length?Math.round(st.turn.reduce((a,b)=>a+b,0)/st.turn.length):null;
  return st;
}
const _t=n=>(Number(n)/1000).toFixed(3);

// ── the payload ──────────────────────────────────────────────────────────

    csvRows.push([t.id,t.customer,t.product,txDirReport(t),fmtD(t.completedAt),
      fmtT(t.firstWeightTime),fmtT(t.secondWeightTime),t.vehicleReg,
      both?Math.min(w1,w2):'',both?Math.max(w1,w2):'',t.net,
      cf(t,'cfBatch')||t.batchNo||'',t.dispatchTicketNo||'',t.destination,t.transporter,
      (orders.find(o=>o.id===t.orderId)||{}).no||t.orderNoManual||'',
      cf(t,'cfTrl1'),cf(t,'cfTrl2'),cf(t,'cfSeal'),t.bridgeName,t.operatorName,t.driver,t.supplier]);
  });
  csvRows.push([]); csvRows.push(['TOTAL',st.loads+' loads','','','','','','','','',st.net]);
  const csv='\uFEFF'+csvRows.map(r=>r.map(q).join(',')).join('\r\n');

  return {subject,text,html,csv,
    csvName:(title.replace(/[^\w -]/g,'')||'Report')+' '+txYMD(range.from.toISOString())+'.csv',
    stats:st,range};
}

// ── the queue ────────────────────────────────────────────────────────────
function repEnqueue(s,at,manual){
  const built=repBuild(s,at);
  if(!built.stats.loads && s.skipEmpty && !manual){
    return {skipped:true};                       // nothing happened — say nothing
  }
  const job={
    id:'rj'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    schedId:s.id, name:s.name||'Report', at:nowISO(), manual:!!manual,
    subject:built.subject, text:built.text, html:built.html,
    csv:s.attachCsv!==false?built.csv:'', csvName:built.csvName,
    loads:built.stats.loads, tonnes:_t(built.stats.net),
    period:built.range.label,
    to:(s.to||'').trim(), waTo:(s.waTo||'').trim(),
    channels:{}, tries:0, nextTry:0, status:'queued'
  };
  (s.channels||['email']).forEach(c=>{ job.channels[c]={state:'queued',error:''}; });
  repOutbox.unshift(job); repSaveOutbox();
  return job;
}
function _repBackoff(tries){ return Math.min(30,Math.pow(2,tries))*60000; }   // 1,2,4…30 min
/* Flushes are serialised rather than skipped. An earlier version returned
   early if a flush was already running, which quietly swallowed a "Send now"
   pressed while a slow SMTP attempt was in flight. Chaining onto the running
   promise means every caller waits its turn and nothing is dropped. */
let _repFlushP=null;
function repFlush(){
  _repFlushP=(_repFlushP||Promise.resolve()).then(_repFlushRun,_repFlushRun);
  return _repFlushP;
}
async function _repFlushRun(){
  {
    const now=Date.now();
    for(const job of repOutbox){
      if(job.status==='sent'||job.status==='failed') continue;
      if(job.nextTry&&now<job.nextTry) continue;
      let anyLeft=false, anyTried=false;
      for(const ch of Object.keys(job.channels)){
        const c=job.channels[ch];
        if(c.state==='sent') continue;
        anyTried=true;
        const r=await repSend(ch,job);
        if(r.ok){ c.state='sent'; c.error=''; c.at=nowISO(); }
        else { c.state='error'; c.error=r.error||'failed'; anyLeft=true; }
      }
      if(anyTried){
        job.tries++;
        if(!anyLeft){
          job.status='sent'; job.sentAt=nowISO();
          const s=(repCfg().schedules||[]).find(x=>x.id===job.schedId);
          if(s){ s.lastSentAt=nowISO(); s.lastResult='sent'; saveCfg(); }
          auditLog('config','report',job.schedId,'Sent "'+job.name+'" — '+job.period+' ('+job.loads+' loads)');
        }else if(job.tries>=8){
          job.status='failed';
          auditLog('config','report',job.schedId,'GAVE UP on "'+job.name+'" after 8 tries');
        }else{
          job.status='retry'; job.nextTry=Date.now()+_repBackoff(job.tries);
        }
        repSaveOutbox();
        if(currentTab==='reports') renderReports();
      }
    }
  }
}

// ── channels ─────────────────────────────────────────────────────────────
async function repSend(ch,job){
  try{
    if(ch==='email')    return await repSendEmail(job);
    if(ch==='whatsapp') return await repSendWhatsApp(job);
    if(ch==='webhook')  return await repSendWebhook(job);
    return {ok:false,error:'unknown channel'};
  }catch(e){ return {ok:false,error:String(e.message||e)}; }
}
async function repSendEmail(job){
  const m=repCfg().smtp;
  if(!window.issDesktop||!window.issDesktop.sendMail)
    return {ok:false,error:'E-mail only works in the installed desktop app'};
  if(!m.host) return {ok:false,error:'No SMTP server configured (Reports → E-mail)'};
  const to=job.to||m.defaultTo||'';
  if(!to) return {ok:false,error:'No recipient on this schedule'};
  return await window.issDesktop.sendMail({
    host:m.host, port:parseInt(m.port)||587, secure:!!m.secure,
    user:m.user, pass:m.pass,
    from:m.from||m.user, fromName:m.fromName||((cfg.ticket&&cfg.ticket.companyName)||'Weighbridge'),
    to, subject:job.subject, text:job.text, html:job.html,
    attachments:job.csv?[{filename:job.csvName,type:'text/csv',content:job.csv}]:[]
  });
}
/* WhatsApp, three ways — see the note in the Reports tab for why.
   cloud   : Meta Cloud API. Business-initiated, so it MUST be a pre-approved
             template; free text outside the 24-hour window is rejected by Meta,
             not by us. Template params carry the numbers.
   webhook : POST the whole payload to n8n / Make / your own bridge, which then
             sends however it likes. The escape hatch, and the one that copes
             with long messages.
   link    : wa.me click-to-send. Opens WhatsApp with the report typed out; a
             person presses send. Zero setup, but not unattended. */
async function repSendWhatsApp(job){
  const w=repCfg().wa;
  const nums=(job.waTo||w.to||'').split(/[,;\s]+/).map(n=>n.replace(/[^\d]/g,'')).filter(Boolean);
  if(!nums.length) return {ok:false,error:'No WhatsApp number set'};
  if(w.mode==='link'){
    if(!window.issDesktop||!window.issDesktop.openExternal) return {ok:false,error:'Click-to-send needs the desktop app'};
    for(const n of nums) await window.issDesktop.openExternal('https://wa.me/'+n+'?text='+encodeURIComponent(job.text));
    return {ok:true,note:'opened in WhatsApp — press send'};
  }
  if(w.mode==='webhook'){
    if(!w.webhook) return {ok:false,error:'No webhook URL set'};
    const r=await window.issDesktop.httpPost({url:w.webhook,headers:w.webhookAuth?{Authorization:w.webhookAuth}:{},
      body:{channel:'whatsapp',to:nums,subject:job.subject,text:job.text,
            period:job.period,loads:job.loads,tonnes:job.tonnes,site:cfg.siteCode||''}});
    return r.ok?{ok:true}:{ok:false,error:r.error||'webhook rejected'};
  }
  // cloud
  if(!w.phoneId||!w.token) return {ok:false,error:'Phone number ID and token needed (Reports → WhatsApp)'};
  if(!w.template) return {ok:false,error:'No approved template name set'};
  const params=[job.name,job.period,String(job.loads),job.tonnes].map(t=>({type:'text',text:String(t).slice(0,300)}));
  for(const n of nums){
    const r=await window.issDesktop.httpPost({
      url:'https://graph.facebook.com/v21.0/'+encodeURIComponent(w.phoneId)+'/messages',
      headers:{Authorization:'Bearer '+w.token},
      body:{messaging_product:'whatsapp',to:n,type:'template',
            template:{name:w.template,language:{code:w.lang||'en'},
                      components:[{type:'body',parameters:params}]}}
    });
    if(!r.ok) return {ok:false,error:(r.error||'Meta rejected the message')+(r.status?' ('+r.status+')':'')};
  }
  return {ok:true};
}
async function repSendWebhook(job){
  const w=repCfg().wa;
  const url=w.reportWebhook||w.webhook;
  if(!url) return {ok:false,error:'No webhook URL set'};
  const r=await window.issDesktop.httpPost({url,headers:w.webhookAuth?{Authorization:w.webhookAuth}:{},
    body:{channel:'report',site:cfg.siteCode||'',name:job.name,period:job.period,
          subject:job.subject,text:job.text,html:job.html,
          loads:job.loads,tonnes:job.tonnes,csv:job.csv||null,csvName:job.csvName}});
  return r.ok?{ok:true}:{ok:false,error:r.error||'webhook rejected'};
}

// ── the clock ────────────────────────────────────────────────────────────
let _repTimer=null;
function repStart(){
  if(_repTimer) clearInterval(_repTimer);
  _repTimer=setInterval(repTick,60000);
  setTimeout(repTick,8000);            // let the app finish booting first
}
function repTick(){
  const c=repCfg();
  if(c.host){
    const now=new Date();
    (c.schedules||[]).forEach(s=>{
      if(!s.on) return;
      const key=repSlotKey(s,now);
      if(!key||s.lastKey===key) return;
      s.lastKey=key; saveCfg();
      repEnqueue(s,now);
    });
  }
  repFlush();                          // retries run even on a non-host PC
}

function saveRepSchedule(id){
  const c=repCfg();
  const V=i=>{const e=document.getElementById(i);return e?e.value:'';};
  const C=i=>{const e=document.getElementById(i);return !!(e&&e.checked);};
  const name=V('rs-name').trim(); if(!name){toast('Give the report a name','error');return;}
  const _sh=_repShiftRead();
  if(V('rs-freq')==='shift'&&!_sh.ends.length){toast('Add at least one shift end time','error');return;}
  const channels=[]; if(C('rs-c-email'))channels.push('email'); if(C('rs-c-wa'))channels.push('whatsapp'); if(C('rs-c-hook'))channels.push('webhook');
  if(!channels.length){toast('Pick at least one way to send it','error');return;}
  if(channels.includes('email')&&!V('rs-to').trim()){toast('E-mail is ticked but there is no address','error');return;}
  const rec={
    id:id||('rs'+Date.now().toString(36)),
    name, freq:V('rs-freq')||'daily', time:V('rs-time')||'06:00',
    everyHours:parseInt(V('rs-hrs'))||8, dow:parseInt(V('rs-dow'))||0, dom:parseInt(V('rs-dom'))||1,
    shiftEnds:_sh.ends, shiftNames:_sh.names,
    channels, to:V('rs-to').trim(), waTo:V('rs-wato').trim(),
    attachCsv:C('rs-csv'), skipEmpty:C('rs-skip'), on:C('rs-on'),
    filters:{product:V('rs-prod')||''}
  };
  const old=(c.schedules||[]).find(x=>x.id===rec.id);
  // Adopt the CURRENT slot as already-done, so creating a 06:00 report at 09:00
  // does not fire a surprise send for this morning.
  rec.lastKey = old?old.lastKey:repSlotKey(rec,new Date());
  rec.lastSentAt = old?old.lastSentAt:'';
  const i=(c.schedules||[]).findIndex(x=>x.id===rec.id);
  if(i>=0) c.schedules[i]=rec; else c.schedules.push(rec);
  saveCfg();
  auditLog(id?'edit':'create','report',rec.id,(id?'Updated ':'Created ')+'report schedule "'+name+'"');
  closeModal(); renderReports(); toast(id?'Schedule saved ✓':'Schedule created ✓','success');
}

// ── FLEET ────────────────────────────────────────
// One record per truck. Shared with the other bridge, and auto-fills the
// weigh form so the clerk types a reg once and everything else appears.
function fleetFind(reg){
  const r=String(reg||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!r) return null;
  return fleet.find(f=>String(f.reg||'').toUpperCase().replace(/\s+/g,'')===r)||null;
}
// ── HAULIER / TRANSPORTER INDEX ───────────────────────────────────────────
// The fleet list is flat, but the yard thinks in hauliers: "who does ABC
// Transport have running today", "send ABC their list to check". This groups
// the same records by transporter without duplicating any data — the fleet
// record stays the single source of truth.
const NO_HAULIER='— no transporter recorded —';
function haulierKey(t){ return String(t||'').trim() || NO_HAULIER; }
function haulierIndex(list){
  const idx={};
  (list||fleet).forEach(f=>{
    const k=haulierKey(f.transporter);
    (idx[k]=idx[k]||{name:k, trucks:[], drivers:{}, tare:0, tareN:0}).trucks.push(f);
    const d=String(f.driver||'').trim();
    if(d) idx[k].drivers[d]=(idx[k].drivers[d]||0)+1;
    if(f.tare){ idx[k].tare+=Number(f.tare); idx[k].tareN++; }
  });
  return Object.values(idx).sort((a,b)=>{
    if(a.name===NO_HAULIER) return 1;            // unknowns last
    if(b.name===NO_HAULIER) return -1;
    return b.trucks.length-a.trucks.length || a.name.localeCompare(b.name);
  });
}
function haulierList(){
  return [...new Set(fleet.map(f=>String(f.transporter||'').trim()).filter(Boolean))].sort();
}
/* Loads run for a haulier over the last 30 days — turns the list into
   something worth looking at rather than just a directory. */
function haulierLoads(name){
  const since=Date.now()-30*864e5;
  const regs=new Set(fleet.filter(f=>haulierKey(f.transporter)===name)
                          .map(f=>String(f.reg||'').toUpperCase().replace(/\s+/g,'')));
  let loads=0, net=0;
  txs.forEach(t=>{
    if(!t.completedAt || new Date(t.completedAt).getTime()<since) return;
    const r=String(t.vehicleReg||'').toUpperCase().replace(/\s+/g,'');
    const byReg=regs.has(r);
    const byName=name!==NO_HAULIER && String(t.transporter||'').trim()===name;
    if(byReg||byName){ loads++; net+=Number(t.net)||0; }
  });
  return {loads,net};
}
/* Export one workbook with a sheet per haulier — what you send out when you
   want every transporter to confirm their own list. */
function exportFleetByHaulier(){
  const groups=haulierIndex();
  if(!groups.length){ toast('No trucks to export','error'); return; }
  const sheets=groups.map(g=>({
    name:_sheetName(g.name),
    rows:[FLEET_TPL_COLS].concat(
      g.trucks.slice().sort((a,b)=>String(a.reg||'').localeCompare(String(b.reg||'')))
       .map(f=>[f.reg||'',f.trailer1||'',f.trailer2||'',f.driver||'',f.transporter||'',
                (f.tare===''||f.tare==null)?'':Number(f.tare)])),
    opts:{head:true,widths:[18,16,16,22,26,12]}
  }));
  try{
    _saveBlob(buildXLSX(sheets),'Fleet-by-Transporter-'+txYMD(nowISO())+'.xlsx');
    toast('Exported '+groups.length+' transporter'+(groups.length!==1?'s':''),'success');
  }catch(e){ console.error(e); toast('Could not build the workbook','error'); }
}
/* Excel sheet names: 31 chars, and : \ / ? * [ ] are illegal. */
function _sheetName(n){
  let x=String(n||'Sheet').replace(/[:\\\/?*\[\]]/g,'-').trim().slice(0,31);
  return x||'Sheet';
}
/* One haulier's list on its own — what you mail to that transporter. */
function exportHaulier(name){
  const g=haulierIndex().find(x=>x.name===name);
  if(!g){ toast('No trucks for that transporter','error'); return; }
  const rows=[FLEET_TPL_COLS].concat(
    g.trucks.slice().sort((a,b)=>String(a.reg||'').localeCompare(String(b.reg||'')))
     .map(f=>[f.reg||'',f.trailer1||'',f.trailer2||'',f.driver||'',f.transporter||'',
              (f.tare===''||f.tare==null)?'':Number(f.tare)]));
  try{
    _saveBlob(buildXLSX([
      {name:_sheetName(name),rows,opts:{head:true,widths:[18,16,16,22,26,12]}},
      {name:'Instructions',rows:FLEET_TPL_NOTE,opts:{widths:[16,80]}}
    ]),'Fleet-'+_sheetName(name).replace(/\s+/g,'-')+'-'+txYMD(nowISO())+'.xlsx');
    toast('Exported '+g.trucks.length+' truck'+(g.trucks.length!==1?'s':'')+' for '+name,'success');
  }catch(e){ console.error(e); toast('Could not build the workbook','error'); }
}

// ── XLSX WRITER ───────────────────────────────────────────────────────────
// A CSV has no column widths, no bold header and no second sheet to put the
// instructions on — which is exactly why the old template read as a wall of
// commas. An .xlsx is a ZIP of XML, and ZIP allows STORED (uncompressed)
// entries, so a workbook can be built here with no library and no
// CompressionStream: just a CRC32 and the right headers.
function _crc32(u8){
  let t=_crc32.t;
  if(!t){ t=_crc32.t=new Int32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c; } }
  let crc=-1;
  for(let i=0;i<u8.length;i++) crc=(crc>>>8)^t[(crc^u8[i])&0xFF];
  return (crc^-1)>>>0;
}
function _zipStore(files){
  const enc=new TextEncoder(), parts=[], cd=[];
  let off=0;
  const d=new Date();
  const dosT=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const dosD=((((d.getFullYear()-1980)&0x7F)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.data, crc=_crc32(data);
    const lfh=new Uint8Array(30+name.length), lv=new DataView(lfh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true); lv.setUint16(10,dosT,true); lv.setUint16(12,dosD,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true); lv.setUint16(28,0,true);
    lfh.set(name,30);
    parts.push(lfh,data);
    const c=new Uint8Array(46+name.length), cv=new DataView(c.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,dosT,true); cv.setUint16(14,dosD,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,off,true);
    c.set(name,46); cd.push(c);
    off+=lfh.length+data.length;
  });
  const cdSize=cd.reduce((a,b)=>a+b.length,0);
  const eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,off,true);
  const all=parts.concat(cd,[eo]);
  const out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));
  let q=0; all.forEach(b=>{ out.set(b,q); q+=b.length; });
  return out;
}
function _xesc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _colName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
/* rows = array of arrays. o.head = style row 1 as a bold, frozen header. */
function _sheetXML(rows,o){
  o=o||{};
  const view=o.head?'<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>':'';
  const cols=o.widths?'<cols>'+o.widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>':'';
  const body=(rows||[]).map((r,ri)=>{
    const cells=(r||[]).map((v,ci)=>{
      if(v==null||v==='') return '';
      const ref=_colName(ci)+(ri+1);
      const st=(o.head&&ri===0)?' s="1"':(o.grey&&o.grey.indexOf(ri)>=0?' s="2"':'');
      if(typeof v==='number'&&isFinite(v)) return '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
      return '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+_xesc(v)+'</t></is></c>';

    sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
    '<Relationship Id="rId'+(n+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';

async function _readSheetFile(f){
  let rows;

  else if(/\.(csv|txt|tsv)$/i.test(f.name)) rows=parseCSVRows(await f.text());

  else { toast('Use the template (.xlsx) or a .csv file','error'); return null; }
  rows=(rows||[]).filter(r=>r&&r.some(c=>String(c||'').trim()!==''));
  if(!rows.length){ toast('That file is empty','error'); return null; }
  return rows;
}
// Work out which column is which from the header row.
function _fleetColMap(hdr){
  const h=(hdr||[]).map(c=>String(c||'').toLowerCase().trim());
  const find=(re,skip)=>{
    for(let i=0;i<h.length;i++){ if(skip&&skip.indexOf(i)>=0) continue; if(re.test(h[i])) return i; }
    return -1;
  };
  const m={};
  m.trailer2   =find(/trailer\s*(2|b|two)/);        // find #2 first, so that
  m.trailer1   =find(/trailer|^trl/,                // #1 can be "any other
                     m.trailer2>=0?[m.trailer2]:null);// trailer column
  m.driver     =find(/driver/);
  m.transporter=find(/transport|carrier|hauli?er/);
  m.tare       =find(/tare|empty\s*(weight|mass)/);
  const used=[m.trailer1,m.trailer2,m.driver,m.transporter,m.tare].filter(i=>i>=0);
  m.reg        =find(/^reg|registration|horse|truck|vehicle|plate|fleet/,used);
  return m;
}
// A word that only ever appears in a heading, never in a number plate. Used to
// tell a real header row apart from a file that starts straight into data.
const FLEET_HDR_WORD=/^(reg|registration|vehicle|truck|horse|plate|fleet\s*(no|number)?)$/i;
let _fleetImport=null;
async function importFleetList(input){
  const f=input.files&&input.files[0]; if(!f) return;
  try{
    const rows=await _readSheetFile(f);
    if(!rows){ input.value=''; return; }

    // Header row, or does the file start straight into data? Treat row 1 as a
    // header when two or more columns are recognised, or when the registration
    // column is plainly a heading. Otherwise fall back to template order.
    let map=_fleetColMap(rows[0]), start=1;
    const hits=Object.keys(map).filter(k=>map[k]>=0).length;
    const regIsHeading=map.reg>=0 && FLEET_HDR_WORD.test(String(rows[0][map.reg]||'').trim());
    if(!(hits>=2 || regIsHeading)){ map={reg:0,trailer1:1,trailer2:2,driver:3,transporter:4,tare:5}; start=0; }
    if(map.reg<0) map.reg=0;

    const parsed=[], seen={};
    for(let i=start;i<rows.length;i++){
      const r=rows[i]||[];
      const cell=k=>(map[k]>=0)?String(r[map[k]]==null?'':r[map[k]]).trim():'';
      let reg=cell('reg');
      if(!reg || reg.charAt(0)==='#') continue;          // blank or comment line
      if(FLEET_HDR_WORD.test(reg)) continue;             // a repeated header inside the file
      reg=normReg(reg);
      if(seen[reg]) continue;                            // duplicated inside the file
      seen[reg]=1;
      const tare=parseFloat(cell('tare').replace(/[^\d.\-]/g,''));
      parsed.push({
        reg,
        trailer1:normReg(cell('trailer1')),
        trailer2:normReg(cell('trailer2')),
        driver:cell('driver'),
        transporter:cell('transporter'),
        tare:(isFinite(tare)&&tare>0)?tare:''
      });
    }
    if(!parsed.length){ toast('No vehicle registrations found in that file','error',5000); input.value=''; return; }
    _fleetImport=parsed;
    _fleetImportPreview(f.name);
  }catch(e){
    console.error(e);
    toast('Could not read file: '+(e.message||e),'error',6000);
  }
  input.value='';
}

  if(!Array.isArray(db[cat])) db[cat]=[];
  if(db[cat].some(x=>String(x.name||'').trim().toLowerCase()===n.toLowerCase())) return false;
  db[cat].push({name:n}); return true;
}
function commitFleetImport(){
  const list=_fleetImport||[];
  if(!list.length){ closeModal(); return; }
  let added=0, updated=0, dbNew=0, seq=0;
  const stamp=Date.now().toString(36);
  list.forEach(r=>{
    const ex=fleetFind(r.reg);
    if(ex){
      let changed=false;
      ['trailer1','trailer2','driver','transporter'].forEach(k=>{
        if(r[k] && r[k]!==ex[k]){ ex[k]=r[k]; changed=true; }
      });
      if(r.tare && Number(r.tare)!==Number(ex.tare)){ ex.tare=r.tare; changed=true; }
      if(changed){ ex._at=nowISO(); updated++; }
    }else{
      fleet.push({
        id:'fl'+stamp+(seq++).toString(36),
        reg:r.reg, trailer1:r.trailer1, trailer2:r.trailer2,
        transporter:r.transporter, driver:r.driver, tare:r.tare, _at:nowISO()
      });
      added++;
    }
    if(_dbEnsure('transporters',r.transporter)) dbNew++;
    if(_dbEnsure('drivers',r.driver)) dbNew++;
  });
  saveFleet(); if(dbNew) saveDB();
  auditLog('create','fleet','','Imported fleet list — '+added+' added, '+updated+' updated');
  _fleetImport=null;
  closeModal(); renderFleet();
  toast('✓ Fleet imported — '+added+' added, '+updated+' updated','success',6000);
}

function delFleet(id){
  const f=fleet.find(x=>x.id===id);
  if(!confirm('Remove '+(f?.reg||'this truck')+' from the fleet?\n\nExisting records keep their details.'))return;
  fleet=fleet.filter(x=>x.id!==id);
  saveFleet(); shareDel('fleet',id);
  auditLog('delete','fleet',id,'Removed '+(f?.reg||id)+' from fleet');
  renderFleet();
}

function buildHourChart(txArr){

function autoFillReg(reg){
  if(!reg||reg.length<3)return;
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&!el.value&&v)el.value=v;};
  // 1. Fleet record first — trailers, transporter, driver
  const f=fleetFind(reg);
  if(f){
    set('f-trans',f.transporter); set('f-driver',f.driver);
    const cf=cfg.customFields||[];
    const t1=cf.find(c=>/trailer\s*1/i.test(c.label)), t2=cf.find(c=>/trailer\s*2/i.test(c.label));
    if(t1) set('f-cf-'+t1.id,f.trailer1);
    if(t2) set('f-cf-'+t2.id,f.trailer2);
  }
  // 2. Then last load for this reg — product, customer, route
  const last=txs.find(t=>t.vehicleReg===reg);
  if(!last)return;
  set('f-prod',last.product);set('f-cust',last.customer);set('f-trans',last.transporter);
  set('f-sup',last.supplier);set('f-dest',last.destination);set('f-driver',last.driver);
}
function applyOrder(val){
  // val may be an order NUMBER (typed/picked) or an id. Match either.
  const o=orders.find(x=>String(x.no)===String(val)||x.id===val);
  if(!o) return;   // free-typed number with no matching order — nothing to autofill
  const set=(el,v)=>{const e=document.getElementById(el);if(e&&v)e.value=v;};
  set('f-prod',o.product);set('f-cust',o.customer);set('f-trans',o.transporter);
  set('f-sup',o.supplier);set('f-dest',o.destination);
  toast('Order '+o.no+' applied'+(o.fleet?.length?' · fleet restricted ('+o.fleet.length+' regs)':''),'info');
}

// ── FLEET IMPORT (Excel .xlsx / .csv) ─────────────
// .xlsx is a ZIP of XML. Electron/Chromium ships DecompressionStream('deflate-raw'),
// so we can read a real spreadsheet offline with no external library.
async function _inflateRaw(bytes){
  const ds=new DecompressionStream('deflate-raw');
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function _unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), files={};
  // find End Of Central Directory
  let eocd=-1;
  for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('Not a valid .xlsx (no ZIP directory)');
  const count=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true);
    const extraLen=dv.getUint16(p+30,true);
    const commLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    // local header -> data offset
    const lNameLen=dv.getUint16(lho+26,true), lExtraLen=dv.getUint16(lho+28,true);
    const dataStart=lho+30+lNameLen+lExtraLen;
    const raw=u8.subarray(dataStart,dataStart+csize);
    files[name]= method===0 ? Promise.resolve(raw) : _inflateRaw(raw);
    p+=46+nameLen+extraLen+commLen;
  }
  for(const k of Object.keys(files)) files[k]=await files[k];
  return files;
}
function _colToIdx(ref){ // "BC12" -> 54
  const m=/^([A-Z]+)/.exec(ref); if(!m) return 0;
  let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}
async function parseXLSX(buf){
  const files=await _unzip(buf);
  const dec=new TextDecoder();
  const P=new DOMParser();
  // shared strings
  let shared=[];
  if(files['xl/sharedStrings.xml']){
    const d=P.parseFromString(dec.decode(files['xl/sharedStrings.xml']),'application/xml');
    shared=[...d.getElementsByTagName('si')].map(si=>
      [...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  }
  // first worksheet
  const sheetName=Object.keys(files).filter(n=>/^xl\/worksheets\/sheet\d*\.xml$/.test(n)).sort()[0];
  if(!sheetName) throw new Error('No worksheet found in workbook');
  const d=P.parseFromString(dec.decode(files[sheetName]),'application/xml');
  const rows=[];
  for(const row of d.getElementsByTagName('row')){
    const cells=[];
    for(const c of row.getElementsByTagName('c')){
      const idx=_colToIdx(c.getAttribute('r')||'A1');
      const t=c.getAttribute('t');
      let v='';
      if(t==='inlineStr'){ v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''); }
      else{
        const vEl=c.getElementsByTagName('v')[0];
        if(vEl){ v=vEl.textContent; if(t==='s') v=shared[parseInt(v)]??''; }
      }
      cells[idx]=String(v).trim();
    }
    rows.push(cells);
  }
  return rows;
}
function parseCSVRows(text){
  const rows=[]; let cell='',row=[],q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(c==='"'){q=false;}
      else cell+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','||c===';'||c==='\t'){row.push(cell);cell='';}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else if(c!=='\r')cell+=c;
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function normReg(s){ return String(s||'').trim().toUpperCase().replace(/\s+/g,' '); }
// Pick the registration column: prefer a header named reg/vehicle/fleet/plate, else col A.
function extractRegs(rows){
  if(!rows.length) return [];
  const hdr=(rows[0]||[]).map(c=>String(c||'').toLowerCase());
  let col=hdr.findIndex(h=>/reg|vehicle|fleet|plate|truck|horse/.test(h));
  let start=0;
  if(col>=0) start=1; else col=0;
  const out=[];
  for(let i=start;i<rows.length;i++){
    const v=normReg((rows[i]||[])[col]);
    if(v && !/^(reg|registration|vehicle|fleet|plate)$/i.test(v)) out.push(v);
  }
  return [...new Set(out)];
}
async function importFleetFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  try{
    let rows;
    if(/\.xlsx$/i.test(f.name)) rows=await parseXLSX(await f.arrayBuffer());
    else if(/\.(csv|txt|tsv)$/i.test(f.name)) rows=parseCSVRows(await f.text());
    else if(/\.xls$/i.test(f.name)){ toast('Old .xls not supported — save as .xlsx or .csv','error',6000); input.value=''; return; }
    else { toast('Use a .xlsx or .csv file','error'); input.value=''; return; }
    const regs=extractRegs(rows);
    if(!regs.length){ toast('No vehicle registrations found in that file','error',5000); input.value=''; return; }
    const ta=document.getElementById('o-fleet');
    const existing=(ta.value||'').split(/[\n,;]+/).map(normReg).filter(Boolean);
    const merged=[...new Set([...existing,...regs])];
    ta.value=merged.join('\n');
    const added=merged.length-existing.length;
    toast('✓ Imported '+regs.length+' registration'+(regs.length!==1?'s':'')+' ('+added+' new) from '+f.name,'success',5000);
  }catch(e){
    console.error(e);
    toast('Could not read file: '+(e.message||e),'error',6000);
  }
  input.value='';
}

function _orderColMap(hdr){
  const h=(hdr||[]).map(c=>String(c||'').toLowerCase().trim());
  const find=(re,skip)=>{ for(let i=0;i<h.length;i++){ if(skip&&skip.indexOf(i)>=0) continue; if(re.test(h[i])) return i; } return -1; };
  const m={};
  m.no         =find(/order|^no$|reference|ref\b/);
  m.customer   =find(/customer|client|buyer/);
  m.product    =find(/product|grade|material|commodity/);
  m.supplier   =find(/supplier|source|mine|colliery/);
  m.destination=find(/destination|deliver|to\b|discharge/);
  m.transporter=find(/transport|carrier|hauli?er/);
  m.target     =find(/target|tonn|tons|quantity|qty/);
  m.regs       =find(/reg|vehicle|truck|fleet|plate/);
  return m;
}
let _orderImport=null;
async function importOrderList(input){
  const f=input.files&&input.files[0]; if(!f) return;
  try{
    let rows=await _readSheetFile(f);
    if(!rows){ input.value=''; return; }
    let map=_orderColMap(rows[0]), start=1;
    const hits=Object.keys(map).filter(k=>map[k]>=0).length;
    if(hits<2){ map={no:0,customer:1,product:2,supplier:3,destination:4,transporter:5,target:6,regs:7}; start=0; }
    if(map.no<0) map.no=0;
    const parsed=[], seen={};
    for(let i=start;i<rows.length;i++){
      const r=rows[i]||[];
      const cell=k=>(map[k]>=0)?String(r[map[k]]==null?'':r[map[k]]).trim():'';
      const no=cell('no');
      if(!no || no.charAt(0)==='#') continue;
      if(/^(order|order\s*no|reference)$/i.test(no)) continue;
      if(seen[no.toUpperCase()]) continue;
      seen[no.toUpperCase()]=1;
      const tn=parseFloat(cell('target').replace(/[^\d.\-]/g,''));
      parsed.push({
        no, customer:cell('customer'), product:cell('product'), supplier:cell('supplier'),
        destination:cell('destination'), transporter:cell('transporter'),
        targetKg:(isFinite(tn)&&tn>0)?Math.round(tn*1000):null,
        fleet:cell('regs').split(/[;,\n|]+/).map(normReg).filter(Boolean)
      });
    }
    if(!parsed.length){ toast('No order numbers found in that file','error',5000); input.value=''; return; }
    _orderImport=parsed;
    _orderImportPreview(f.name);

  input.value='';
}

function commitOrderImport(){
  const list=_orderImport||[];
  if(!list.length){ closeModal(); return; }
  let added=0, updated=0, dbNew=0, seq=0;
  const stamp=Date.now();
  list.forEach(o=>{
    const ex=orders.find(x=>String(x.no)===String(o.no));
    if(ex){
      let ch=false;
      ['customer','product','supplier','destination','transporter'].forEach(k=>{
        if(o[k] && o[k]!==ex[k]){ ex[k]=o[k]; ch=true; } });
      if(o.targetKg && o.targetKg!==ex.targetKg){ ex.targetKg=o.targetKg; ch=true; }
      if(o.fleet.length){ ex.fleet=o.fleet; ch=true; }
      if(ch){ ex._at=nowISO(); updated++; }
    }else{
      orders.unshift({id:'O'+(stamp+seq++),created:nowISO(),no:o.no,customer:o.customer,
        product:o.product,supplier:o.supplier,destination:o.destination,transporter:o.transporter,
        rate:null,targetKg:o.targetKg,fleet:o.fleet,active:true,_at:nowISO()});
      added++;
    }
    if(_dbEnsure('customers',o.customer)) dbNew++;
    if(_dbEnsure('products',o.product)) dbNew++;
    if(_dbEnsure('suppliers',o.supplier)) dbNew++;
    if(_dbEnsure('destinations',o.destination)) dbNew++;
    if(_dbEnsure('transporters',o.transporter)) dbNew++;
  });
  saveOrders(); if(dbNew) saveDB();
  auditLog('create','order','','Imported orders — '+added+' added, '+updated+' updated');
  _orderImport=null; closeModal(); renderOrdersTab();
  toast('\u2713 Orders imported — '+added+' added, '+updated+' updated','success',6000);
}

function saveOrder(){
  const no=(document.getElementById('o-no')?.value||'').trim();
  if(!no){toast('Order number required','error');return;}
  const fleet=document.getElementById('o-fleet')?.value.split(/[\n,;]+/).map(r=>r.trim().toUpperCase().replace(/\s+/g,' ')).filter(Boolean)||[];
  const data={no,product:(document.getElementById('o-prod')?.value||'').trim(),customer:(document.getElementById('o-cust')?.value||'').trim(),
    transporter:(document.getElementById('o-trans')?.value||'').trim(),supplier:(document.getElementById('o-sup')?.value||'').trim(),
    destination:(document.getElementById('o-dest')?.value||'').trim(),rate:parseFloat(document.getElementById('o-rate')?.value)||null,
    targetKg:parseFloat(document.getElementById('o-tkg')?.value)*1||null,fleet,active:true};
  if(editingOrder){
    const i=orders.findIndex(x=>x.id===editingOrder);
    if(i>=0)orders[i]=Object.assign(orders[i],data);
  }else{
    if(orders.find(x=>x.no===no)){toast('Order number already exists','error');return;}
    orders.unshift({id:'O'+Date.now(),created:nowISO(),...data});
  }
  saveOrders();closeModal();renderOrdersTab();toast('Order saved ✓','success');
}

let recFilter={q:'',from:'',to:'',bridge:'',prod:'',dir:'',cfId:'',cfVal:''};
function applyFilters(){
  recFilter.q=document.getElementById('r-q')?.value||'';
  recFilter.from=document.getElementById('r-from')?.value||'';
  recFilter.to=document.getElementById('r-to')?.value||'';
  recFilter.bridge=document.getElementById('r-bridge')?.value??'';
  recFilter.prod=document.getElementById('r-prod')?.value||'';
  recFilter.dir=document.getElementById('r-dir')?.value||'';
  const prevCf=recFilter.cfId;
  recFilter.cfId=document.getElementById('r-cf')?.value||'';
  recFilter.cfVal=document.getElementById('r-cfv')?.value||'';
  if(prevCf!==recFilter.cfId) recFilter.cfVal='';   // switching field clears the value
  renderRecords();
}
function setRange(preset){
  const today=new Date(); const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let from='',to=ymd(today);
  if(preset==='today'){ from=ymd(today); }
  else if(preset==='7'){ const d=new Date(today); d.setDate(d.getDate()-6); from=ymd(d); }
  else if(preset==='30'){ const d=new Date(today); d.setDate(d.getDate()-29); from=ymd(d); }
  else if(preset==='month'){ from=ymd(new Date(today.getFullYear(),today.getMonth(),1)); }
  else if(preset==='all'){ from=''; to=''; }
  recFilter.from=from; recFilter.to=to;
  const fEl=document.getElementById('r-from'), tEl=document.getElementById('r-to');
  if(fEl) fEl.value=from; if(tEl) tEl.value=to;
  renderRecords();
}
function filteredTxs(){
  return txs.filter(t=>{
    if(recFilter.q){
      const cf=(t.custom||[]).map(c=>c.value).join(' ');
      const hay=[t.vehicleReg,t.product,t.customer,t.transporter,t.supplier,t.destination,t.driver,t.id,cf].join(' ').toLowerCase();
      if(!hay.includes(recFilter.q.toLowerCase()))return false;
    }
    if(recFilter.cfId&&recFilter.cfVal){
      const c=(t.custom||[]).find(x=>x.id===recFilter.cfId);
      if(!c||!String(c.value).toLowerCase().includes(recFilter.cfVal.toLowerCase()))return false;
    }
    const ymd=txYMD(t.completedAt);
    if(recFilter.from&&ymd<recFilter.from)return false;
    if(recFilter.to&&ymd>recFilter.to)return false;
    if(recFilter.bridge!==''&&String(t.bridge)!==String(recFilter.bridge))return false;
    if(recFilter.prod&&t.product!==recFilter.prod)return false;
    if(recFilter.dir&&txDir(t)!==recFilter.dir)return false;
    return true;
  });
}
function rangeLabel(){
  if(recFilter.from&&recFilter.to) return ' · '+recFilter.from+' → '+recFilter.to;
  if(recFilter.from) return ' · from '+recFilter.from;
  if(recFilter.to) return ' · up to '+recFilter.to;
  return ' · all dates';
}
function reprintThermal(id){const t=txs.find(x=>x.id===id);if(t){auditLog('reprint','tx',id,'Reprinted thermal '+t.vehicleReg);printThermal(t);}}
function reprintA4(id){const t=txs.find(x=>x.id===id);if(t){auditLog('reprint','tx',id,'Reprinted A4 '+t.vehicleReg);printA4(t);}}
function exportCSV(){
  const f=filteredTxs();
  if(!f.length){toast('No records','error');return;}
  const u=cfg.weightUnit||'kg';
  const q=v=>{ let s=(v==null?'':String(v)).replace(/\r?\n/g,' '); return '"'+s.replace(/"/g,'""')+'"'; };
  const row=arr=>arr.map(q).join(',');
  // Resolve the human order NUMBER: from a matching order record, else the
  // free-typed order number stored on the tx. Never emit the internal id.
  const ordNo=t=>{
    if(t.orderId){ const o=orders.find(x=>x.id===t.orderId); if(o) return o.no||''; }
    return t.orderNoManual||'';
  };
  // Batch and Dispatch Ticket Nr: prefer the explicit fields set at 1st weigh,
  // fall back to the cfBatch custom field for older records.
  const cf=(t,id)=>((t.custom||[]).find(c=>c.id===id)||{}).value||'';
  const batchOf=t=>t.batchNo||cf(t,'cfBatch');
  const dispOf =t=>t.dispatchTicketNo||'';
  // Column order mirrors the client's spreadsheet exactly. One blank spacer
  // remains, at position 2. "Action" = load direction (from the 1st-weigh choice).
  // Weights run Empty, Full, Net after Reg. Dispatch Ticket Nr sits next to Batch.
  // 24 columns total.
  const cols=['Ticket','','Customer','Product','Action','Date','Time In','Time Out','Reg',
              'Empty Weight ('+u+')','Full Weight ('+u+')','Net ('+u+')',
              'Batch No','Dispatch Ticket Nr','Destination','Transporter','Order','Trailer 1','Trailer 2',
              'Seal No','Bridge','Operator','Driver','Supplier'];
  const lines=[];
  // report header block
  lines.push(row([(cfg.companyName||ISS_CO.name)+' Weighbridge — Records Report']));
  lines.push(row(['Site',cfg.siteName||cfg.companyName||ISS.name]));
  lines.push(row(['Period',(recFilter.from||'start')+' to '+(recFilter.to||'today')]));
  lines.push(row(['Generated',fmtDT(new Date().toISOString())]));
  lines.push('');
  lines.push(row(cols));
  let totNet=0,tot1=0,tot2=0;
  f.forEach(t=>{
    const net=t.net||0; totNet+=net; tot1+=t.firstWeight||0; tot2+=t.secondWeight||0;
    // Full = heavier weight, Empty = lighter — purely by mass, independent of
    // weigh order or direction. If a weight is missing, leave both blank.
    const w1=t.firstWeight, w2=t.secondWeight;
    const haveBoth=(w1!=null&&w2!=null);
    const full=haveBoth?Math.max(w1,w2):'';
    const empty=haveBoth?Math.min(w1,w2):'';
    lines.push(row([
      t.id, '', t.customer, t.product, txDirReport(t), fmtD(t.completedAt), fmtT(t.firstWeightTime), fmtT(t.secondWeightTime), t.vehicleReg,
      empty, full, net,
      batchOf(t), dispOf(t), t.destination, t.transporter, ordNo(t),
      cf(t,'cfTrl1'), cf(t,'cfTrl2'), cf(t,'cfSeal'), t.bridgeName, t.operatorName, t.driver, t.supplier
    ]));
  });
  // totals row: loads count in col 9, Net total under Net column = position 12
  lines.push(row(['TOTAL','','','','','','','',f.length+' loads','','',totNet]));
  lines.push(row(['','','','','','','','','','','Net tonnes',(totNet/1000).toFixed(3)]));
  // product summary
  const byProd={}; f.forEach(t=>{ byProd[t.product||'—']=(byProd[t.product||'—']||0)+(t.net||0); });
  lines.push('');
  lines.push(row(['Product Summary','Net ('+u+')','Tonnes']));
  Object.entries(byProd).sort((a,b)=>b[1]-a[1]).forEach(([p,n])=>lines.push(row([p,n,(n/1000).toFixed(3)])));

  const csv='\uFEFF'+lines.join('\r\n');   // BOM => Excel opens columns cleanly
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const tag=(recFilter.from||recFilter.to)?((recFilter.from||'')+'_'+(recFilter.to||'')):new Date().toISOString().slice(0,10);
  a.download='ISS-Records-'+tag+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  auditLog('config','records','','Exported CSV ('+f.length+' rows)');
  toast('CSV exported — '+f.length+' rows, '+(totNet/1000).toFixed(2)+' t','success');
}
